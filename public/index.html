<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trợ lý hỗ trợ phần mềm</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', 'IBM Plex Sans', sans-serif; background: #F3F1EC; color: #1E2A32; }
  @keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/plain" id="app-source">
const { useState, useEffect, useRef } = React;

const CATEGORIES = [
  { id: "HD", label: "Hướng dẫn thao tác" },
  { id: "LOI", label: "Lỗi thường gặp" },
  { id: "CS", label: "Chính sách / Quy trình" },
  { id: "335", label: "335" },
  { id: "KHAC", label: "Khác" },
];
function getCategoryLabel(id) {
  const found = CATEGORIES.find((c) => c.id === id);
  return found ? found.label : id;
}
function resolveCategoryId(raw, defaultId) {
  const clean = String(raw || "").trim().toLowerCase();
  if (!clean) return defaultId;
  const byId = CATEGORIES.find((c) => c.id.toLowerCase() === clean);
  if (byId) return byId.id;
  const byLabel = CATEGORIES.find((c) => c.label.toLowerCase() === clean);
  if (byLabel) return byLabel.id;
  return defaultId;
}
const EXAMPLE_QUESTION = "Làm sao để đặt lại mật khẩu?";
const DEFAULT_GREETING = "Chào bạn, tôi là chatbot hỗ trợ phần mềm. Hãy đặt câu hỏi, tôi sẽ trả lời dựa trên tài liệu hướng dẫn đã được nạp.";

function authHeaders(adminToken) {
  const h = { "Content-Type": "application/json" };
  if (adminToken) h["x-admin-token"] = adminToken;
  return h;
}

// Chuẩn hoá ký tự xuống dòng (Excel/Windows hay dùng \r\n) về \n thống nhất,
// để hiển thị đúng định dạng xuống dòng đã gõ trong Excel / khi dán dữ liệu.
function normalizeLineBreaks(str) {
  return String(str || "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
}

// ===== Tìm kiếm cục bộ theo từ khoá (không dùng AI) =====
// So khớp ký tự thô (kiểu Fuse.js) không hợp với tiếng Việt vì câu hỏi diễn
// đạt lại khác chút là bị lệch điểm rất nhiều. Cách này bỏ dấu, bỏ từ đệm rồi
// so khớp theo từ, ổn định hơn nhiều cho câu hỏi tiếng Việt viết tự do.
const VN_STOPWORDS = new Set([
  "la","cua","va","cac","nhung","co","duoc","the","nao","cho","de","khi","toi","ban","minh",
  "lam","sao","gi","nhu","nay","do","mot","voi","ve","tai","hay","hoac","da","se","phai","can",
  "muon","xin","vay","oi","nhe","trong","nhu","o","ra","vao","tu","den","neu","thi","ma","hon",
  "nhat","nhung","nen","bi","bang","theo",
]);
function normalizeVN(str) {
  return String(str || "")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/đ/g, "d")
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}
function tokenizeVN(str) {
  return normalizeVN(str).split(" ").filter((w) => w && w.length > 1 && !VN_STOPWORDS.has(w));
}
function scoreKbEntry(queryTokens, entry) {
  if (queryTokens.length === 0) return 0;
  const titleTokens = new Set(tokenizeVN(entry.title));
  const contentTokens = new Set(tokenizeVN(entry.content));
  let titleHits = 0;
  let contentHits = 0;
  queryTokens.forEach((t) => {
    if (titleTokens.has(t)) titleHits += 1;
    else if (contentTokens.has(t)) contentHits += 1;
  });
  return (titleHits * 1.0 + contentHits * 0.4) / queryTokens.length;
}
// Ngưỡng "đủ tin cậy" để trả lời thẳng từ tài liệu, không cần gọi AI (0 = không khớp gì, 1 = khớp hết).
const KB_MATCH_THRESHOLD = 0.5;

function App() {
  function renderMessageContent(text) {
    const urlRegex = /(https?:\/\/[^\s]+)/g;
    const parts = text.split(urlRegex);
    return parts.map((part, i) => {
      if (!/^https?:\/\//.test(part)) return part;
      const isImage = /\.(png|jpe?g|gif|webp)(\?.*)?$/i.test(part);
      if (isImage) {
        return (
          <img key={i} src={part} alt="Hình minh hoạ" style={{ maxWidth: "100%", maxHeight: 200, borderRadius: 8, display: "block", margin: "6px 0" }} onError={(e) => { e.target.style.display = "none"; }} />
        );
      }
      return (
        <a key={i} href={part} target="_blank" rel="noreferrer" style={{ color: "inherit", textDecoration: "underline", wordBreak: "break-all" }}>
          {part}
        </a>
      );
    });
  }

  const [tab, setTab] = useState("kb");
  const [kbEntries, setKbEntries] = useState([]);
  const [loadingKb, setLoadingKb] = useState(true);
  const [searchQuery, setSearchQuery] = useState("");
  const [filterCategory, setFilterCategory] = useState("ALL");

  const [form, setForm] = useState({ title: "", category: CATEGORIES[0].id, content: "", videoUrl: "", imageUrl: "" });
  const [editingId, setEditingId] = useState(null);
  const [entryMode, setEntryMode] = useState("single");
  const [bulkText, setBulkText] = useState("");
  const [bulkCategory, setBulkCategory] = useState(CATEGORIES[0].id);
  const [importResult, setImportResult] = useState(null);
  const fileInputRef = useRef(null);
  const imageInputRef = useRef(null);
  const [uploadingImage, setUploadingImage] = useState(false);
  const [uploadError, setUploadError] = useState("");

  const [adminToken, setAdminToken] = useState(localStorage.getItem("adminToken") || "");
  const [adminError, setAdminError] = useState("");

  const [settings, setSettings] = useState({ greeting: DEFAULT_GREETING, expertEmail: "" });
  const [settingsForm, setSettingsForm] = useState({ greeting: DEFAULT_GREETING, expertEmail: "" });
  const [settingsSaved, setSettingsSaved] = useState(false);

  const [escalations, setEscalations] = useState([]);

  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const scrollRef = useRef(null);

  useEffect(() => { loadKb(); loadSettings(); loadEscalations(); }, []);
  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages, loading]);

  async function loadKb() {
    try {
      const r = await fetch("/api/kb");
      const data = await r.json();
      setKbEntries(data.entries || []);
    } catch (e) {} finally { setLoadingKb(false); }
  }
  async function loadSettings() {
    try {
      const r = await fetch("/api/settings");
      const data = await r.json();
      setSettings(data);
      setSettingsForm(data);
    } catch (e) {}
  }
  async function loadEscalations() {
    try {
      const r = await fetch("/api/escalations");
      const data = await r.json();
      setEscalations(data || []);
    } catch (e) {}
  }

  async function saveKbEntries(nextEntries) {
    setAdminError("");
    const r = await fetch("/api/kb", { method: "PUT", headers: authHeaders(adminToken), body: JSON.stringify({ entries: nextEntries }) });
    if (r.status === 401) { setAdminError("Sai mã quản trị — vào cuối tab này để nhập lại."); return false; }
    setKbEntries(nextEntries);
    return true;
  }

  async function addEntry() {
    if (!form.title.trim() || !form.content.trim()) return;
    if (editingId) {
      const nextEntries = kbEntries.map((e) => (e.id === editingId ? { ...e, ...form } : e));
      const ok = await saveKbEntries(nextEntries);
      if (ok) {
        setForm({ title: "", category: CATEGORIES[0].id, content: "", videoUrl: "", imageUrl: "" });
        setEditingId(null);
      }
      return;
    }
    const entry = { id: String(Date.now()), ...form };
    const ok = await saveKbEntries([entry, ...kbEntries]);
    if (ok) setForm({ title: "", category: CATEGORIES[0].id, content: "", videoUrl: "", imageUrl: "" });
  }

  function startEdit(entry) {
    setEntryMode("single");
    setForm({
      title: entry.title || "",
      category: entry.category || CATEGORIES[0].id,
      content: entry.content || "",
      videoUrl: entry.videoUrl || "",
      imageUrl: entry.imageUrl || "",
    });
    setEditingId(entry.id);
    setUploadError("");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function cancelEdit() {
    setEditingId(null);
    setForm({ title: "", category: CATEGORIES[0].id, content: "", videoUrl: "", imageUrl: "" });
  }

  async function removeEntry(id) {
    if (editingId === id) cancelEdit();
    await saveKbEntries(kbEntries.filter((e) => e.id !== id));
  }

  function parseBulkImport(text, defaultCategoryId) {
    const entries = [];
    const rawLines = text.split(/\r?\n/);
    const looksTabular = rawLines.some((l) => l.includes("\t"));
    if (looksTabular) {
      rawLines.forEach((line) => {
        if (!line.trim()) return;
        const cols = line.split("\t").map((c) => normalizeLineBreaks(c).trim());
        if (/^(câu hỏi|question)$/i.test(cols[0])) return;
        if (cols.length >= 3 && cols[0] && cols[2]) {
          entries.push({ title: cols[0], category: resolveCategoryId(cols[1], defaultCategoryId), content: cols[2], videoUrl: cols[3] || "", imageUrl: cols[4] || "" });
        } else if (cols.length === 2 && cols[0] && cols[1]) {
          entries.push({ title: cols[0], category: defaultCategoryId, content: cols[1], videoUrl: "", imageUrl: "" });
        }
      });
      return entries;
    }
    const blocks = normalizeLineBreaks(text).split(/\n\s*\n/);
    blocks.forEach((block) => {
      const qMatch = block.match(/câu hỏi\s*:\s*([\s\S]*?)(?:\n(?:danh mục|câu trả lời|video|hình ảnh)\s*:|$)/i);
      const cMatch = block.match(/danh mục\s*:\s*([\s\S]*?)(?:\n(?:câu trả lời|video|hình ảnh)\s*:|$)/i);
      const aMatch = block.match(/câu trả lời\s*:\s*([\s\S]*?)(?:\n(?:video|hình ảnh)\s*:|$)/i);
      const vMatch = block.match(/video\s*:\s*([\s\S]*?)(?:\nhình ảnh\s*:|$)/i);
      const iMatch = block.match(/hình ảnh\s*:\s*([\s\S]*)/i);
      const question = qMatch ? qMatch[1].trim() : "";
      const answer = aMatch ? aMatch[1].trim() : "";
      const category = cMatch ? resolveCategoryId(cMatch[1], defaultCategoryId) : defaultCategoryId;
      const videoUrl = vMatch ? vMatch[1].trim() : "";
      const imageUrl = iMatch ? iMatch[1].trim() : "";
      if (question && answer) entries.push({ title: question, category, content: answer, videoUrl, imageUrl });
    });
    return entries;
  }

  async function importEntries(parsed, source) {
    if (parsed.length === 0) { setImportResult({ added: 0, error: true, source }); return; }
    setAdminError("");
    const r = await fetch("/api/kb/import", { method: "POST", headers: authHeaders(adminToken), body: JSON.stringify({ entries: parsed }) });
    if (r.status === 401) { setAdminError("Sai mã quản trị — vào cuối tab này để nhập lại."); return; }
    const data = await r.json();
    if (data.ok) {
      setKbEntries(data.kb.entries);
      setImportResult({ added: data.added, error: false, source });
    } else {
      setImportResult({ added: 0, error: true, source });
    }
  }

  function handleBulkImport() {
    const parsed = parseBulkImport(bulkText, bulkCategory);
    importEntries(parsed, "paste").then(() => setBulkText(""));
  }

  async function handleExcelFile(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    try {
      const arrayBuffer = await file.arrayBuffer();
      const workbook = XLSX.read(arrayBuffer, { type: "array" });
      const sheetName = workbook.SheetNames.includes("Dữ liệu") ? "Dữ liệu" : workbook.SheetNames[0];
      const sheet = workbook.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
      const parsed = [];
      rows.forEach((row, idx) => {
        if (idx === 0) return;
        const question = normalizeLineBreaks(row[0]).trim();
        const rawCategory = normalizeLineBreaks(row[1]).trim();
        const answer = normalizeLineBreaks(row[2]).trim();
        const videoUrl = normalizeLineBreaks(row[3]).trim();
        const imageUrl = normalizeLineBreaks(row[4]).trim();
        if (!question || !answer) return;
        if (question === EXAMPLE_QUESTION) return;
        parsed.push({ title: question, category: resolveCategoryId(rawCategory, CATEGORIES[CATEGORIES.length - 1].id), content: answer, videoUrl, imageUrl });
      });
      await importEntries(parsed, "excel");
    } catch (err) {
      setImportResult({ added: 0, error: true, source: "excel" });
    } finally {
      event.target.value = "";
    }
  }

  function downloadTemplate() {
    const headers = ["Câu hỏi", "Danh mục", "Câu trả lời", "Link Video"];
    const exampleRow = [
      EXAMPLE_QUESTION,
      "HD",
      "Vào trang đăng nhập > bấm 'Quên mật khẩu' > nhập email đã đăng ký > làm theo hướng dẫn trong email.",
      "https://youtube.com/watch?v=vidu",
    ];
    const ws = XLSX.utils.aoa_to_sheet([headers, exampleRow]);
    ws["!cols"] = [{ wch: 45 }, { wch: 14 }, { wch: 70 }, { wch: 38 }];

    const wsNote = XLSX.utils.aoa_to_sheet([
      ["Mã danh mục", "Tên danh mục"],
      ...CATEGORIES.map((c) => [c.id, c.label]),
      [],
      ["Ghi chú:"],
      ["- Giữ nguyên tên sheet \"Dữ liệu\" và thứ tự 4 cột: Câu hỏi, Danh mục, Câu trả lời, Link Video."],
      ["- Cột Danh mục điền đúng 1 trong các mã ở bảng trên (VD: HD)."],
      ["- Cột Link Video có thể để trống nếu không có video hướng dẫn."],
      ["- Dòng ví dụ đầu tiên trong sheet \"Dữ liệu\" sẽ tự động bị bỏ qua khi nhập, không cần xoá thủ công."],
    ]);
    wsNote["!cols"] = [{ wch: 42 }, { wch: 30 }];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Dữ liệu");
    XLSX.utils.book_append_sheet(wb, wsNote, "Hướng dẫn");
    XLSX.writeFile(wb, "mau_nhap_du_lieu_chatbot.xlsx");
  }

  async function handleImageUpload(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    setUploadError("");
    setUploadingImage(true);
    try {
      const fd = new FormData();
      fd.append("image", file);
      const r = await fetch("/api/upload-image", {
        method: "POST",
        headers: adminToken ? { "x-admin-token": adminToken } : {},
        body: fd,
      });
      const data = await r.json().catch(() => ({}));
      if (r.status === 401) {
        setUploadError("Sai mã quản trị — nhập mã ở tab Cài đặt trước khi tải ảnh.");
      } else if (!r.ok || !data.ok) {
        setUploadError(data.error || "Tải ảnh lên thất bại.");
      } else {
        setForm((prev) => ({ ...prev, imageUrl: data.url }));
      }
    } catch (e) {
      setUploadError("Lỗi kết nối khi tải ảnh lên.");
    } finally {
      setUploadingImage(false);
      event.target.value = "";
    }
  }

  async function saveSettings() {
    setAdminError("");
    const r = await fetch("/api/settings", { method: "PUT", headers: authHeaders(adminToken), body: JSON.stringify(settingsForm) });
    if (r.status === 401) { setAdminError("Sai mã quản trị — vào cuối tab này để nhập lại."); return; }
    const data = await r.json();
    setSettings(data.settings);
    setSettingsSaved(true);
    setTimeout(() => setSettingsSaved(false), 2000);
  }

  function saveAdminToken(value) {
    setAdminToken(value);
    localStorage.setItem("adminToken", value);
  }

  async function escalateQuestion(index) {
    const msg = messages[index];
    if (!msg) return;
    setMessages((prev) => prev.map((m, i) => (i === index ? { ...m, escalating: true } : m)));
    try {
      const r = await fetch("/api/escalate", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: msg.question || "" }) });
      const data = await r.json();
      setMessages((prev) => prev.map((m, i) => (i === index ? { ...m, escalating: false, escalated: !!data.ok, escalateError: data.ok ? "" : (data.error || "Chưa gửi được.") } : m)));
      loadEscalations();
    } catch (e) {
      setMessages((prev) => prev.map((m, i) => (i === index ? { ...m, escalating: false, escalateError: "Lỗi kết nối." } : m)));
    }
  }

  function matchKb(query) {
    const queryTokens = tokenizeVN(query);
    if (!kbEntries || kbEntries.length === 0 || queryTokens.length === 0) return null;
    let best = null;
    kbEntries.forEach((entry) => {
      const s = scoreKbEntry(queryTokens, entry);
      if (!best || s > best.score) best = { entry, score: s };
    });
    if (!best || best.score < KB_MATCH_THRESHOLD) return null;
    return best.entry;
  }

  function sendMessage() {
    const question = input.trim();
    if (!question || loading) return;
    setMessages((prev) => [...prev, { role: "user", text: question }]);
    setInput("");

    const matched = matchKb(question);
    if (matched) {
      setMessages((prev) => [
        ...prev,
        {
          role: "assistant",
          source: "kb",
          text: matched.content,
          matchedTitle: matched.title,
          videoUrl: matched.videoUrl || "",
          imageUrl: matched.imageUrl || "",
          question,
        },
      ]);
      return;
    }

    setMessages((prev) => [
      ...prev,
      { role: "assistant", source: "nomatch", text: "🔍 Không tìm thấy nội dung phù hợp trong tài liệu đã nạp.", question },
    ]);
  }

  async function askAI(index) {
    const msg = messages[index];
    if (!msg || !msg.question) return;
    setMessages((prev) => prev.map((m, i) => (i === index ? { ...m, asking: true } : m)));
    setLoading(true);
    try {
      const priorMessages = messages
        .slice(0, index)
        .filter((m) => !(m.role === "assistant" && (m.source === "nomatch" || m.source === "error")));
      const history = [...priorMessages.map((m) => ({ role: m.role, text: m.text })), { role: "user", text: msg.question }];
      const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ history }) });
      const data = await r.json();
      if (data.ok) {
        setMessages((prev) =>
          prev.map((m, i) =>
            i === index
              ? { role: "assistant", source: "ai", text: data.text, needsEscalation: data.needsEscalation, question: msg.question, escalated: false, asking: false }
              : m
          )
        );
      } else {
        setMessages((prev) => prev.map((m, i) => (i === index ? { ...m, source: "error", asking: false, text: "Đã có lỗi: " + (data.error || "không rõ nguyên nhân.") } : m)));
      }
    } catch (e) {
      setMessages((prev) => prev.map((m, i) => (i === index ? { ...m, source: "error", asking: false, text: "Đã có lỗi khi kết nối tới hệ thống trả lời. Vui lòng thử lại." } : m)));
    } finally {
      setLoading(false);
    }
  }

  function handleKeyDown(e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  const filteredEntries = kbEntries.filter((e) => {
    const matchesCategory = filterCategory === "ALL" || e.category === filterCategory;
    const q = searchQuery.trim().toLowerCase();
    const matchesQuery = !q || e.title.toLowerCase().includes(q) || e.content.toLowerCase().includes(q);
    return matchesCategory && matchesQuery;
  });

  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column" }}>
      <div style={{ background: "#12303F", color: "#F3F1EC", padding: "20px 28px", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: "12px" }}>
        <div>
          <div style={{ fontSize: "20px", fontWeight: 700 }}>Trợ lý hỗ trợ phần mềm</div>
          <div style={{ fontSize: "13px", color: "#9FB4BE", marginTop: "2px" }}>Dùng chung cho đội ngũ chuyên gia hỗ trợ</div>
        </div>
        <div style={{ display: "flex", gap: "4px", background: "rgba(255,255,255,0.08)", borderRadius: "10px", padding: "4px" }}>
          <TabButton active={tab === "kb"} onClick={() => setTab("kb")} label="📚 Quản lý tài liệu" />
          <TabButton active={tab === "chat"} onClick={() => setTab("chat")} label="💬 Chat thử nghiệm" />
          <TabButton active={tab === "settings"} onClick={() => setTab("settings")} label="⚙️ Cài đặt" />
        </div>
      </div>

      <div style={{ flex: 1, padding: "24px 20px", display: "flex", justifyContent: "center" }}>
        {tab === "kb" ? (
          <div style={{ width: "100%", maxWidth: "760px", display: "flex", flexDirection: "column", gap: "20px" }}>
            <div style={card}>
              <div style={{ display: "flex", gap: "8px", marginBottom: "16px", alignItems: "center" }}>
                <div style={{ display: "flex", gap: "6px", background: "#F3F1EC", padding: "4px", borderRadius: "9px", flex: 1 }}>
                  <ModeButton active={entryMode === "single"} onClick={() => setEntryMode("single")} label="✏️ Thêm từng câu" />
                  <ModeButton active={entryMode === "bulk"} onClick={() => { cancelEdit(); setEntryMode("bulk"); }} label="📋 Nhập hàng loạt" />
                </div>
                <button type="button" onClick={downloadTemplate} style={outlineButton}>📄 Tải file mẫu</button>
                <input ref={fileInputRef} type="file" accept=".xlsx,.xls" onChange={handleExcelFile} style={{ display: "none" }} />
                <button onClick={() => fileInputRef.current && fileInputRef.current.click()} style={darkButton}>⬆️ Nhập file Excel</button>
              </div>

              {importResult && importResult.source === "excel" && (
                <div style={{ marginBottom: 14, fontSize: 13, fontWeight: 600, padding: "8px 12px", borderRadius: 8, color: importResult.error ? "#B3261E" : "#3D7A4E", background: importResult.error ? "#FBEAE8" : "#EAF5EC" }}>
                  {importResult.error ? "Không đọc được dữ liệu hợp lệ từ file Excel." : `Đã nhập thành công ${importResult.added} mục từ file Excel.`}
                </div>
              )}

              {entryMode === "single" ? (
                <>
                  <div style={sectionTitle}>{editingId ? "✏️ Chỉnh sửa câu hỏi & câu trả lời" : "📄 Thêm câu hỏi & câu trả lời"}</div>
                  {editingId && (
                    <div style={{ fontSize: 12, color: "#B5652F", fontWeight: 600, marginBottom: 4 }}>
                      Đang chỉnh sửa 1 mục đã có — bấm "Lưu chỉnh sửa" để cập nhật, hoặc "Huỷ" để thoát.
                    </div>
                  )}
                  <label style={labelStyle}>Câu hỏi</label>
                  <input style={inputStyle} placeholder="VD: Làm sao để tạo phiếu đánh giá KPI?" value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} />
                  <label style={labelStyle}>Danh mục</label>
                  <select style={inputStyle} value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })}>
                    {CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c.label} ({c.id})</option>)}
                  </select>
                  <label style={labelStyle}>Câu trả lời</label>
                  <textarea style={{ ...inputStyle, minHeight: 100, resize: "vertical" }} placeholder="Nhập câu trả lời chi tiết..." value={form.content} onChange={(e) => setForm({ ...form, content: e.target.value })} />

                  <label style={labelStyle}>🎥 Link video hướng dẫn (tuỳ chọn)</label>
                  <input style={inputStyle} placeholder="vd: https://youtube.com/watch?v=..." value={form.videoUrl} onChange={(e) => setForm({ ...form, videoUrl: e.target.value })} />

                  <label style={labelStyle}>🖼️ Hình ảnh minh hoạ (tuỳ chọn)</label>
                  <div style={{ display: "flex", gap: 8, marginBottom: 4 }}>
                    <input style={{ ...inputStyle, marginBottom: 0, flex: 1 }} placeholder="Dán link ảnh, hoặc bấm nút bên phải để tải ảnh từ máy" value={form.imageUrl} onChange={(e) => setForm({ ...form, imageUrl: e.target.value })} />
                    <input ref={imageInputRef} type="file" accept="image/*" onChange={handleImageUpload} style={{ display: "none" }} />
                    <button
                      type="button"
                      onClick={() => imageInputRef.current && imageInputRef.current.click()}
                      disabled={uploadingImage}
                      style={{ ...darkButton, flex: "0 0 auto" }}
                    >
                      {uploadingImage ? "⏳ Đang tải..." : "⬆️ Tải ảnh lên"}
                    </button>
                  </div>
                  {uploadError && <div style={{ fontSize: 12, color: "#B3261E", marginBottom: 6 }}>{uploadError}</div>}
                  {form.imageUrl && (
                    <div style={{ position: "relative", display: "inline-block", marginTop: 2 }}>
                      <img src={form.imageUrl} alt="Xem trước" style={{ maxWidth: "100%", maxHeight: 160, borderRadius: 8, border: "1px solid #DDD7C9", display: "block" }} onError={(e) => { e.target.style.display = "none"; }} />
                      <button type="button" onClick={() => setForm({ ...form, imageUrl: "" })} style={{ position: "absolute", top: 4, right: 4, background: "rgba(18,48,63,0.8)", color: "#fff", border: "none", borderRadius: 6, padding: "2px 8px", fontSize: 11, cursor: "pointer" }}>
                        ✕ Xoá
                      </button>
                    </div>
                  )}

                  <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
                    <button onClick={addEntry} style={{ ...primaryButtonStyle, width: "auto", flex: 1, marginTop: 0 }}>
                      {editingId ? "💾 Lưu chỉnh sửa" : "➕ Thêm vào tài liệu"}
                    </button>
                    {editingId && (
                      <button type="button" onClick={cancelEdit} style={{ ...outlineButton, height: "auto", padding: "10px 16px", flex: "0 0 auto" }}>
                        ✕ Huỷ
                      </button>
                    )}
                  </div>
                </>
              ) : (
                <>
                  <div style={sectionTitle}>📋 Nhập hàng loạt Câu hỏi - Câu trả lời</div>
                  <div style={{ fontSize: 12.5, color: "#6B6255", lineHeight: 1.6, marginBottom: 10 }}>
                    Dán từ Excel: mỗi dòng 1 cặp, cách nhau bởi Tab — <strong>Câu hỏi</strong> [Tab] <strong>Mã danh mục</strong> [Tab] <strong>Câu trả lời</strong> [Tab] <strong>Link video</strong> [Tab] <strong>Link ảnh</strong> (2 cột cuối tuỳ chọn, có thể bỏ trống).
                  </div>
                  <label style={labelStyle}>Danh mục mặc định</label>
                  <select style={inputStyle} value={bulkCategory} onChange={(e) => setBulkCategory(e.target.value)}>
                    {CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c.label} ({c.id})</option>)}
                  </select>
                  <label style={labelStyle}>Dán dữ liệu vào đây</label>
                  <textarea style={{ ...inputStyle, minHeight: 160, resize: "vertical", fontFamily: "monospace", fontSize: 12.5 }} value={bulkText} onChange={(e) => { setBulkText(e.target.value); setImportResult(null); }} />
                  <button onClick={handleBulkImport} style={primaryButtonStyle}>📋 Nhập vào tài liệu</button>
                  {importResult && importResult.source === "paste" && (
                    <div style={{ marginTop: 10, fontSize: 13, fontWeight: 600, color: importResult.error ? "#B3261E" : "#3D7A4E" }}>
                      {importResult.error ? "Không nhận diện được cặp Câu hỏi - Câu trả lời nào." : `Đã nhập thành công ${importResult.added} mục.`}
                    </div>
                  )}
                </>
              )}
              {adminError && <div style={{ marginTop: 10, fontSize: 12.5, color: "#B3261E" }}>{adminError}</div>}
            </div>

            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              <div style={{ fontSize: 13, color: "#6B6255", fontWeight: 600, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <span>{loadingKb ? "Đang tải..." : `Hiển thị ${filteredEntries.length} / ${kbEntries.length} mục đã nạp cho chatbot (dùng chung)`}</span>
                <button onClick={loadKb} style={{ background: "transparent", border: "1px solid #DDD7C9", borderRadius: 8, padding: "4px 10px", fontSize: 12, cursor: "pointer", color: "#12303F" }}>
                  🔄 Làm mới
                </button>
              </div>

              <div style={{ ...card, padding: 14, display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
                <input
                  style={{ ...inputStyle, marginBottom: 0, flex: "1 1 220px" }}
                  placeholder="🔎 Tìm theo câu hỏi hoặc câu trả lời..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                />
                <select style={{ ...inputStyle, marginBottom: 0, width: "auto", flex: "0 0 auto" }} value={filterCategory} onChange={(e) => setFilterCategory(e.target.value)}>
                  <option value="ALL">Tất cả danh mục</option>
                  {CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c.label} ({c.id})</option>)}
                </select>
                {(searchQuery || filterCategory !== "ALL") && (
                  <button onClick={() => { setSearchQuery(""); setFilterCategory("ALL"); }} style={{ background: "transparent", border: "1px solid #DDD7C9", borderRadius: 8, padding: "9px 12px", fontSize: 12.5, cursor: "pointer", color: "#B5652F", fontWeight: 700 }}>
                    ✕ Xoá lọc
                  </button>
                )}
              </div>

              {!loadingKb && filteredEntries.length === 0 && (
                <div style={{ ...card, textAlign: "center", color: "#8A8272", fontSize: 13, fontStyle: "italic" }}>
                  Không tìm thấy mục nào khớp với bộ lọc/tìm kiếm hiện tại.
                </div>
              )}

              {filteredEntries.map((e) => (
                <div key={e.id} style={{ ...card, padding: "14px 16px", display: "flex", justifyContent: "space-between", gap: 12 }}>
                  <div style={{ flex: 1 }}>
                    <div style={miniLabel}>Câu hỏi</div>
                    <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 4 }}>{e.title}</div>
                    <div style={pill}>{getCategoryLabel(e.category)}</div>
                    <div style={miniLabel}>Câu trả lời</div>
                    <div style={{ fontSize: 13, color: "#4A443B", lineHeight: 1.5, whiteSpace: "pre-wrap" }}>{e.content}</div>
                    {e.videoUrl && (
                      <div style={{ marginTop: 8 }}>
                        <a href={e.videoUrl} target="_blank" rel="noreferrer" style={{ fontSize: 12.5, color: "#12303F", fontWeight: 700, textDecoration: "none" }}>
                          🎥 Video hướng dẫn ↗
                        </a>
                      </div>
                    )}
                    {e.imageUrl && (
                      <div style={{ marginTop: 8 }}>
                        <div style={miniLabel}>🖼️ Hình ảnh minh hoạ</div>
                        <img src={e.imageUrl} alt={e.title} style={{ maxWidth: 220, maxHeight: 140, borderRadius: 8, border: "1px solid #DDD7C9", marginTop: 4 }} onError={(ev) => { ev.target.style.display = "none"; }} />
                      </div>
                    )}
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                    <button onClick={() => startEdit(e)} title="Chỉnh sửa" style={{ background: "transparent", border: "none", cursor: "pointer", color: "#12303F", height: "fit-content", fontSize: 16 }}>✏️</button>
                    <button onClick={() => removeEntry(e.id)} title="Xoá" style={{ background: "transparent", border: "none", cursor: "pointer", color: "#B5652F", height: "fit-content", fontSize: 16 }}>🗑️</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        ) : tab === "chat" ? (
          <div style={{ width: "100%", maxWidth: 620, ...card, display: "flex", flexDirection: "column", height: 560, padding: 0 }}>
            <div style={{ padding: "10px 20px", borderBottom: "1px solid #EEE9DD", fontSize: 11.5, color: "#8A8272" }}>
              💡 Chatbot tìm câu trả lời có sẵn trong tài liệu trước (miễn phí, tức thì) — chỉ gọi AI khi bạn chủ động bấm "Hỏi AI".
            </div>
            <div ref={scrollRef} style={{ flex: 1, overflowY: "auto", padding: 20, display: "flex", flexDirection: "column", gap: 14 }}>
              {messages.length === 0 && <div style={bubbleAssistant}>{settings.greeting || DEFAULT_GREETING}</div>}
              {messages.map((m, i) => (
                <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: m.role === "user" ? "flex-end" : "flex-start", gap: 6, maxWidth: "100%" }}>
                  {m.role === "assistant" && m.source === "kb" && (
                    <div style={{ fontSize: 10.5, fontWeight: 700, color: "#3D7A4E", textTransform: "uppercase", letterSpacing: "0.03em" }}>🔍 Từ tài liệu — không dùng AI</div>
                  )}
                  {m.role === "assistant" && m.source === "ai" && (
                    <div style={{ fontSize: 10.5, fontWeight: 700, color: "#B5652F", textTransform: "uppercase", letterSpacing: "0.03em" }}>🤖 Claude AI</div>
                  )}
                  <div style={m.role === "user" ? bubbleUser : bubbleAssistant}>
                    {m.role === "assistant" ? renderMessageContent(m.text) : m.text}
                    {m.role === "assistant" && m.source === "kb" && m.videoUrl && (
                      <div style={{ marginTop: 8 }}>
                        <a href={m.videoUrl} target="_blank" rel="noreferrer" style={{ fontSize: 12.5, color: "inherit", fontWeight: 700 }}>🎥 Video hướng dẫn ↗</a>
                      </div>
                    )}
                    {m.role === "assistant" && m.source === "kb" && m.imageUrl && (
                      <img src={m.imageUrl} alt={m.matchedTitle || "Hình minh hoạ"} style={{ maxWidth: "100%", maxHeight: 200, borderRadius: 8, display: "block", marginTop: 8 }} onError={(e) => { e.target.style.display = "none"; }} />
                    )}
                  </div>

                  {m.role === "assistant" && (m.source === "nomatch" || m.source === "error") && (
                    <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                      <button onClick={() => askAI(i)} disabled={m.asking} style={escalateBtn(false)}>
                        {m.asking ? "⏳ Đang hỏi AI..." : "🤖 Hỏi AI (Claude)"}
                      </button>
                      <button onClick={() => escalateQuestion(i)} disabled={m.escalated || m.escalating} style={escalateBtn(m.escalated)}>
                        {m.escalating ? "⏳ Đang gửi..." : m.escalated ? "✅ Đã gửi cho chuyên gia" : "✉️ Gửi câu hỏi cho chuyên gia"}
                      </button>
                    </div>
                  )}
                  {m.role === "assistant" && m.source === "kb" && (
                    <button onClick={() => askAI(i)} disabled={m.asking} style={{ background: "transparent", border: "none", color: "#8A8272", fontSize: 11.5, textDecoration: "underline", cursor: "pointer", padding: 0 }}>
                      {m.asking ? "⏳ Đang hỏi AI..." : "Chưa đúng ý bạn? Hỏi AI thêm"}
                    </button>
                  )}
                  {m.role === "assistant" && m.source === "ai" && m.needsEscalation && (
                    <button onClick={() => escalateQuestion(i)} disabled={m.escalated || m.escalating} style={escalateBtn(m.escalated)}>
                      {m.escalating ? "⏳ Đang gửi..." : m.escalated ? "✅ Đã gửi cho chuyên gia" : "✉️ Gửi câu hỏi này cho chuyên gia"}
                    </button>
                  )}
                  {m.role === "assistant" && m.escalateError && <div style={{ fontSize: 11, color: "#B3261E" }}>{m.escalateError}</div>}
                </div>
              ))}
              {loading && <div style={{ alignSelf: "flex-start", color: "#6B6255", fontSize: 13 }}>⏳ Đang hỏi AI...</div>}
            </div>
            <div style={{ display: "flex", gap: 8, padding: 14, borderTop: "1px solid #EEE9DD" }}>
              <input style={{ ...inputStyle, marginBottom: 0, flex: 1 }} placeholder="Nhập câu hỏi của bạn..." value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={handleKeyDown} />
              <button onClick={sendMessage} disabled={loading} style={{ ...primaryButtonStyle, width: "auto", margin: 0, padding: "0 16px" }}>➤</button>
            </div>
          </div>
        ) : (
          <div style={{ width: "100%", maxWidth: 760, display: "flex", flexDirection: "column", gap: 20 }}>
            <div style={card}>
              <div style={sectionTitle}>💬 Câu chào mở đầu</div>
              <textarea style={{ ...inputStyle, minHeight: 90, resize: "vertical" }} value={settingsForm.greeting} onChange={(e) => setSettingsForm({ ...settingsForm, greeting: e.target.value })} />

              <div style={{ ...sectionTitle, marginTop: 18 }}>✉️ Email chuyên gia hỗ trợ (dự phòng)</div>
              <div style={{ fontSize: 12.5, color: "#6B6255", marginBottom: 6 }}>Có thể kết nối Zalo OA sau (xem README). Trong lúc chưa có Zalo, câu hỏi chưa trả lời được sẽ gửi qua email này (nếu điền) hoặc chỉ lưu vào nhật ký bên dưới.</div>
              <input style={inputStyle} type="email" placeholder="vd: hotro@congty.vn" value={settingsForm.expertEmail} onChange={(e) => setSettingsForm({ ...settingsForm, expertEmail: e.target.value })} />

              <button onClick={saveSettings} style={primaryButtonStyle}>{settingsSaved ? "✅ Đã lưu" : "💾 Lưu cài đặt"}</button>
              {adminError && <div style={{ marginTop: 10, fontSize: 12.5, color: "#B3261E" }}>{adminError}</div>}
            </div>

            <div style={card}>
              <div style={sectionTitle}>✉️ Câu hỏi đã gửi chuyên gia ({escalations.length})</div>
              {escalations.length === 0 ? (
                <div style={{ fontSize: 13, color: "#8A8272", fontStyle: "italic" }}>Chưa có câu hỏi nào.</div>
              ) : (
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {escalations.map((t) => (
                    <div key={t.id} style={{ background: "#F3F1EC", borderRadius: 10, padding: "10px 12px" }}>
                      <div style={{ fontSize: 13.5, fontWeight: 600 }}>{t.question}</div>
                      <div style={{ fontSize: 11, color: "#8A8272", marginTop: 2 }}>{new Date(t.timestamp).toLocaleString("vi-VN")} · Kênh: {t.sentVia}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div style={card}>
              <div style={sectionTitle}>🔑 Mã quản trị</div>
              <div style={{ fontSize: 12.5, color: "#6B6255", marginBottom: 6 }}>
                Cần để sửa tài liệu / cài đặt (nếu server có bật ADMIN_TOKEN). Mỗi trình duyệt nhập 1 lần.
              </div>
              <input style={inputStyle} type="password" placeholder="Nhập mã quản trị nếu có" value={adminToken} onChange={(e) => saveAdminToken(e.target.value)} />
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function TabButton({ active, onClick, label }) {
  return <button onClick={onClick} style={{ padding: "8px 14px", borderRadius: 8, border: "none", cursor: "pointer", fontSize: 13, fontWeight: 600, background: active ? "#F3F1EC" : "transparent", color: active ? "#12303F" : "#CBD8DD" }}>{label}</button>;
}
function ModeButton({ active, onClick, label }) {
  return <button onClick={onClick} style={{ flex: 1, padding: "8px 10px", borderRadius: 7, border: "none", cursor: "pointer", fontSize: 12.5, fontWeight: 700, background: active ? "#FFFFFF" : "transparent", color: active ? "#12303F" : "#8A8272" }}>{label}</button>;
}
function escalateBtn(escalated) {
  return { border: "1px solid #DDD7C9", background: escalated ? "#EAF5EC" : "#FFFFFF", color: escalated ? "#3D7A4E" : "#B5652F", borderRadius: 999, padding: "5px 12px", fontSize: 12, fontWeight: 700, cursor: escalated ? "default" : "pointer" };
}

const card = { background: "#FFFFFF", border: "1px solid #DDD7C9", borderRadius: 14, padding: 20 };
const sectionTitle = { fontSize: 15, fontWeight:
