<script type="text/plain" id="app-source">
const { useState, useEffect, useRef, useMemo } = React;

const CATEGORIES = [
  { id: "HD", label: "Hướng dẫn thao tác" },
  { id: "LOI", label: "Lỗi thường gặp" },
  { id: "CS", label: "Chính sách / Quy trình" },
  { id: "335", label: "335" },
  { id: "KHAC", label: "Khác" },
];
function getCategoryLabel(id) {
  const found = CATEGORIES.find((c) => c.id === id);
  return found ? found.label : id;
}
const EMPTY_FORM = { title: "", category: CATEGORIES[0].id, content: "", videoUrl: "", images: [], aliasesText: "" };

// Đọc TOÀN BỘ ảnh của 1 mục, gộp cả kiểu dữ liệu cũ (imageUrl/imageUrl2 - tối đa 2 ảnh, các bản
// trước đây) lẫn kiểu mới (images - mảng không giới hạn số lượng), không trùng lặp.
function getEntryImages(entry) {
  if (!entry) return [];
  const legacy = [entry.imageUrl, entry.imageUrl2].filter(Boolean);
  const modern = Array.isArray(entry.images) ? entry.images.filter(Boolean) : [];
  const seen = new Set();
  const result = [];
  [...legacy, ...modern].forEach((u) => {
    if (!seen.has(u)) {
      seen.add(u);
      result.push(u);
    }
  });
  return result;
}

// ===== Định dạng văn bản đơn giản: **đậm**, *nghiêng*, __gạch chân__, gạch đầu dòng (- hoặc •), số thứ tự (1. 2. ...) =====
// Không dùng thư viện ngoài, chỉ ghép thành React element trực tiếp (an toàn, không chèn HTML thô).
function parseInlineFormatting(str, keyPrefix) {
  const nodes = [];
  // "->" luôn được hiện thành mũi tên "→" (phòng trường hợp dữ liệu không đi qua textarea có
  // tự động thay, VD nhập từ Excel, AI tự trả lời...).
  let remaining = String(str || "").replace(/->/g, "→");
  const regex = /(\*\*(.+?)\*\*)|(__(.+?)__)|(\*(.+?)\*)/;
  let key = 0;
  while (remaining) {
    const m = regex.exec(remaining);
    if (!m) {
      nodes.push(remaining);
      break;
    }
    if (m.index > 0) nodes.push(remaining.slice(0, m.index));
    if (m[2] !== undefined) nodes.push(<strong key={`${keyPrefix}-b${key++}`}>{m[2]}</strong>);
    else if (m[4] !== undefined) nodes.push(<u key={`${keyPrefix}-u${key++}`}>{m[4]}</u>);
    else if (m[6] !== undefined) nodes.push(<em key={`${keyPrefix}-i${key++}`}>{m[6]}</em>);
    remaining = remaining.slice(m.index + m[0].length);
  }
  return nodes;
}

// Nhận 1 đoạn text thuần (có thể nhiều dòng), trả về mảng React node đã dựng sẵn bullet/số thứ tự/đậm/nghiêng/gạch chân.
// Phân biệt rõ 3 kiểu danh sách: "- " = gạch đầu dòng, "• " = chấm tròn, "1. "/"1) " = số thứ tự.
function renderFormattedBlock(text, keyPrefix) {
  const lines = String(text || "").split("\n");
  const blocks = [];
  let currentList = null; // { type: "dash" | "dot" | "ol", items: [] }

  function flushList() {
    if (currentList) {
      blocks.push(currentList);
      currentList = null;
    }
  }

  lines.forEach((line) => {
    const dashMatch = line.match(/^\s*-\s+(.*)$/);
    const dotMatch = line.match(/^\s*[•*]\s+(.*)$/);
    const numberedMatch = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (dashMatch) {
      if (!currentList || currentList.type !== "dash") { flushList(); currentList = { type: "dash", items: [] }; }
      currentList.items.push(dashMatch[1]);
    } else if (dotMatch) {
      if (!currentList || currentList.type !== "dot") { flushList(); currentList = { type: "dot", items: [] }; }
      currentList.items.push(dotMatch[1]);
    } else if (numberedMatch) {
      if (!currentList || currentList.type !== "ol") { flushList(); currentList = { type: "ol", items: [] }; }
      currentList.items.push(numberedMatch[1]);
    } else {
      flushList();
      blocks.push({ type: "line", text: line });
    }
  });
  flushList();

  return blocks.map((b, i) => {
    const k = `${keyPrefix}-blk${i}`;
    if (b.type === "dash") {
      return (
        <ul key={k} style={{ margin: "4px 0", paddingLeft: 22, listStyleType: "none" }}>
          {b.items.map((it, j) => <li key={`${k}-${j}`} style={{ marginBottom: 2 }}>– {parseInlineFormatting(it, `${k}-${j}`)}</li>)}
        </ul>
      );
    }
    if (b.type === "dot") {
      return (
        <ul key={k} style={{ margin: "4px 0", paddingLeft: 22, listStyleType: "disc" }}>
          {b.items.map((it, j) => <li key={`${k}-${j}`} style={{ marginBottom: 2 }}>{parseInlineFormatting(it, `${k}-${j}`)}</li>)}
        </ul>
      );
    }
    if (b.type === "ol") {
      return (
        <ol key={k} style={{ margin: "4px 0", paddingLeft: 22 }}>
          {b.items.map((it, j) => <li key={`${k}-${j}`} style={{ marginBottom: 2 }}>{parseInlineFormatting(it, `${k}-${j}`)}</li>)}
        </ol>
      );
    }
    if (b.text.trim() === "") return <div key={k} style={{ height: 8 }} />;
    return <div key={k}>{parseInlineFormatting(b.text, k)}</div>;
  });
}
function resolveCategoryId(raw, defaultId) {
  const clean = String(raw || "").trim().toLowerCase();
  if (!clean) return defaultId;
  const byId = CATEGORIES.find((c) => c.id.toLowerCase() === clean);
  if (byId) return byId.id;
  const byLabel = CATEGORIES.find((c) => c.label.toLowerCase() === clean);
  if (byLabel) return byLabel.id;
  return defaultId;
}
const EXAMPLE_QUESTION = "Làm sao để đặt lại mật khẩu?";
const DEFAULT_GREETING = "Chào bạn, tôi là chatbot hỗ trợ phần mềm. Hãy đặt câu hỏi, tôi sẽ trả lời dựa trên tài liệu hướng dẫn đã được nạp.";

function authHeaders(adminToken) {
  const h = { "Content-Type": "application/json" };
  if (adminToken) h["x-admin-token"] = adminToken;
  return h;
}

// Chuẩn hoá ký tự xuống dòng (Excel/Windows hay dùng \r\n) về \n thống nhất,
// để hiển thị đúng định dạng xuống dòng đã gõ trong Excel / khi dán dữ liệu.
function normalizeLineBreaks(str) {
  return String(str || "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
}

// ===== Tìm kiếm cục bộ theo từ khoá (không dùng AI) =====
// So khớp ký tự thô (kiểu Fuse.js) không hợp với tiếng Việt vì câu hỏi diễn
// đạt lại khác chút là bị lệch điểm rất nhiều. Cách này bỏ dấu, bỏ từ đệm rồi
// so khớp theo từ (có trọng số TF-IDF + cụm từ), ổn định hơn nhiều cho câu hỏi tiếng Việt viết tự do.
const VN_STOPWORDS = new Set([
  "la","cua","va","cac","nhung","co","duoc","the","nao","cho","de","khi","toi","ban","minh",
  "lam","sao","gi","nhu","nay","do","mot","voi","ve","tai","hay","hoac","da","se","phai","can",
  "muon","xin","vay","oi","nhe","trong","o","ra","vao","den","neu","thi","ma","hon",
  "nhat","nen","bi","bang","theo",
  // Lưu ý: KHÔNG bỏ "tu" — vì bỏ dấu thì cả "từ" (giới từ, ít nghĩa) và "tự" (tự thân, RẤT
  // nhiều nghĩa — "tự đánh giá", "tự động"...) đều trùng thành "tu". Bỏ chung sẽ mất tín hiệu
  // quan trọng của "tự"; để TF-IDF tự động hạ trọng số "tu" khi nó xuất hiện ở hầu hết các mục.
]);
function normalizeVN(str) {
  return String(str || "")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/đ/g, "d")
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}
function tokenizeVN(str) {
  return normalizeVN(str).split(" ").filter((w) => w && w.length > 1 && !VN_STOPWORDS.has(w));
}
function bigramsOfTokens(tokens) {
  const out = [];
  for (let i = 0; i < tokens.length - 1; i++) out.push(tokens[i] + "_" + tokens[i + 1]);
  return out;
}
// Xây "chỉ mục" 1 lần cho toàn bộ KB: tần suất xuất hiện của từng từ (để tính TF-IDF —
// từ càng hiếm/đặc trưng thì càng có trọng số cao, từ càng phổ biến (VD "nhiệm vụ" xuất
// hiện ở gần như mọi mục) thì càng ít có giá trị phân biệt, trọng số càng thấp.
function buildKbIndex(entries) {
  const df = new Map();
  const indexed = entries.map((e) => {
    const titleTokens = tokenizeVN(e.title);
    // "aliases" = các cách hỏi khác cho cùng 1 câu trả lời (VD: "quên mật khẩu" là alias của
    // "Làm sao để đặt lại mật khẩu?"). Coi ngang hàng với tiêu đề khi tìm kiếm — cùng trọng số.
    const aliasList = Array.isArray(e.aliases) ? e.aliases : [];
    const aliasTokenLists = aliasList.map((a) => tokenizeVN(a));
    const allTitleTokens = [...titleTokens, ...aliasTokenLists.flat()];
    const contentTokens = tokenizeVN(e.content);
    const all = new Set([...allTitleTokens, ...contentTokens]);
    all.forEach((t) => df.set(t, (df.get(t) || 0) + 1));
    const allBigrams = [...bigramsOfTokens(titleTokens), ...aliasTokenLists.flatMap((toks) => bigramsOfTokens(toks))];
    return {
      entry: e,
      titleTokenSet: new Set(allTitleTokens),
      contentTokenSet: new Set(contentTokens),
      titleBigramSet: new Set(allBigrams),
    };
  });
  return { df, indexed, N: entries.length };
}
function idfOf(token, df, N) {
  const d = df.get(token) || 0;
  return Math.log((N + 1) / (d + 1)) + 1; // luôn dương; từ càng hiếm càng cao
}
function scoreKbEntryTfidf(queryTokens, queryBigrams, idxEntry, df, N) {
  if (queryTokens.length === 0) return 0;
  let weightedScore = 0;
  let maxPossible = 0;
  queryTokens.forEach((t) => {
    const w = idfOf(t, df, N);
    maxPossible += w;
    if (idxEntry.titleTokenSet.has(t)) weightedScore += w * 1.0;
    else if (idxEntry.contentTokenSet.has(t)) weightedScore += w * 0.35;
  });
  const baseRatio = maxPossible > 0 ? weightedScore / maxPossible : 0;

  let bigramHits = 0;
  queryBigrams.forEach((bg) => { if (idxEntry.titleBigramSet.has(bg)) bigramHits += 1; });
  const bigramRatio = queryBigrams.length > 0 ? bigramHits / queryBigrams.length : 0;

  return baseRatio * 0.7 + bigramRatio * 0.3;
}
// Ngưỡng "đủ tin cậy" để trả lời thẳng từ tài liệu, không cần gọi AI (thang điểm mới, đã
// chuẩn hoá 0-1 nhưng cách tính khác thang cũ nên không so trực tiếp với ngưỡng cũ được).
const KB_MATCH_THRESHOLD = 0.35;
// Nếu điểm mục đứng đầu và mục đứng nhì QUÁ SÁT NHAU (máy đang "phân vân" giữa 2 mục dễ
// nhầm, VD "giao KPI cho cá nhân" vs "giao KPI theo nhóm") thì KHÔNG tự tin trả lời luôn —
// thà để người dùng chủ động hỏi AI, còn hơn tự tin đưa ra câu trả lời SAI. An toàn hơn
// nhiều cho 1 chatbot hỗ trợ nghiệp vụ đánh giá công chức.
const KB_MATCH_MIN_MARGIN = 0.05;

function App() {
  function renderMessageContent(text) {
    const urlRegex = /(https?:\/\/[^\s]+)/g;
    const parts = String(text || "").split(urlRegex);
    return parts.map((part, i) => {
      if (!/^https?:\/\//.test(part)) return <React.Fragment key={i}>{renderFormattedBlock(part, `msg${i}`)}</React.Fragment>;
      const isImage = /\.(png|jpe?g|gif|webp)(\?.*)?$/i.test(part);
      if (isImage) {
        return (
          <img key={i} src={part} alt="Hình minh hoạ" onClick={() => setLightboxSrc(part)} style={{ maxWidth: "100%", maxHeight: 200, borderRadius: 8, display: "block", margin: "6px 0", cursor: "zoom-in" }} onError={(e) => { e.target.style.display = "none"; }} />
        );
      }
      return (
        <a key={i} href={part} target="_blank" rel="noreferrer" style={{ color: "inherit", textDecoration: "underline", wordBreak: "break-all" }}>
          {part}
        </a>
      );
    });
  }

  const [tab, setTab] = useState("kb");
  const [kbEntries, setKbEntries] = useState([]);
  const kbIndex = useMemo(() => buildKbIndex(kbEntries), [kbEntries]);
  const [loadingKb, setLoadingKb] = useState(true);
  const [searchQuery, setSearchQuery] = useState("");
  const [filterCategory, setFilterCategory] = useState("ALL");

  const [form, setForm] = useState({ ...EMPTY_FORM });
  const [newImageUrlDraft, setNewImageUrlDraft] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState({ ...EMPTY_FORM });
  const [newImageUrlDraftEdit, setNewImageUrlDraftEdit] = useState("");
  const editImageInputRef = useRef(null);
  const [entryMode, setEntryMode] = useState("single");
  const [bulkText, setBulkText] = useState("");
  const [bulkCategory, setBulkCategory] = useState(CATEGORIES[0].id);
  const [importResult, setImportResult] = useState(null);
  const fileInputRef = useRef(null);
  const contentRef = useRef(null);
  const editContentRef = useRef(null);
  const imageInputRef = useRef(null);
  const [uploadingImage, setUploadingImage] = useState(false);
  const [suggestingAliases, setSuggestingAliases] = useState(false);
  const [uploadError, setUploadError] = useState("");

  const [adminToken, setAdminToken] = useState(localStorage.getItem("adminToken") || "");
  const [adminError, setAdminError] = useState("");

  const backupInputRef = useRef(null);
  const [backupResult, setBackupResult] = useState(null);
  const [backingUp, setBackingUp] = useState(false);
  const [restoringBackup, setRestoringBackup] = useState(false);

  const [lightboxSrc, setLightboxSrc] = useState(null);

  const [settings, setSettings] = useState({ greeting: DEFAULT_GREETING, expertEmail: "" });
  const [settingsForm, setSettingsForm] = useState({ greeting: DEFAULT_GREETING, expertEmail: "" });
  const [settingsSaved, setSettingsSaved] = useState(false);

  const [escalations, setEscalations] = useState([]);

  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const scrollRef = useRef(null);

  useEffect(() => { loadKb(); loadSettings(); loadEscalations(); }, []);
  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages, loading]);

  async function loadKb() {
    try {
      const r = await fetch("/api/kb");
      const data = await r.json();
      setKbEntries(data.entries || []);
    } catch (e) {} finally { setLoadingKb(false); }
  }
  async function loadSettings() {
    try {
      const r = await fetch("/api/settings");
      const data = await r.json();
      setSettings(data);
      setSettingsForm(data);
    } catch (e) {}
  }
  async function loadEscalations() {
    try {
      const r = await fetch("/api/escalations");
      const data = await r.json();
      setEscalations(data || []);
    } catch (e) {}
  }

  async function saveKbEntries(nextEntries) {
    setAdminError("");
    const r = await fetch("/api/kb", { method: "PUT", headers: authHeaders(adminToken), body: JSON.stringify({ entries: nextEntries }) });
    if (r.status === 401) { setAdminError("Sai mã quản trị — vào cuối tab này để nhập lại."); return false; }
    setKbEntries(nextEntries);
    return true;
  }

  async function addEntry() {
    if (!form.title.trim() || !form.content.trim()) return;
    const { aliasesText, ...rest } = form;
    const aliases = aliasesText.split("\n").map((s) => s.trim()).filter(Boolean);
    const entry = { id: String(Date.now()), ...rest, aliases };
    const ok = await saveKbEntries([entry, ...kbEntries]);
    if (ok) { setForm({ ...EMPTY_FORM }); setNewImageUrlDraft(""); }
  }

  function startEdit(entry) {
    setEditForm({
      title: entry.title || "",
      category: entry.category || CATEGORIES[0].id,
      content: entry.content || "",
      videoUrl: entry.videoUrl || "",
      images: getEntryImages(entry),
      aliasesText: Array.isArray(entry.aliases) ? entry.aliases.join("\n") : "",
    });
    setEditingId(entry.id);
    setNewImageUrlDraftEdit("");
    setUploadError("");
  }

  function cancelEdit() {
    setEditingId(null);
    setEditForm({ ...EMPTY_FORM });
    setNewImageUrlDraftEdit("");
    setUploadError("");
  }

  async function saveEditEntry() {
    if (!editForm.title.trim() || !editForm.content.trim() || !editingId) return;
    const { aliasesText, ...rest } = editForm;
    const aliases = aliasesText.split("\n").map((s) => s.trim()).filter(Boolean);
    // Ghi đè hẳn sang định dạng "images" (mảng) mới, bỏ imageUrl/imageUrl2 cũ nếu có
    // (getEntryImages đã gộp sẵn dữ liệu cũ vào form lúc mở sửa, nên không mất ảnh).
    const nextEntries = kbEntries.map((e) =>
      e.id === editingId ? { ...e, ...rest, aliases, imageUrl: undefined, imageUrl2: undefined } : e
    );
    const ok = await saveKbEntries(nextEntries);
    if (ok) cancelEdit();
  }

  async function removeEntry(id) {
    if (editingId === id) cancelEdit();
    await saveKbEntries(kbEntries.filter((e) => e.id !== id));
  }

  function splitMultiValue(raw) {
    return String(raw || "").split(/[\n|]/).map((s) => s.trim()).filter(Boolean);
  }

  function parseBulkImport(text, defaultCategoryId) {
    const entries = [];
    const rawLines = text.split(/\r?\n/);
    const looksTabular = rawLines.some((l) => l.includes("\t"));
    if (looksTabular) {
      rawLines.forEach((line) => {
        if (!line.trim()) return;
        const cols = line.split("\t").map((c) => normalizeLineBreaks(c).trim());
        if (/^(câu hỏi|question)$/i.test(cols[0])) return;
        if (cols.length >= 3 && cols[0] && cols[2]) {
          entries.push({ title: cols[0], category: resolveCategoryId(cols[1], defaultCategoryId), content: cols[2], videoUrl: cols[3] || "", images: splitMultiValue(cols[4]), aliases: splitMultiValue(cols[5]) });
        } else if (cols.length === 2 && cols[0] && cols[1]) {
          entries.push({ title: cols[0], category: defaultCategoryId, content: cols[1], videoUrl: "", images: [], aliases: [] });
        }
      });
      return entries;
    }
    const blocks = normalizeLineBreaks(text).split(/\n\s*\n/);
    blocks.forEach((block) => {
      const qMatch = block.match(/câu hỏi\s*:\s*([\s\S]*?)(?:\n(?:danh mục|câu trả lời|video|hình ảnh|cách hỏi khác)\s*:|$)/i);
      const cMatch = block.match(/danh mục\s*:\s*([\s\S]*?)(?:\n(?:câu trả lời|video|hình ảnh|cách hỏi khác)\s*:|$)/i);
      const aMatch = block.match(/câu trả lời\s*:\s*([\s\S]*?)(?:\n(?:video|hình ảnh|cách hỏi khác)\s*:|$)/i);
      const vMatch = block.match(/video\s*:\s*([\s\S]*?)(?:\n(?:hình ảnh|cách hỏi khác)\s*:|$)/i);
      const iMatch = block.match(/hình ảnh\s*:\s*([\s\S]*?)(?:\ncách hỏi khác\s*:|$)/i);
      const aliasMatch = block.match(/cách hỏi khác\s*:\s*([\s\S]*)/i);
      const question = qMatch ? qMatch[1].trim() : "";
      const answer = aMatch ? aMatch[1].trim() : "";
      const category = cMatch ? resolveCategoryId(cMatch[1], defaultCategoryId) : defaultCategoryId;
      const videoUrl = vMatch ? vMatch[1].trim() : "";
      const images = iMatch ? splitMultiValue(iMatch[1]) : [];
      const aliases = aliasMatch ? splitMultiValue(aliasMatch[1]) : [];
      if (question && answer) entries.push({ title: question, category, content: answer, videoUrl, images, aliases });
    });
    return entries;
  }

  async function importEntries(parsed, source) {
    if (parsed.length === 0) { setImportResult({ added: 0, error: true, source }); return; }
    setAdminError("");
    const r = await fetch("/api/kb/import", { method: "POST", headers: authHeaders(adminToken), body: JSON.stringify({ entries: parsed }) });
    if (r.status === 401) { setAdminError("Sai mã quản trị — vào cuối tab này để nhập lại."); return; }
    const data = await r.json();
    if (data.ok) {

  // Bọc vùng đang bôi đen trong textarea bằng ký hiệu định dạng (đậm/nghiêng/gạch chân).
  // Nếu chưa bôi đen gì, chèn chữ mẫu để người dùng biết chỗ cần sửa.
  // Tự động thay "->" vừa gõ xong (ngay trước con trỏ) thành mũi tên "→".
  // Chỉ xét phần TRƯỚC con trỏ để không phá phần đang gõ dở phía sau (khi con trỏ ở giữa văn bản).
  function applyArrowAutoReplace(rawValue, cursorPos) {
    const before = rawValue.slice(0, cursorPos);
    const after = rawValue.slice(cursorPos);
    if (!before.includes("->")) return { value: rawValue, cursorPos, changed: false };
    const newBefore = before.replace(/->/g, "→");
    return { value: newBefore + after, cursorPos: newBefore.length, changed: newBefore.length !== before.length };
  }

  function handleContentChange(e, setValue) {
    const ta = e.target;
    const result = applyArrowAutoReplace(ta.value, ta.selectionStart);
    setValue(result.value);
    if (result.changed) {
      requestAnimationFrame(() => ta.setSelectionRange(result.cursorPos, result.cursorPos));
    }
  }

  // Khi đang gõ trong 1 dòng bullet/số thứ tự và nhấn Enter: tự động nối tiếp cùng kiểu ở dòng mới.
  // Nếu dòng bullet hiện tại đang RỖNG (chỉ có mỗi ký hiệu, chưa gõ chữ) và nhấn Enter -> xoá ký hiệu,
  // thoát khỏi danh sách, chuyển sang dòng trống bình thường (giống Word/Google Docs/Notion).
  function handleContentKeyDown(e, ref, value, setValue) {
    // Phím tắt định dạng: Ctrl+B / Ctrl+I / Ctrl+U (Mac dùng Cmd = metaKey).
    const ctrlOrCmd = e.ctrlKey || e.metaKey;
    if (ctrlOrCmd && !e.altKey) {
      const key = e.key.toLowerCase();
      if (key === "b") { e.preventDefault(); wrapSelection(ref, value, setValue, "**"); return; }
      if (key === "i") { e.preventDefault(); wrapSelection(ref, value, setValue, "*"); return; }
      if (key === "u") { e.preventDefault(); wrapSelection(ref, value, setValue, "__"); return; }
    }

    if (e.key !== "Enter" || e.shiftKey) return;
    const ta = e.target;
    if (ta.selectionStart !== ta.selectionEnd) return; // đang bôi đen thì để hành vi mặc định
    const pos = ta.selectionStart;
    const before = value.slice(0, pos);
    const after = value.slice(pos);
    const lineStart = before.lastIndexOf("\n") + 1;
    const currentLine = before.slice(lineStart);

    const dashMatch = currentLine.match(/^(\s*)-\s+(.*)$/);
    // "*" dễ gõ hơn "•" trên bàn phím thường -> cho phép cả 2 cùng kích hoạt bullet chấm tròn,
    // giữ lại đúng ký tự người dùng đã gõ (nhóm 2) khi tự nối sang dòng tiếp theo.
    const dotMatch = currentLine.match(/^(\s*)([•*])\s+(.*)$/);
    const numMatch = currentLine.match(/^(\s*)(\d+)([.)])\s+(.*)$/);

    let exitList = false;
    let insertion = null;

    if (dashMatch) {
      if (dashMatch[2].trim() === "") exitList = true;
      else insertion = `\n${dashMatch[1]}- `;
    } else if (dotMatch) {
      if (dotMatch[3].trim() === "") exitList = true;
      else insertion = `\n${dotMatch[1]}${dotMatch[2]} `;
    } else if (numMatch) {
      if (numMatch[4].trim() === "") exitList = true;
      else insertion = `\n${numMatch[1]}${parseInt(numMatch[2], 10) + 1}${numMatch[3]} `;
    }

    if (exitList) {
      e.preventDefault();
      const newValue = value.slice(0, lineStart) + after;
      setValue(newValue);
      requestAnimationFrame(() => ta.setSelectionRange(lineStart, lineStart));
      return;
    }
    if (insertion !== null) {
      e.preventDefault();
      const newValue = before + insertion + after;
      const newPos = before.length + insertion.length;
      setValue(newValue);
      requestAnimationFrame(() => ta.setSelectionRange(newPos, newPos));
    }
  }

  function wrapSelection(ref, value, setValue, marker) {
    const ta = ref.current;
    if (!ta) return;
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    const selected = value.slice(start, end) || "chữ";
    const newValue = value.slice(0, start) + marker + selected + marker + value.slice(end);
    setValue(newValue);
    requestAnimationFrame(() => {
      ta.focus();
      ta.setSelectionRange(start + marker.length, start + marker.length + selected.length);
    });
  }

  // Thêm gạch đầu dòng (-) hoặc số thứ tự (1. 2. ...) vào đầu mỗi dòng đang bôi đen.
  function prefixLines(ref, value, setValue, kind) {
    const ta = ref.current;
    if (!ta) return;
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    const selText = value.slice(start, end) || "Mục 1\nMục 2";
    const lines = selText.split("\n");
    const marker = kind === "ol" ? null : kind === "dot" ? "• " : "- ";
    const prefixed = lines.map((l, i) => (kind === "ol" ? `${i + 1}. ${l}` : `${marker}${l}`)).join("\n");
    const newValue = value.slice(0, start) + prefixed + value.slice(end);
    setValue(newValue);
    requestAnimationFrame(() => {
      ta.focus();
      ta.setSelectionRange(start, start + prefixed.length);
    });
  }

  // ============ SAO LƯU / KHÔI PHỤC (đề phòng mất dữ liệu khi Render khởi động lại container) ============
  function blobToDataUrl(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  async function downloadBackup() {
    setBackingUp(true);
    setBackupResult(null);
    try {
      // Thu thập ảnh đã tải lên qua nút "Tải ảnh lên" (đường dẫn dạng /uploads/...) để nhúng thẳng
      // vào file sao lưu — ảnh dán link ngoài (http/https từ nơi khác) không cần nhúng vì vẫn còn nguyên ở nơi đó.
      const localImagePaths = new Set();
      kbEntries.forEach((e) => {
        getEntryImages(e).forEach((u) => {
          if (u && u.startsWith("/uploads/")) localImagePaths.add(u);
        });
      });

      const uploadedImages = {};
      for (const p of localImagePaths) {
        try {
          const r = await fetch(p);
          if (r.ok) uploadedImages[p] = await blobToDataUrl(await r.blob());
        } catch (e) {
          // bỏ qua ảnh lỗi, không chặn phần sao lưu còn lại
        }
      }

      const payload = {
        backupType: "chatbot-ho-tro-website",
        backupVersion: 2, // v2: có nhúng ảnh (uploadedImages) — v1 (cũ) chỉ có kb + settings
        exportedAt: new Date().toISOString(),
        kb: { entries: kbEntries },
        settings,
        uploadedImages,
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
      a.href = url;
      a.download = `sao-luu-du-lieu-chatbot-${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      const n = Object.keys(uploadedImages).length;
      setBackupResult({ ok: true, message: `Đã tải file sao lưu${n > 0 ? ` (kèm ${n} ảnh đã tải lên)` : ""}.` });
    } finally {
      setBackingUp(false);
    }
  }

  async function restoreBackup(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    setBackupResult(null);
    setRestoringBackup(true);
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      const entries = parsed?.kb?.entries;
      if (!Array.isArray(entries)) throw new Error("File sao lưu không đúng định dạng (thiếu kb.entries).");

      const okKb = await saveKbEntries(entries);
      if (!okKb) { setBackupResult({ ok: false, message: "Sai mã quản trị — không khôi phục được." }); return; }

      if (parsed?.settings) {
        const r = await fetch("/api/settings", { method: "PUT", headers: authHeaders(adminToken), body: JSON.stringify(parsed.settings) });
        if (r.ok) {
          const data = await r.json();
          setSettings(data.settings);
          setSettingsForm(data.settings);
        }
      }

      // Ghi lại các file ảnh đã tải lên (chỉ có ở file sao lưu tạo từ bản mới, backupVersion >= 2)
      const uploadedImages = parsed?.uploadedImages || {};
      const paths = Object.keys(uploadedImages);
      let imageOk = 0;
      let imageFailed = 0;
      for (const p of paths) {
        try {
          const r = await fetch("/api/restore-image", { method: "POST", headers: authHeaders(adminToken), body: JSON.stringify({ path: p, dataUrl: uploadedImages[p] }) });
          if (r.ok) imageOk++; else imageFailed++;
        } catch (e) {
          imageFailed++;
        }
      }

      let message = `Đã khôi phục ${entries.length} mục tài liệu${parsed?.settings ? " + cài đặt" : ""}.`;
      if (paths.length > 0) {
        message += ` Đã ghi lại ${imageOk}/${paths.length} ảnh đã tải lên.`;
      } else {
        message += " Lưu ý: file sao lưu này không có ảnh nhúng kèm theo (có thể tạo từ bản cũ trước khi có tính năng này) — nếu tài liệu có ảnh bị vỡ, cần tải lại ảnh thủ công cho các mục đó.";
      }
      setBackupResult({ ok: imageFailed === 0, message });
    } catch (err) {
      setBackupResult({ ok: false, message: err.message || "Không đọc được file sao lưu." });
    } finally {
      setRestoringBackup(false);
      event.target.value = "";
    }
  }

  async function escalateQuestion(index) {
    const msg = messages[index];
    if (!msg) return;
    setMessages((prev) => prev.map((m, i) => (i === index ? { ...m, escalating: true } : m)));
    try {
      const r = await fetch("/api/escalate", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: msg.question || "" }) });
      const data = await r.json();
      setMessages((prev) => prev.map((m, i) => (i === index ? { ...m, escalating: false, escalated: !!data.ok, escalateError: data.ok ? "" : (data.error || "Chưa gửi được.") } : m)));
      loadEscalations();
    } catch (e) {
      setMessages((prev) => prev.map((m, i) => (i === index ? { ...m, escalating: false, escalateError: "Lỗi kết nối." } : m)));
    }
  }

  function matchKb(query) {
    const queryTokens = tokenizeVN(query);
    if (!kbEntries || kbEntries.length === 0 || queryTokens.length === 0) return { type: "none" };
    const queryBigrams = bigramsOfTokens(queryTokens);
    const scored = kbIndex.indexed
      .map((idxEntry) => ({ entry: idxEntry.entry, score: scoreKbEntryTfidf(queryTokens, queryBigrams, idxEntry, kbIndex.df, kbIndex.N) }))
      .sort((a, b) => b.score - a.score);

    const best = scored[0];
    if (!best || best.score < KB_MATCH_THRESHOLD) return { type: "none" };

    // Gom mọi mục có điểm sát với mục cao nhất (trong phạm vi margin) -> coi là "đồng hạng",
    // máy đang phân vân giữa các mục này. Thay vì đoán liều 1 mục, cho người dùng tự chọn.
    const topTier = scored.filter((s) => best.score - s.score < KB_MATCH_MIN_MARGIN);
    if (topTier.length > 1) {
      return { type: "ambiguous", candidates: topTier.slice(0, 4).map((s) => s.entry) };
    }
    return { type: "confident", entry: best.entry };
  }

  function sendMessage() {
    const question = input.trim();
    if (!question || loading) return;
    setMessages((prev) => [...prev, { role: "user", text: question }]);
    setInput("");

    const result = matchKb(question);

    if (result.type === "confident") {
      const matched = result.entry;
      setMessages((prev) => [
        ...prev,
        {
          role: "assistant",
          source: "kb",
          text: matched.content,
          matchedTitle: matched.title,
          videoUrl: matched.videoUrl || "",
          images: getEntryImages(matched),
          question,
        },
      ]);
      return;
    }

    if (result.type === "ambiguous") {
      setMessages((prev) => [
        ...prev,
        { role: "assistant", source: "ambiguous", text: "🤔 Mình tìm thấy vài mục có thể phù hợp, ý bạn là mục nào?", candidates: result.candidates, question },
      ]);
      return;
    }

    setMessages((prev) => [
      ...prev,
      { role: "assistant", source: "nomatch", text: "🔍 Không tìm thấy nội dung phù hợp trong tài liệu đã nạp.", question },
    ]);
  }

  function selectAmbiguousCandidate(index, entry) {
    setMessages((prev) =>
      prev.map((m, i) =>
        i === index
          ? {
              role: "assistant",
              source: "kb",
              text: entry.content,
              matchedTitle: entry.title,
              videoUrl: entry.videoUrl || "",
              images: getEntryImages(entry),
              question: m.question,
            }
          : m
      )
    );
  }

  async function askAI(index) {
    const msg = messages[index];
    if (!msg || !msg.question) return;
    setMessages((prev) => prev.map((m, i) => (i === index ? { ...m, asking: true } : m)));
    setLoading(true);
    try {
      const priorMessages = messages
        .slice(0, index)
        .filter((m) => !(m.role === "assistant" && (m.source === "nomatch" || m.source === "error" || m.source === "ambiguous")));
      const history = [...priorMessages.map((m) => ({ role: m.role, text: m.text })), { role: "user", text: msg.question }];
      const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ history }) });
      const data = await r.json();
      if (data.ok) {
        setMessages((prev) =>
          prev.map((m, i) =>
            i === index
              ? { role: "assistant", source: "ai", text: data.text, needsEscalation: data.needsEscalation, question: msg.question, escalated: false, asking: false }
              : m
          )
        );
      } else {
        setMessages((prev) => prev.map((m, i) => (i === index ? { ...m, source: "error", asking: false, text: "Đã có lỗi: " + (data.error || "không rõ nguyên nhân.") } : m)));
      }
    } catch (e) {
      setMessages((prev) => prev.map((m, i) => (i === index ? { ...m, source: "error", asking: false, text: "Đã có lỗi khi kết nối tới hệ thống trả lời. Vui lòng thử lại." } : m)));
    } finally {
      setLoading(false);
    }
  }

  function handleKeyDown(e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  const filteredEntries = kbEntries.filter((e) => {
    const matchesCategory = filterCategory === "ALL" || e.category === filterCategory;
    const q = searchQuery.trim().toLowerCase();
    const matchesQuery =
      !q ||

      e.content.toLowerCase().includes(q) ||
      (Array.isArray(e.aliases) && e.aliases.some((a) => a.toLowerCase().includes(q)));

                      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                        <button onClick={() => startEdit(e)} title="Chỉnh sửa" style={{ background: "transparent", border: "none", cursor: "pointer", color: "#12303F", height: "fit-content", fontSize: 16 }}>✏️</button>
                        <button onClick={() => removeEntry(e.id)} title="Xoá" style={{ background: "transparent", border: "none", cursor: "pointer", color: "#B5652F", height: "fit-content", fontSize: 16 }}>🗑️</button>
                      </div>
                    </div>
                  )}
                </div>
              ))}
            </div>
          </div>
        ) : tab === "chat" ? (
          <div style={{ width: "100%", maxWidth: 620, ...card, display: "flex", flexDirection: "column", height: 560, padding: 0 }}>
            <div style={{ padding: "10px 20px", borderBottom: "1px solid #EEE9DD", fontSize: 11.5, color: "#8A8272" }}>
              💡 Chatbot tìm câu trả lời có sẵn trong tài liệu trước (miễn phí, tức thì) — chỉ gọi AI khi bạn chủ động bấm "Hỏi AI".
            </div>
            <div ref={scrollRef} style={{ flex: 1, overflowY: "auto", padding: 20, display: "flex", flexDirection: "column", gap: 14 }}>
              {messages.length === 0 && <div style={bubbleAssistant}>{settings.greeting || DEFAULT_GREETING}</div>}
              {messages.map((m, i) => (
                <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: m.role === "user" ? "flex-end" : "flex-start", gap: 6, maxWidth: "100%" }}>
                  {m.role === "assistant" && m.source === "kb" && (
                    <div style={{ fontSize: 10.5, fontWeight: 700, color: "#3D7A4E", textTransform: "uppercase", letterSpacing: "0.03em" }}>🔍 Từ tài liệu — không dùng AI</div>
                  )}
                  {m.role === "assistant" && m.source === "ai" && (
                    <div style={{ fontSize: 10.5, fontWeight: 700, color: "#B5652F", textTransform: "uppercase", letterSpacing: "0.03em" }}>🤖 Claude AI</div>
                  )}
                  {m.role === "assistant" && m.source === "ambiguous" && (
                    <div style={{ fontSize: 10.5, fontWeight: 700, color: "#8A6D00", textTransform: "uppercase", letterSpacing: "0.03em" }}>🔍 Có vài mục gần giống nhau</div>
                  )}
                  <div style={m.role === "user" ? bubbleUser : bubbleAssistant}>
                    {m.role === "assistant" ? renderMessageContent(m.text) : m.text}
                    {m.role === "assistant" && m.source === "kb" && m.videoUrl && (
                      <div style={{ marginTop: 8 }}>
                        <a href={m.videoUrl} target="_blank" rel="noreferrer" style={{ fontSize: 12.5, color: "inherit", fontWeight: 700 }}>🎥 Video hướng dẫn ↗</a>
                      </div>
                    )}
                    {m.role === "assistant" && m.source === "kb" && Array.isArray(m.images) && m.images.map((url, idx) => (
                      <img key={idx} src={url} alt={m.matchedTitle || "Hình minh hoạ"} onClick={() => setLightboxSrc(url)} style={{ maxWidth: "100%", maxHeight: 200, borderRadius: 8, display: "block", marginTop: 8, cursor: "zoom-in" }} onError={(e) => { e.target.style.display = "none"; }} />
                    ))}
                  </div>

                  {m.role === "assistant" && m.source === "ambiguous" && (
                    <div style={{ display: "flex", flexDirection: "column", gap: 6, width: "100%", maxWidth: 480 }}>
                      {m.candidates.map((c, ci) => (
                        <button
                          key={ci}
                          onClick={() => selectAmbiguousCandidate(i, c)}
                          style={{ textAlign: "left", background: "#FFFFFF", border: "1px solid #DDD7C9", borderRadius: 8, padding: "8px 12px", fontSize: 13, cursor: "pointer", color: "#12303F", lineHeight: 1.4 }}
                        >
                          {c.title}
                        </button>
                      ))}
                    </div>
                  )}

                  {m.role === "assistant" && (m.source === "nomatch" || m.source === "error" || m.source === "ambiguous") && (
                    <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                      <button onClick={() => askAI(i)} disabled={m.asking} style={escalateBtn(false)}>
                        {m.asking ? "⏳ Đang hỏi AI..." : m.source === "ambiguous" ? "🤖 Không đúng ý, hỏi AI (Claude)" : "🤖 Hỏi AI (Claude)"}
                      </button>
                      <button onClick={() => escalateQuestion(i)} disabled={m.escalated || m.escalating} style={escalateBtn(m.escalated)}>
                        {m.escalating ? "⏳ Đang gửi..." : m.escalated ? "✅ Đã gửi cho chuyên gia" : "✉️ Gửi câu hỏi cho chuyên gia"}
                      </button>
                    </div>
                  )}
                  {m.role === "assistant" && m.source === "kb" && (
                    <button onClick={() => askAI(i)} disabled={m.asking} style={{ background: "transparent", border: "none", color: "#8A8272", fontSize: 11.5, textDecoration: "underline", cursor: "pointer", padding: 0 }}>
                      {m.asking ? "⏳ Đang hỏi AI..." : "Chưa đúng ý bạn? Hỏi AI thêm"}
                    </button>
                  )}
                  {m.role === "assistant" && m.source === "ai" && m.needsEscalation && (
                    <button onClick={() => escalateQuestion(i)} disabled={m.escalated || m.escalating} style={escalateBtn(m.escalated)}>
                      {m.escalating ? "⏳ Đang gửi..." : m.escalated ? "✅ Đã gửi cho chuyên gia" : "✉️ Gửi câu hỏi này cho chuyên gia"}
                    </button>
                  )}
                  {m.role === "assistant" && m.escalateError && <div style={{ fontSize: 11, color: "#B3261E" }}>{m.escalateError}</div>}
                </div>
              ))}
              {loading && <div style={{ alignSelf: "flex-start", color: "#6B6255", fontSize: 13 }}>⏳ Đang hỏi AI...</div>}
            </div>
            <div style={{ display: "flex", gap: 8, padding: 14, borderTop: "1px solid #EEE9DD" }}>
              <input style={{ ...inputStyle, marginBottom: 0, flex: 1 }} placeholder="Nhập câu hỏi của bạn..." value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={handleKeyDown} />
              <button onClick={sendMessage} disabled={loading} style={{ ...primaryButtonStyle, width: "auto", margin: 0, padding: "0 16px" }}>➤</button>
            </div>
          </div>
        ) : (
          <div style={{ width: "100%", maxWidth: 760, display: "flex", flexDirection: "column", gap: 20 }}>
            <div style={{ ...card, border: "1px solid #F0D9BE", background: "#FFF9F0" }}>
              <div style={sectionTitle}>🗄️ Sao lưu &amp; khôi phục dữ liệu</div>
              <div style={{ fontSize: 12.5, color: "#6B6255", lineHeight: 1.6, marginBottom: 12 }}>
                ⚠️ Dữ liệu (tài liệu, cài đặt, kể cả ảnh đã tải lên) đang lưu trên ổ đĩa tạm của server — <strong>có thể bị mất mỗi khi bạn cập nhật/deploy lại code</strong> (đặc biệt trên gói Free của Render). Hãy bấm <strong>Tải file sao lưu</strong> sau mỗi lần chỉnh sửa tài liệu quan trọng, và <strong>Khôi phục</strong> lại ngay sau khi deploy nếu thấy dữ liệu bị trống.
              </div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <button type="button" onClick={downloadBackup} disabled={backingUp} style={{ ...primaryButtonStyle, width: "auto", flex: "1 1 200px", marginTop: 0 }}>
                  {backingUp ? "⏳ Đang chuẩn bị file (kèm ảnh)..." : "💾 Tải file sao lưu"}
                </button>
                <input ref={backupInputRef} type="file" accept=".json" onChange={restoreBackup} style={{ display: "none" }} />
                <button type="button" onClick={() => backupInputRef.current && backupInputRef.current.click()} disabled={restoringBackup} style={{ ...outlineButton, height: "auto", padding: "10px 16px", flex: "1 1 200px" }}>
                  {restoringBackup ? "⏳ Đang khôi phục..." : "📤 Khôi phục từ file sao lưu"}
                </button>
              </div>
              {backupResult && (
                <div style={{ marginTop: 10, fontSize: 12.5, fontWeight: 600, color: backupResult.ok ? "#3D7A4E" : "#B3261E" }}>
                  {backupResult.ok ? "✅ " : "❌ "}{backupResult.message}
                </div>
              )}
            </div>

            <div style={card}>
              <div style={sectionTitle}>💬 Câu chào mở đầu</div>
              <textarea style={{ ...inputStyle, minHeight: 90, resize: "vertical" }} value={settingsForm.greeting} onChange={(e) => setSettingsForm({ ...settingsForm, greeting: e.target.value })} />

              <div style={{ ...sectionTitle, marginTop: 18 }}>✉️ Email chuyên gia hỗ trợ (dự phòng)</div>
              <div style={{ fontSize: 12.5, color: "#6B6255", marginBottom: 6 }}>Có thể kết nối Zalo OA sau (xem README). Trong lúc chưa có Zalo, câu hỏi chưa trả lời được sẽ gửi qua email này (nếu điền) hoặc chỉ lưu vào nhật ký bên dưới.</div>
              <input style={inputStyle} type="email" placeholder="vd: hotro@congty.vn" value={settingsForm.expertEmail} onChange={(e) => setSettingsForm({ ...settingsForm, expertEmail: e.target.value })} />

              <button onClick={saveSettings} style={primaryButtonStyle}>{settingsSaved ? "✅ Đã lưu" : "💾 Lưu cài đặt"}</button>
              {adminError && <div style={{ marginTop: 10, fontSize: 12.5, color: "#B3261E" }}>{adminError}</div>}
            </div>

            <div style={card}>
              <div style={sectionTitle}>✉️ Câu hỏi đã gửi chuyên gia ({escalations.length})</div>
              {escalations.length === 0 ? (
                <div style={{ fontSize: 13, color: "#8A8272", fontStyle: "italic" }}>Chưa có câu hỏi nào.</div>
              ) : (
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {escalations.map((t) => (
                    <div key={t.id} style={{ background: "#F3F1EC", borderRadius: 10, padding: "10px 12px" }}>
                      <div style={{ fontSize: 13.5, fontWeight: 600 }}>{t.question}</div>
                      <div style={{ fontSize: 11, color: "#8A8272", marginTop: 2 }}>{new Date(t.timestamp).toLocaleString("vi-VN")} · Kênh: {t.sentVia}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div style={card}>
              <div style={sectionTitle}>🔑 Mã quản trị</div>
              <div style={{ fontSize: 12.5, color: "#6B6255", marginBottom: 6 }}>
                Cần để sửa tài liệu / cài đặt (nếu server có bật ADMIN_TOKEN). Mỗi trình duyệt nhập 1 lần.
              </div>
              <input style={inputStyle} type="password" placeholder="Nhập mã quản trị nếu có" value={adminToken} onChange={(e) => saveAdminToken(e.target.value)} />
            </div>
          </div>
        )}
      </div>

      {lightboxSrc && (
        <div
          onClick={() => setLightboxSrc(null)}
          style={{
            position: "fixed", top: 0, left: 0, right: 0, bottom: 0,
            background: "rgba(20, 20, 20, 0.88)", zIndex: 1000,
            display: "flex", alignItems: "center", justifyContent: "center",
            padding: 24, cursor: "zoom-out",
          }}
        >
          <button
            onClick={() => setLightboxSrc(null)}
            style={{
              position: "absolute", top: 18, right: 24, background: "rgba(255,255,255,0.12)", color: "#FFFFFF",
              border: "none", borderRadius: "50%", width: 40, height: 40, fontSize: 20, cursor: "pointer", lineHeight: "40px",
            }}
            aria-label="Đóng"
          >
            ✕
          </button>
          <img
            src={lightboxSrc}
            alt="Ảnh phóng to"
            onClick={(e) => e.stopPropagation()}
            style={{ maxWidth: "90vw", maxHeight: "90vh", borderRadius: 10, boxShadow: "0 10px 40px rgba(0,0,0,0.5)", cursor: "default" }}
          />
        </div>
      )}
    </div>
  );
}

function TabButton({ active, onClick, label }) {
  return <button onClick={onClick} style={{ padding: "8px 14px", borderRadius: 8, border: "none", cursor: "pointer", fontSize: 13, fontWeight: 600, background: active ? "#F3F1EC" : "transparent", color: active ? "#12303F" : "#CBD8DD" }}>{label}</button>;
}
function ModeButton({ active, onClick, label }) {
  return <button onClick={onClick} style={{ flex: 1, padding: "8px 10px", borderRadius: 7, border: "none", cursor: "pointer", fontSize: 12.5, fontWeight: 700, background: active ? "#FFFFFF" : "transparent", color: active ? "#12303F" : "#8A8272" }}>{label}</button>;
}
function escalateBtn(escalated) {
  return { border: "1px solid #DDD7C9", background: escalated ? "#EAF5EC" : "#FFFFFF", color: escalated ? "#3D7A4E" : "#B5652F", borderRadius: 999, padding: "5px 12px", fontSize: 12, fontWeight: 700, cursor: escalated ? "default" : "pointer" };
}

const card = { background: "#FFFFFF", border: "1px solid #DDD7C9", borderRadius: 14, padding: 20 };
const sectionTitle = { fontSize: 15, fontWeight: 700, marginBottom: 4 };
const miniLabel = { fontSize: 10.5, fontWeight: 700, color: "#8A8272", textTransform: "uppercase", letterSpacing: "0.03em" };
const pill = { display: "inline-block", fontSize: 11, color: "#B5652F", background: "#F6E9DE", borderRadius: 999, padding: "2px 8px", margin: "2px 0 8px" };
const labelStyle = { display: "block", fontSize: 12, fontWeight: 600, color: "#6B6255", marginBottom: 5, marginTop: 12 };
const inputStyle = { width: "100%", border: "1px solid #DDD7C9", borderRadius: 8, padding: "9px 11px", fontSize: 14, fontFamily: "inherit", marginBottom: 4, background: "#FCFBF8", outline: "none" };
const primaryButtonStyle = { width: "100%", marginTop: 16, background: "#B5652F", color: "#FFFFFF", border: "none", borderRadius: 8, padding: 10, fontSize: 14, fontWeight: 700, cursor: "pointer" };
const darkButton = { whiteSpace: "nowrap", background: "#12303F", color: "#FFFFFF", border: "none", borderRadius: 8, padding: "0 14px", height: 38, fontSize: 12.5, fontWeight: 700, cursor: "pointer" };
const outlineButton = { whiteSpace: "nowrap", background: "#FFFFFF", color: "#12303F", border: "1px solid #DDD7C9", borderRadius: 8, padding: "0 14px", height: 38, fontSize: 12.5, fontWeight: 700, cursor: "pointer" };
const formatToolbarBtn = { background: "#FFFFFF", color: "#12303F", border: "1px solid #DDD7C9", borderRadius: 6, width: 32, height: 28, fontSize: 13, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", padding: 0 };
const bubbleUser = { maxWidth: "80%", background: "#12303F", color: "#F3F1EC", padding: "10px 14px", borderRadius: 14, borderBottomRightRadius: 4, fontSize: 14, lineHeight: 1.55, whiteSpace: "pre-wrap" };
const bubbleAssistant = { maxWidth: "80%", background: "#F3F1EC", color: "#1E2A32", padding: "10px 14px", borderRadius: 14, borderBottomLeftRadius: 4, fontSize: 14, lineHeight: 1.55, whiteSpace: "pre-wrap" };

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
  // Chuyển JSX/ES6 sang JS thuần bằng Babel, ép dùng "classic runtime"
  // (React.createElement) để tránh Babel tự chèn "import" — thứ không
  // chạy được trong thẻ <script> thường (không phải type="module").
  var sourceCode = document.getElementById("app-source").textContent;
  var compiled = Babel.transform(sourceCode, {
    presets: [["react", { runtime: "classic" }]],
  }).code;
  var appScript = document.createElement("script");
  appScript.textContent = compiled;
  document.body.appendChild(appScript);
</script>
</body>
</html>
