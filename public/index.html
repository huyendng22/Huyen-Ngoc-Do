              </div>
            ) : (
              <div style={{ fontSize: 12.5, color: "#3a4a5c", lineHeight: 1.6 }}>
                Tài liệu đang <strong>đồng bộ từ Google Sheet</strong> (chỉ đọc): thêm / sửa / xoá câu hỏi trực tiếp trong Sheet (cột A Câu hỏi · B Danh mục · C Câu trả lời · D Link video · E Link ảnh · F Cách hỏi khác). Server tự cập nhật mỗi {s.intervalMinutes} phút; bấm "Đồng bộ ngay" để thấy thay đổi tức thì.
                {!s.writeConfigError && <div style={{ marginTop: 6, color: "#5b6b7e" }}>Muốn nhập dữ liệu ngay trong chatbot và tự ghi vào Sheet? Bật "ghi hai chiều" — xem README, mục <em>"Nhập dữ liệu ngay trong chatbot và tự ghi ngược vào Google Sheet"</em>.</div>}
              </div>
            )}
            {s.writeConfigError && <div style={{ fontSize: 12.5, color: "#B3261E", fontWeight: 600, marginTop: 8, lineHeight: 1.6 }}>Ghi hai chiều chưa bật: {s.writeConfigError}</div>}
            <div style={{ fontSize: 12, color: "#5b6b7e", marginTop: 6 }}>
              Đồng bộ thành công gần nhất: <strong>{when(s.lastOkAt)}</strong> · {s.entries} mục
              {s.skippedCount > 0 && <> · <span style={{ color: "#8A6D00" }}>{s.skippedCount} dòng bị bỏ qua</span></>}
              {s.warningsCount > 0 && <> · <span style={{ color: "#8A6D00" }}>{s.warningsCount} cảnh báo</span></>}
            </div>
            {s.error && <div style={{ fontSize: 12.5, color: "#B3261E", fontWeight: 600, marginTop: 8, lineHeight: 1.6 }}>{s.error}</div>}
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 10 }}>
              <button type="button" onClick={syncSheetNow} disabled={sheetBusy} style={darkButton}>{sheetBusy ? "Đang đồng bộ..." : "Đồng bộ ngay"}</button>
              {s.writeEnabled && <button type="button" onClick={testSheetWrite} disabled={sheetBusy} style={outlineButton}>Kiểm tra kết nối ghi</button>}
              {link && <a href={link} target="_blank" rel="noreferrer" style={{ ...outlineButton, display: "inline-flex", alignItems: "center", textDecoration: "none" }}>Mở Google Sheet để sửa</a>}
            </div>
            {sheetNote && <div style={{ marginTop: 8, fontSize: 12.5, fontWeight: 600, color: sheetNote.ok ? "#3D7A4E" : "#B3261E" }}>{sheetNote.ok ? "" : ""}{sheetNote.message}</div>}
            {((s.skipped && s.skipped.length > 0) || (s.warnings && s.warnings.length > 0)) && (
              <details style={{ marginTop: 8 }}>
                <summary style={{ cursor: "pointer", fontSize: 12, fontWeight: 600, color: "#8A6D00" }}>Xem dòng bị bỏ qua / cảnh báo trong Sheet</summary>
                <ul style={{ fontSize: 12, color: "#5b6b7e", lineHeight: 1.6, margin: "6px 0", paddingLeft: 20 }}>
                  {(s.skipped || []).slice(0, 30).map((x, i) => <li key={"k" + i}>Dòng {x.row}: {x.reason}{x.question ? ` — "${x.question}"` : ""} (không đưa vào chatbot)</li>)}
                  {(s.warnings || []).slice(0, 30).map((w, i) => <li key={"w" + i}>{w}</li>)}
                </ul>
              </details>
            )}
          </>
        )}
      </div>
    );
  }

  const reasonCount = (u, k) => (u.reasons && u.reasons[k]) || 0;
  const needsAttention = (u) => reasonCount(u, "ai_unknown") + reasonCount(u, "escalated") > 0;
  const unansweredScore = (u) => (u.count || 0) + 2 * (reasonCount(u, "ai_unknown") + reasonCount(u, "escalated"));
  const unansweredCounts = {
    all: unanswered.length,
    new: unanswered.filter((u) => u.status === "new").length,
    resolved: unanswered.filter((u) => u.status === "resolved").length,
    ignored: unanswered.filter((u) => u.status === "ignored").length,
    attention: unanswered.filter((u) => u.status === "new" && needsAttention(u)).length,
    ai_ok: unanswered.filter((u) => u.status === "new" && reasonCount(u, "ai_answered") > 0 && !needsAttention(u)).length,
  };
  unansweredCounts.open = unansweredCounts.new;
  unansweredCounts.closed = unansweredCounts.resolved + unansweredCounts.ignored;
  const openUnansweredCount = unansweredCounts.new;
  const filteredUnanswered = unanswered
    .filter((u) => {
      if (unansweredFilter === "new" || unansweredFilter === "open") return u.status === "new";
      if (unansweredFilter === "resolved") return u.status === "resolved";
      if (unansweredFilter === "ignored") return u.status === "ignored";
      if (unansweredFilter === "attention") return u.status === "new" && needsAttention(u);
      if (unansweredFilter === "ai_ok") return u.status === "new" && reasonCount(u, "ai_answered") > 0 && !needsAttention(u);
      return true;
    })
    .sort((a, b) => unansweredScore(b) - unansweredScore(a) || String(b.lastAt).localeCompare(String(a.lastAt)));

  const filteredEntries = kbEntries.filter((e) => {
    const matchesCategory = filterCategory === "ALL" || e.category === filterCategory;
    const q = searchQuery.trim().toLowerCase();
    const matchesQuery =
      !q ||
      e.title.toLowerCase().includes(q) ||
      e.content.toLowerCase().includes(q) ||
      (Array.isArray(e.aliases) && e.aliases.some((a) => a.toLowerCase().includes(q)));
    return matchesCategory && matchesQuery;
  });

  // ===== Hàm cho giao diện mới =====
  function toast(text) {
    setToastMsg(text);
    clearTimeout(toastTimerRef.current);
    toastTimerRef.current = setTimeout(() => setToastMsg(null), 2400);
  }

  function openAdd() {
    setForm({ ...EMPTY_FORM, category: filterCategory !== "ALL" ? filterCategory : CATEGORIES[0].id });
    setNewImageUrlDraft("");
    setUploadError("");
    setAdminError("");
    setFromUnanswered(null);
    setAddOpen(true);
  }
  function closeAdd() {
    setAddOpen(false);
    setForm({ ...EMPTY_FORM });
    setNewImageUrlDraft("");
    setFromUnanswered(null);
    setUploadError("");
  }

  // Công tắc "Hiển thị" / "Câu hỏi gợi ý" ở từng dòng của bảng
  async function toggleFlag(entry, flag, value) {
    if (sheetReadOnly) return;
    setAdminError("");
    const patch = { [flag]: value };
    if (flag === "visible" && !value) patch.suggested = false; // câu hỏi bị ẩn thì không thể là câu hỏi gợi ý
    setFlagBusy(entry.id + flag);
    let ok;
    if (sheetWrite) ok = await sheetEntryCall("PUT", entry.id, { ...entry, ...patch });
    else ok = await saveKbEntries(kbEntries.map((e) => (e.id === entry.id ? { ...e, ...patch } : e)));
    setFlagBusy("");
    if (ok) {
      toast(flag === "visible" ? (value ? "Đã bật hiển thị câu hỏi" : "Đã tắt hiển thị câu hỏi") : (value ? "Đã thêm vào câu hỏi gợi ý" : "Đã bỏ khỏi câu hỏi gợi ý"));
    }
  }

  async function addCustomCategory() {
    const name = categoryName.replace(/[\r\n|]+/g, " ").replace(/\s+/g, " ").trim();
    if (!name) { toast("Nhập tên danh mục"); return; }
    if (allCategories.some((c) => c.label.toLowerCase() === name.toLowerCase() || c.id.toLowerCase() === name.toLowerCase())) { toast("Danh mục này đã tồn tại"); return; }
    setAdminError("");
    const next = [...(settings.customCategories || []), name];
    const r = await fetch("/api/settings", { method: "PUT", headers: authHeaders(adminToken), body: JSON.stringify({ customCategories: next }) });
    if (r.status === 401) { setAdminError("Sai mã quản trị — vào tab Cài đặt hệ thống để nhập lại."); return; }
    const d = await r.json().catch(() => null);
    if (d && d.settings) {
      setSettings((p) => ({ ...p, ...d.settings }));
      setSettingsForm((p) => ({ ...p, customCategories: d.settings.customCategories }));
    }
    setCategoryOpen(false);
    setFilterCategory(name);
    setLibPage(1);
    toast("Đã tạo danh mục");
  }

  // "Thêm vào cách hỏi khác": chọn câu hỏi có sẵn để gắn câu hỏi chưa trả lời vào làm 1 cách hỏi khác
  async function chooseAliasTarget(entry) {
    const rec = aliasPicker && aliasPicker.rec;
    if (!rec) return;
    setAliasPicker(null);
    if (sheetReadOnly) {
      const ok = await copyTextToClipboard(rec.question);
      setUnansweredNote({
        ok,
        message: ok
          ? `Đã sao chép "${rec.question}". Mở Google Sheet, tìm dòng "${entry.title}" và dán vào ô "Cách hỏi khác" (cột F), các cách hỏi cách nhau bằng dấu |.`
          : `Không sao chép tự động được. Hãy tự thêm "${rec.question}" vào cột F (Cách hỏi khác) của dòng "${entry.title}" trong Google Sheet.`,
      });
      return;
    }
    setFromUnanswered({ id: rec.id, question: rec.question, withDraft: false, asAlias: true, target: entry.title });
    startEdit(entry, rec.question);
  }

  async function deleteUnansweredMany(ids) {
    if (!ids.length) return;
    if (!window.confirm(`Xóa ${ids.length} mục đã chọn?`)) return;
    try {
      for (const id of ids) {
        const r = await fetch(`/api/unanswered/${id}`, { method: "DELETE", headers: authHeaders(adminToken) });
        if (r.status === 401) { setUnansweredError(NEED_TOKEN_MSG); return; }
      }
    } catch (e) {
      setUnansweredError("Lỗi kết nối.");
      return;
    }
    setSelectedUn(new Set());
    await loadUnanswered();
    setUnansweredNote({ ok: true, message: `Đã xóa ${ids.length} câu hỏi.` });
  }

  // Phần thân của hộp thoại Thêm / Sửa câu hỏi (dùng chung cho cả 2 chế độ)
  function renderQuestionFormFields(isEdit) {
    const f = isEdit ? editForm : form;
    const setF = isEdit ? setEditForm : setForm;
    const taRef = isEdit ? editContentRef : contentRef;
    const quickRef = isEdit ? editQuickImageInputRef : quickImageInputRef;
    const imgRef = isEdit ? editImageInputRef : imageInputRef;
    const draft = isEdit ? newImageUrlDraftEdit : newImageUrlDraft;
    const setDraft = isEdit ? setNewImageUrlDraftEdit : setNewImageUrlDraft;
    const setContent = (v) => setF((prev) => ({ ...prev, content: v }));
    const aliasRows = f.aliasesText === "" ? [""] : f.aliasesText.split("\n");
    const setAliasRows = (rows) => setF((prev) => ({ ...prev, aliasesText: rows.join("\n") }));
    const noUpload = sheetWrite;
    return (
      <div className="form-grid">
        {fromUnanswered && (
          <div className="field wide">
            <div className="inline-ok" style={{ background: "#eef7ff", color: "#246ba5", fontWeight: 400 }}>
              Đang xử lý câu hỏi chưa trả lời: <strong>“{fromUnanswered.question}”</strong>.{" "}
              {fromUnanswered.asAlias
                ? <>Câu này đã được thêm vào ô "Cách hỏi khác" của <strong>{fromUnanswered.target}</strong>. Bấm <strong>Lưu</strong> để áp dụng; câu hỏi sẽ tự được đánh dấu "Đã xử lý".</>
                : <>{fromUnanswered.withDraft && <strong>Câu trả lời bên dưới là bản nháp do AI soạn — hãy kiểm tra kỹ trước khi lưu. </strong>}Sau khi bấm <strong>Lưu</strong>, câu hỏi này sẽ tự được đánh dấu "Đã xử lý".</>}{" "}
              <button type="button" onClick={() => setFromUnanswered(null)} style={{ background: "transparent", border: "none", color: "#076ab7", fontWeight: 700, cursor: "pointer", padding: 0 }}>✕ Bỏ liên kết</button>
            </div>
          </div>
        )}
        <label className="field wide">
          <span>Danh mục *</span>
          <select value={f.category} onChange={(e) => setF((prev) => ({ ...prev, category: e.target.value }))}>
            {allCategories.map((c) => <option key={c.id} value={c.id}>{c.label}</option>)}
          </select>
        </label>
        <label className="field wide">
          <span>Câu hỏi chuẩn *</span>
          <input placeholder="Nhập câu hỏi chuẩn" value={f.title} onChange={(e) => setF((prev) => ({ ...prev, title: e.target.value }))} />
        </label>
        <div className="field wide">
          <div className="alias-head">
            <span>Cách hỏi khác</span>
            <span style={{ display: "inline-flex", gap: 6 }}>
              <button type="button" className="btn secondary alias-add" disabled={suggestingAliases} onClick={() => suggestAliases(f.title, f.content, setF)}>{suggestingAliases ? "AI đang nghĩ..." : "AI gợi ý"}</button>
              <button type="button" className="btn secondary alias-add" onClick={() => setAliasRows([...aliasRows, ""])}>＋ Thêm cách hỏi</button>
            </span>
          </div>
          <div className="alias-list">
            {aliasRows.map((v, i) => (
              <div className="alias-row" key={i}>
                <input value={v} placeholder="Nhập một cách hỏi khác" onChange={(e) => { const r = [...aliasRows]; r[i] = e.target.value; setAliasRows(r); }} />
                <button type="button" className="alias-remove" aria-label="Xóa cách hỏi" onClick={() => { const r = aliasRows.filter((_, k) => k !== i); setAliasRows(r.length ? r : [""]); }}>×</button>
              </div>
            ))}
          </div>
        </div>
        <div className="field wide">
          <span>Câu trả lời *</span>
          <div className="rich-wrap">
            <div className="rich-toolbar" role="toolbar" aria-label="Định dạng câu trả lời">
              <button type="button" style={{ width: "auto", padding: "0 8px" }} title="Tiêu đề phần (đánh dấu dòng hiện tại là 1 mục lớn, bấm lại để bỏ)" onClick={() => toggleHeading(taRef, f.content, setContent)}>Tiêu đề</button>
              <span className="rich-divider" />
              <button type="button" title="In đậm (Ctrl+B)" onClick={() => wrapSelection(taRef, f.content, setContent, "**")}><b>B</b></button>
              <button type="button" title="In nghiêng (Ctrl+I)" onClick={() => wrapSelection(taRef, f.content, setContent, "*")}><i>I</i></button>
              <button type="button" title="Gạch chân (Ctrl+U)" onClick={() => wrapSelection(taRef, f.content, setContent, "__")}><u>U</u></button>
              <span className="rich-divider" />
              <button type="button" title="Danh sách gạch đầu dòng" onClick={() => prefixLines(taRef, f.content, setContent, "dash")}>–</button>
              <button type="button" title="Danh sách chấm tròn" onClick={() => prefixLines(taRef, f.content, setContent, "dot")}>•</button>
              <button type="button" title="Danh sách đánh số" onClick={() => prefixLines(taRef, f.content, setContent, "ol")}>1.</button>
              <span className="rich-divider" />
              <input
                ref={quickRef}
                type="file"
                accept="image/*"
                style={{ display: "none" }}
                onChange={async (e) => {
                  const file = e.target.files && e.target.files[0];
                  e.target.value = "";
                  if (!file) return;
                  const url = await uploadImageFile(file);
                  if (url) insertImageIntoContent(taRef, f.content, setContent, url);
                }}
              />
              <button type="button" title={noUpload ? "Đang ghi vào Google Sheet: không tải ảnh từ máy lên được" : "Chèn ảnh (chọn file, tự tải lên và chèn ngay vào vị trí con trỏ)"} disabled={uploadingImage || noUpload} onClick={() => quickRef.current && quickRef.current.click()}>{uploadingImage ? "" : ""}</button>
            </div>
            <textarea
              ref={taRef}
              className="rich-editor-ta"
              placeholder="Nhập nội dung trả lời (có thể dán ảnh bằng Ctrl+V hoặc kéo-thả file ảnh vào đây)"
              value={f.content}
              onChange={(e) => handleContentChange(e, setContent)}
              onKeyDown={(e) => handleContentKeyDown(e, taRef, f.content, setContent)}
              onPaste={(e) => handleContentPaste(e, taRef, f.content, setContent)}
              onDrop={(e) => handleContentDrop(e, taRef, f.content, setContent)}
            />
          </div>
          <p className="hint">Định dạng: **đậm**, *nghiêng*, __gạch chân__; "- " / "• " / "1. " đầu dòng tạo danh sách; gõ "-&gt;" tự thành →. Link ảnh nằm riêng 1 dòng sẽ hiện thành ảnh đúng vị trí đó.</p>
          {f.content.trim() && (
            <>
              <div className="preview-label">Xem trước (đúng như khi chatbot trả lời):</div>
              <div className="preview-box">{renderFormattedBlock(f.content, isEdit ? "preview-edit" : "preview-add", setLightboxSrc)}</div>
            </>
          )}
        </div>
        <label className="field wide">
          <span>Link video</span>
          <input type="url" placeholder="https://..." value={f.videoUrl} onChange={(e) => setF((prev) => ({ ...prev, videoUrl: e.target.value }))} />
        </label>
        <div className="field wide">
          <div className="attachment-title">Tài liệu đính kèm (ảnh minh hoạ)</div>
          {f.images.length > 0 && (
            <div className="thumb-grid">
              {f.images.map((url, idx) => (
                <div className="thumb" key={idx}>
                  <div className="box">
                    <img src={url} alt={`Ảnh ${idx + 1}`} onClick={() => setLightboxSrc(url)} onError={(ev) => { ev.currentTarget.style.opacity = "0.35"; ev.currentTarget.title = "Ảnh không tải được"; }} />
                    <button type="button" className="x" aria-label="Bỏ ảnh" onClick={() => removeImageAt(setF, idx)}>✕</button>
                  </div>
                  <button type="button" className="ins" title="Chèn ảnh này vào đúng vị trí con trỏ trong Câu trả lời" onClick={() => insertImageIntoContent(taRef, f.content, setContent, url)}>＋ Chèn vào câu trả lời</button>
                </div>
              ))}
            </div>
          )}
          <input ref={imgRef} type="file" accept="image/*" hidden onChange={(e) => handleImageUpload(e, (url) => setF((prev) => ({ ...prev, images: [...prev.images, url] })))} />
          <button type="button" className="attachment-upload" disabled={uploadingImage || noUpload} title={noUpload ? "Đang ghi vào Google Sheet: hãy dán link ảnh https://…" : undefined} onClick={() => imgRef.current && imgRef.current.click()}>
            <IconUploadCloud />{uploadingImage ? "Đang tải..." : "Tải lên"}
          </button>
          <div className="link-row">
            <input placeholder="Hoặc dán link ảnh rồi bấm '+ Thêm'" value={draft} onChange={(e) => setDraft(e.target.value)} />
            <button type="button" className="btn secondary" onClick={() => { addImageUrl(setF, draft); setDraft(""); }}>+ Thêm</button>
          </div>
          <p className="attachment-help">{noUpload ? "Đang ghi dữ liệu vào Google Sheet nên không tải ảnh từ máy lên được (ổ đĩa Render là tạm thời). Hãy dán link ảnh https://… hoặc đưa file ảnh vào thư mục public/uploads trên GitHub rồi ghi /uploads/ten-anh.png." : "Ảnh tải lên được lưu trên server. Trên gói Free của Render ảnh có thể mất khi server khởi động lại — nên dùng link ảnh hoặc đưa file vào public/uploads trên GitHub."}</p>
          {uploadError && <div className="note-line err">{uploadError}</div>}
        </div>
        {adminError && <div className="field wide"><div className="inline-alert">{adminError}</div></div>}
      </div>
    );
  }

  // ===== Dẫn xuất cho giao diện mới =====
  const customNames = [...new Set([...(settings.customCategories || []), ...kbEntries.map((e) => e.category).filter((c) => c && !CATEGORIES.some((b) => b.id === c))])];
  const allCategories = [...CATEGORIES.map((c) => ({ id: c.id, label: c.label })), ...customNames.map((n) => ({ id: n, label: n }))];
  const catCount = (id) => kbEntries.filter((e) => (e.category || "KHAC") === id).length;
  const treeKey = catTreeSearch.trim().toLowerCase();
  const treeRows = allCategories.filter((c) => !treeKey || c.label.toLowerCase().includes(treeKey));
  const libPages = Math.max(1, Math.ceil(filteredEntries.length / libSize));
  const libCur = Math.min(libPage, libPages);
  const libRows = filteredEntries.slice((libCur - 1) * libSize, libCur * libSize);
  const canEditKb = !sheetReadOnly;
  const suggestedEntries = kbEntries.filter((e) => e.visible !== false && e.suggested === true).slice(0, 8);
  const detailEntry = detailId ? kbEntries.find((e) => e.id === detailId) : null;
  const unPages = Math.max(1, Math.ceil(filteredUnanswered.length / unSize));
  const unCur = Math.min(unPage, unPages);
  const unRows = filteredUnanswered.slice((unCur - 1) * unSize, unCur * unSize);
  const allUnSelected = filteredUnanswered.length > 0 && filteredUnanswered.every((u) => selectedUn.has(u.id));
  const greetParts = splitGreeting(settings.greeting || DEFAULT_GREETING);
  const apKey = apSearch.trim().toLowerCase();
  const apFiltered = kbEntries.filter((e) => (apCat === "ALL" || e.category === apCat) && (!apKey || (e.title + " " + (e.aliases || []).join(" ")).toLowerCase().includes(apKey)));
  const apPages = Math.max(1, Math.ceil(apFiltered.length / apSize));
  const apCur = Math.min(apPage, apPages);
  const apRows = apFiltered.slice((apCur - 1) * apSize, apCur * apSize);

  return (
    <div>
      <header className="top">
        <div className="brand">HR<b>Office</b></div>
        <div className="navtop"><span>♧ Quản lý nhân sự</span><span>▥ Đánh giá hiệu suất</span><span>▣ Đánh giá năng lực</span><span>◴ Khảo sát nội bộ</span></div>
        <div className="spacer" />
        <span>🔔</span>
        <div className="profile"><span className="avatar">SA</span><div>Super Admin<br /><small>Quản trị hệ thống</small></div></div>
      </header>
      <div className="shell">
        <aside className="sidebar">
          <div className="nav-title">Hệ thống</div>
          <div className="navitem">⌂ &nbsp; Trang chủ</div>
          <div className="navitem">☷ &nbsp; Danh mục</div>
          <div className="navitem">⚙ &nbsp; Cấu hình hệ thống</div>
          <div className="navitem active">◉ &nbsp; AI hỏi đáp</div>
          <div className={"navitem sub" + (tab === "kb" ? " active" : "")} role="button" onClick={() => setTab("kb")}>Quản lý Chatbot</div>
          <div className={"navitem sub" + (tab === "unanswered" ? " active" : "")} role="button" onClick={() => { setTab("unanswered"); loadUnanswered(); }}>Câu hỏi chưa tìm thấy</div>
          <div className="navitem">▤ &nbsp; Hướng dẫn sử dụng</div>
        </aside>
        <main className="main">
          <div className="crumb">AI hỏi đáp / <b>Quản lý Chatbot</b></div>
          <div className="titlebar"><div><h1>Quản lý Chatbot</h1></div></div>
          <div className="tabs" role="tablist">
            {[["kb", "Thư viện câu hỏi"], ["unanswered", "Câu hỏi chưa tìm thấy"], ["conversation", "Cấu hình hội thoại"], ["chat", "Chat thử nghiệm"], ["settings", "Cài đặt hệ thống"]].map(([id, label]) => (
              <button key={id} type="button" className={"tab" + (tab === id ? " active" : "")} data-tab={id} role="tab" onClick={() => { setTab(id); if (id === "unanswered") loadUnanswered(); }}>
                {label}{id === "unanswered" && openUnansweredCount > 0 ? ` (${openUnansweredCount})` : ""}
              </button>
            ))}
          </div>

          {tab === "kb" && (
            <>
              <div className="stack">
                {sheetMode && renderSheetPanel()}
                {renderMissingImagesWarning()}
                {adminError && <div className="inline-alert">{adminError}</div>}
              </div>
              <div className="workspace">
                <aside className="card">
                  <div className="tree-head">
                    <div className="tree-title">
                      <b>Danh mục câu hỏi</b>
                      {canEditKb && <button type="button" id="addCategory" className="add-category-icon" aria-label="Thêm danh mục" title="Thêm danh mục" onClick={() => { setCategoryName(""); setCategoryOpen(true); }}><IconAddCategory /></button>}
                    </div>
                    <input className="search" placeholder="Tìm danh mục..." value={catTreeSearch} onChange={(e) => setCatTreeSearch(e.target.value)} />
                  </div>
                  <div className="tree">
                    <div className={"tree-row all" + (filterCategory === "ALL" ? " selected" : "")} data-tree="ALL" onClick={() => { setFilterCategory("ALL"); setLibPage(1); }}><span>Tất cả danh mục</span><span className="count">{kbEntries.length}</span></div>
                    {treeRows.map((c) => (
                      <div key={c.id} className={"tree-row" + (filterCategory === c.id ? " selected" : "")} data-tree={c.id} onClick={() => { setFilterCategory(c.id); setLibPage(1); }}>
                        <span>{c.label}</span><span className="count">{catCount(c.id)}</span>
                      </div>
                    ))}
                    {treeRows.length === 0 && <div className="empty">Không có danh mục phù hợp</div>}
                  </div>
                </aside>
                <section className="card list-card">
                  <div className="toolbar">
                    <input className="search" placeholder="Tìm câu hỏi, cách hỏi khác..." value={searchQuery} onChange={(e) => { setSearchQuery(e.target.value); setLibPage(1); }} />
                    <button type="button" id="refresh" className="btn secondary icon" title="Làm mới" onClick={() => { setSearchQuery(""); setFilterCategory("ALL"); setCatTreeSearch(""); setLibPage(1); loadKb(); toast("Đã làm mới danh sách"); }}>↻</button>
                    <div className="space" />
                    {canEditKb && <button type="button" id="import" className="btn secondary" onClick={() => { setImportMode("excel"); setImportResult(null); setAdminError(""); setImportOpen(true); }}>⇧ Import Excel</button>}
                    {canEditKb && <button type="button" id="addQuestion" className="btn" onClick={openAdd}>＋ Thêm mới</button>}
                  </div>
                  <div className="table-wrap">
                    <table className="table">
                      <thead><tr><th>STT</th><th>Câu hỏi chuẩn</th><th>Danh mục</th><th>Cách hỏi khác</th><th>Hiển thị</th><th>Câu hỏi gợi ý</th><th>Thao tác</th></tr></thead>
                      <tbody id="questionRows">
                        {loadingKb && <tr><td colSpan="7" className="empty">Đang tải...</td></tr>}
                        {!loadingKb && libRows.length === 0 && <tr><td colSpan="7" className="empty">Không có câu hỏi phù hợp</td></tr>}
                        {libRows.map((e, i) => {
                          const visible = e.visible !== false;
                          const suggested = visible && e.suggested === true;
                          return (
                            <tr key={e.id}>
                              <td>{(libCur - 1) * libSize + i + 1}</td>
                              <td>
                                <span className="question link" role="button" tabIndex={0} onClick={() => setDetailId(e.id)}>{e.title}</span>
                                <span className="subtext">{plainPreview(e.content, 62)}</span>
                              </td>
                              <td><span className="tag">{getCategoryLabel(e.category)}</span></td>
                              <td>{Array.isArray(e.aliases) ? e.aliases.length : 0}</td>
                              <td>
                                <label className={"switch" + (sheetReadOnly ? " disabled" : "")} title={sheetReadOnly ? "Chỉ đọc: đổi trong cột G của Google Sheet" : visible ? "Đang hiển thị" : "Đang ẩn"}>
                                  <input type="checkbox" data-visible={e.id} checked={visible} disabled={sheetReadOnly || flagBusy === e.id + "visible"} onChange={(ev) => toggleFlag(e, "visible", ev.target.checked)} />
                                  <span className="slider" />
                                </label>
                              </td>
                              <td>
                                <label className={"switch" + (!visible || sheetReadOnly ? " disabled" : "")} title={sheetReadOnly ? "Chỉ đọc: đổi trong cột H của Google Sheet" : !visible ? "Cần bật hiển thị câu hỏi trước" : suggested ? "Đang là câu hỏi gợi ý" : "Bật để hiện khi mở chatbot"}>
                                  <input type="checkbox" data-suggested={e.id} checked={suggested} disabled={!visible || sheetReadOnly || flagBusy === e.id + "suggested"} onChange={(ev) => toggleFlag(e, "suggested", ev.target.checked)} />
                                  <span className="slider" />
                                </label>
                              </td>
                              <td>
                                {canEditKb ? (
                                  <>
                                    <button type="button" className="action-icon" title="Sửa" aria-label="Sửa" data-edit-question={e.id} onClick={() => startEdit(e)}><IconEdit /></button>
                                    <button type="button" className="action-icon" title="Xóa" aria-label="Xóa" data-delete-question={e.id} onClick={() => { if (window.confirm("Xóa câu hỏi này?")) removeEntry(e.id); }}><IconDelete /></button>
                                  </>
                                ) : (
                                  <button type="button" className="btn secondary" style={{ height: 30, padding: "0 10px", fontSize: 12 }} data-view-question={e.id} onClick={() => setDetailId(e.id)}>Xem</button>
                                )}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                  <div className="footerbar">
                    <span>Mỗi trang <select id="libraryPageSize" className="page-size" value={libSize} onChange={(e) => { setLibSize(Number(e.target.value)); setLibPage(1); }}><option value="10">10</option><option value="20">20</option><option value="50">50</option></select> trong tổng số <b id="recordTotal">{filteredEntries.length}</b></span>
                    <span id="libraryPager" className="pager">{renderPager(libCur, libPages, setLibPage)}</span>
                  </div>
                </section>
              </div>
            </>
          )}

          {tab === "unanswered" && (
            <section className="card unanswered-card">
              <div className="unanswered-head">
                <div>
                  <h2>Phản hồi không tìm thấy</h2>
                  <p>Chatbot tự ghi lại mỗi câu hỏi mà tài liệu không có, người dùng thấy chưa đúng ý, hoặc AI cũng không trả lời được. Các cách hỏi giống nhau được gộp lại và đếm số lần.</p>
                  {unansweredMeta && (
                    <div className="unanswered-note" style={{ background: unansweredMeta.webhookConfigured ? "#eaf5ec" : "#fff6ec" }}>
                      {unansweredMeta.webhookConfigured
                        ? "Mỗi câu hỏi mới cũng được gửi sang nơi lưu bên ngoài (webhook), nên không mất khi server khởi động lại."
                        : "Chưa cấu hình nơi lưu bền vững (biến UNANSWERED_WEBHOOK_URL). Trên gói Free của Render, danh sách này sẽ mất khi server ngủ hoặc khởi động lại — hãy cấu hình webhook (xem README)."}
                      {" "}Server khởi động lúc {unansweredMeta.startedAt ? new Date(unansweredMeta.startedAt).toLocaleString("vi-VN") : "—"}.
                    </div>
                  )}
                </div>
                <div className="unanswered-head-actions">
                  <label className="select-all-tick" title="Chọn tất cả trong danh sách">
                    <input id="selectAllUnanswered" type="checkbox" checked={allUnSelected} onChange={(e) => setSelectedUn(e.target.checked ? new Set(filteredUnanswered.map((u) => u.id)) : new Set())} /> Chọn tất cả
                  </label>
                  <button type="button" id="deleteSelectedUnanswered" className="btn secondary delete-outline delete-icon-only delete-selected" title="Xóa mục đã chọn" aria-label="Xóa mục đã chọn" disabled={selectedUn.size === 0} onClick={() => deleteUnansweredMany([...selectedUn])}><IconTrash /></button>
                </div>
              </div>
              <div className="status-tabs" role="tablist">
                {[["all", "Tất cả"], ["new", "Chưa xử lý"], ["resolved", "Đã xử lý"], ["ignored", "Bỏ qua"]]
                  .concat(unansweredCounts.attention > 0 ? [["attention", "Cần chú ý"]] : [], unansweredCounts.ai_ok > 0 ? [["ai_ok", "AI trả lời được"]] : [])
                  .map(([id, label]) => (
                    <button key={id} type="button" className={"status-tab" + ((unansweredFilter === id || (unansweredFilter === "open" && id === "new")) ? " active" : "")} data-unanswered-status={id} onClick={() => { setUnansweredFilter(id); setUnPage(1); }}>
                      {label} <span>({unansweredCounts[id]})</span>
                    </button>
                  ))}
              </div>
              {unansweredNote && <div className={"note-line " + (unansweredNote.ok ? "ok" : "err")} style={{ marginTop: 0, marginBottom: 12 }}>{unansweredNote.ok ? "" : ""}{unansweredNote.message}</div>}
              {unansweredError && <div className="inline-alert" style={{ marginBottom: 12 }}>{unansweredError}</div>}
              <div id="unansweredList" className="unanswered-list">
                {!unansweredError && unRows.length === 0 && <div className="empty">{(unansweredFilter === "new" || unansweredFilter === "open") ? "Hiện chưa có câu hỏi nào cần xử lý." : "Không có câu hỏi ở trạng thái này"}</div>}
                {unRows.map((u) => {
                  const others = (u.samples || []).filter((x) => x !== u.question);
                  const badge = u.status === "resolved" ? "handled" : u.status === "ignored" ? "ignored" : needsAttention(u) ? "" : reasonCount(u, "ai_answered") > 0 ? "ai" : "";
                  return (
                    <article className="unanswered-item" key={u.id}>
                      <div className="item-check">
                        <input type="checkbox" aria-label={"Chọn câu hỏi " + u.question} data-select-unanswered={u.id} checked={selectedUn.has(u.id)} onChange={(e) => setSelectedUn((prev) => { const n = new Set(prev); if (e.target.checked) n.add(u.id); else n.delete(u.id); return n; })} />
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div className="unanswered-item-head">
                            <div>
                              <div className="unanswered-question">{u.question}</div>
                              <div className="unanswered-meta">Hỏi {u.count} lần · Gần nhất {new Date(u.lastAt).toLocaleString("vi-VN")}</div>
                            </div>
                            <span className={"status-badge " + badge}>{u.status === "resolved" ? "Đã xử lý" : u.status === "ignored" ? "Đã bỏ qua" : "Chưa xử lý"}</span>
                          </div>
                          <div style={{ marginTop: 10 }}>
                            {Object.keys(UNANSWERED_REASON_LABELS).filter((k) => reasonCount(u, k) > 0).map((k) => (
                              <span key={k} className={"reason-chip" + (k === "ai_unknown" || k === "escalated" ? " warn" : "")}>{UNANSWERED_REASON_LABELS[k]} ×{reasonCount(u, k)}</span>
                            ))}
                          </div>
                          {others.length > 0 && <div className="unanswered-note">Các cách hỏi khác: {others.join(" · ")}</div>}
                          {u.nearTitles && u.nearTitles.length > 0 && <div className="unanswered-note">Đã gợi ý nhưng chưa đúng ý: {u.nearTitles.join(" · ")}</div>}
                          {u.draftAnswer && (
                            <details className="draft-box">
                              <summary>Xem bản nháp do AI soạn (cần kiểm tra trước khi dùng)</summary>
                              <div>{u.draftAnswer}</div>
                            </details>
                          )}
                          {u.note && <div className="unanswered-note">{u.note}</div>}
                          <div className="unanswered-actions">
                            {u.status === "new" ? (
                              <>
                                {sheetReadOnly ? (
                                  <>
                                    <button type="button" className="btn" data-copy-row={u.id} onClick={() => copyRowForSheet(u, false)}>Sao chép để dán vào Sheet</button>
                                    {u.draftAnswer && <button type="button" className="btn secondary" onClick={() => copyRowForSheet(u, true)}>Sao chép kèm bản nháp AI</button>}
                                  </>
                                ) : (
                                  <>
                                    <button type="button" className="btn" data-create-question={u.id} onClick={() => startFromUnanswered(u, false)}>＋ Tạo câu hỏi mới</button>
                                    {u.draftAnswer && <button type="button" className="btn secondary" onClick={() => startFromUnanswered(u, true)}>＋ Tạo kèm bản nháp AI</button>}
                                  </>
                                )}
                                <button type="button" className="btn secondary" data-add-alias={u.id} onClick={() => { setApCat("ALL"); setApSearch(""); setApPage(1); setAliasPicker({ rec: u }); }}>Thêm vào cách hỏi khác</button>
                                <button type="button" className="btn secondary" onClick={() => updateUnanswered(u.id, "resolved", "Đã xử lý thủ công")}>Đánh dấu đã xử lý</button>
                                <button type="button" className="btn secondary ignore" data-ignore-unanswered={u.id} onClick={() => updateUnanswered(u.id, "ignored")}>Bỏ qua</button>
                              </>
                            ) : (
                              <button type="button" className="btn secondary" onClick={() => updateUnanswered(u.id, "new", "")}>Mở lại</button>
                            )}
                            <button type="button" className="btn secondary delete-outline delete-icon-only delete-one" title="Xóa" aria-label="Xóa" data-delete-unanswered={u.id} onClick={() => deleteUnanswered(u.id)}><IconTrash /></button>
                          </div>
                        </div>
                      </div>
                    </article>
                  );
                })}
              </div>
              <div className="footerbar">
                <span>Mỗi trang <select id="unansweredPageSize" className="page-size" value={unSize} onChange={(e) => { setUnSize(Number(e.target.value)); setUnPage(1); }}><option value="10">10</option><option value="20">20</option><option value="50">50</option></select> trong tổng số <b id="unansweredTotal">{filteredUnanswered.length}</b></span>
                <span id="unansweredPager" className="pager">{renderPager(unCur, unPages, setUnPage)}</span>
              </div>
            </section>
          )}

          {tab === "conversation" && (
            <section className="card conversation-card">
              <header><h2>Cấu hình hội thoại</h2></header>
              <div className="conversation-form">
                <label className="field"><span>Lời chào mở đầu</span><textarea id="welcomeMessage" rows="4" value={settingsForm.greeting || ""} onChange={(e) => setSettingsForm({ ...settingsForm, greeting: e.target.value })} /></label>
                <label className="field"><span>Phản hồi khi không tìm thấy kết quả phù hợp</span><textarea id="noResultMessage" rows="4" value={settingsForm.noResultMessage || ""} onChange={(e) => setSettingsForm({ ...settingsForm, noResultMessage: e.target.value })} /><small>Nội dung này hiện ra khi chatbot không tìm thấy câu trả lời trong tài liệu.</small></label>
                <label className="field expert-contact"><span>Email chuyên gia hỗ trợ (dự phòng)</span><input type="email" placeholder="vd: hotro@congty.vn" value={settingsForm.expertEmail || ""} onChange={(e) => setSettingsForm({ ...settingsForm, expertEmail: e.target.value })} /><small>Dùng khi chưa kết nối Zalo OA (xem README): câu hỏi chuyển chuyên gia sẽ được ghi lại ở tab Cài đặt hệ thống.</small></label>
                {adminError && <div className="inline-alert">{adminError}</div>}
              </div>
              <footer><button type="button" id="saveConversation" className="btn" onClick={saveSettings}>{settingsSaved ? "Đã lưu" : "Lưu cấu hình"}</button></footer>
            </section>
          )}

          {tab === "chat" && (
            <>
              <p className="chat-hint">Chatbot tìm câu trả lời có sẵn trong tài liệu trước (miễn phí, tức thì), chỉ gọi AI khi bạn chủ động bấm "Hỏi AI". Câu hỏi chatbot chưa trả lời được sẽ được ghi lại (không kèm thông tin người hỏi) để bổ sung tài liệu.</p>
              <section className="chat-panel" id="chatPanel">
                <header className="phead"><b>Trợ lý hỗ trợ</b></header>
                <section className="pbody" ref={scrollRef}>
                  <h2>{greetParts.title}</h2>
                  {greetParts.sub && <p>{greetParts.sub}</p>}
                  {suggestedEntries.length > 0 && (
                    <div className="quick">
                      {suggestedEntries.map((e) => (
                        <button key={e.id} type="button" data-suggested-chip={e.id} title={e.title} onClick={() => sendMessage(e.title)}><span>{e.title}</span></button>
                      ))}
                    </div>
                  )}
                  <div className="messages">
                    {messages.map((m, i) => (
                      <div key={i}>
                        {m.role === "user" ? (
                          <div className="msg">{m.text}</div>
                        ) : (
                          <>
                            {m.source === "kb" && <div className="msg-caption">Từ tài liệu — không dùng AI</div>}
                            {m.source === "ai" && <div className="msg-caption ai">Claude AI</div>}
                            <div className="msg bot">
                              {renderMessageContent(m.text)}
                              {m.source === "kb" && m.videoUrl && (
                                <div style={{ marginTop: 8 }}><a href={m.videoUrl} target="_blank" rel="noreferrer" style={{ fontSize: 12.5, color: "#0869b6", fontWeight: 700 }}>Video hướng dẫn ↗</a></div>
                              )}
                              {m.source === "kb" && Array.isArray(m.images) && m.images.map((url, idx) => (
                                <SafeImage key={idx} src={url} alt={m.matchedTitle || "Hình minh hoạ"} onClick={() => setLightboxSrc(url)} style={{ maxWidth: "100%", maxHeight: 200, borderRadius: 8, display: "block", marginTop: 8, cursor: "zoom-in" }} />
                              ))}
                            </div>
                            {m.source === "ambiguous" && (
                              <div className="answer-options">
                                {m.candidates.map((c, ci) => <button key={ci} type="button" onClick={() => selectAmbiguousCandidate(i, c)}>{c.title}</button>)}
                                <button type="button" disabled={m.asking} onClick={() => askAI(i)}>{m.asking ? "Đang hỏi AI..." : "Không đúng ý, hỏi AI (Claude)"}</button>
                                <button type="button" className={"expert" + (m.escalated ? " selected" : "")} disabled={m.escalated || m.escalating} onClick={() => escalateQuestion(i)}>{m.escalating ? "Đang gửi..." : m.escalated ? "Đã gửi cho chuyên gia" : "Liên hệ chuyên gia"}</button>
                              </div>
                            )}
                            {(m.source === "nomatch" || m.source === "error") && (
                              <div className="answer-options">
                                <button type="button" disabled={m.asking} onClick={() => askAI(i)}>{m.asking ? "Đang hỏi AI..." : "Hỏi AI (Claude)"}</button>
                                <button type="button" className={"expert" + (m.escalated ? " selected" : "")} disabled={m.escalated || m.escalating} onClick={() => escalateQuestion(i)}>{m.escalating ? "Đang gửi..." : m.escalated ? "Đã gửi cho chuyên gia" : "Liên hệ chuyên gia"}</button>
                              </div>
                            )}
                            {m.source === "kb" && (
                              <button type="button" className="msg-link" disabled={m.asking} onClick={() => askAI(i)}>{m.asking ? "Đang hỏi AI..." : "Chưa đúng ý bạn? Hỏi AI thêm"}</button>
                            )}
                            {m.source === "ai" && m.needsEscalation && (
                              <div className="answer-options">
                                <button type="button" className={"expert" + (m.escalated ? " selected" : "")} disabled={m.escalated || m.escalating} onClick={() => escalateQuestion(i)}>{m.escalating ? "Đang gửi..." : m.escalated ? "Đã gửi cho chuyên gia" : "Liên hệ chuyên gia"}</button>
                              </div>
                            )}
                            {m.escalateError && <div className="msg-error">{m.escalateError}</div>}
                          </>
                        )}
                      </div>
                    ))}
                    {loading && <div className="msg bot">Đang hỏi AI...</div>}
                  </div>
                </section>
                <div className="composer">
                  <input placeholder="Nhập tin nhắn..." aria-label="Nhập tin nhắn" value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={handleKeyDown} />
                  <button type="button" className="send" aria-label="Gửi tin nhắn" disabled={loading} onClick={() => sendMessage()}>➤</button>
                </div>
              </section>
            </>

          )}

          {tab === "settings" && (
            <div className="settings-stack">
            {renderMissingImagesWarning()}
            {renderSheetPanel()}
            <div style={{ ...card, border: "1px solid #F0D9BE", background: "#FFF9F0" }}>
              <div style={sectionTitle}>Sao lưu &amp; khôi phục dữ liệu</div>
              <div style={{ fontSize: 12.5, color: "#5b6b7e", lineHeight: 1.6, marginBottom: 12 }}>
                Dữ liệu (tài liệu, cài đặt, ảnh) lưu trên ổ đĩa tạm của server — <strong>gói Free của Render xoá sạch mỗi khi server ngủ hoặc deploy lại</strong>. Để khỏi phải khôi phục thủ công: sau mỗi lần chỉnh sửa quan trọng, bấm <strong>Tải file sao lưu</strong>, rồi <strong>upload file đó vào thư mục gốc của repo GitHub</strong> (cạnh server.js). Mỗi lần khởi động, server tự nạp lại từ file sao lưu mới nhất. Chỉnh sửa chưa được đưa lên GitHub sẽ mất khi server khởi động lại. Nút <strong>Khôi phục</strong> bên dưới vẫn dùng được khi cần khôi phục bằng tay.
              </div>
              {seedStatus && (
                <div
                  style={{
                    fontSize: 12.5, lineHeight: 1.6, marginBottom: 12, padding: "8px 10px", borderRadius: 8,
                    background: seedStatus.error ? "#FDECEA" : seedStatus.restored ? "#EAF5EC" : "#eef4fb",
                    color: seedStatus.error ? "#B3261E" : seedStatus.restored ? "#3D7A4E" : "#5b6b7e",
                  }}
                >
                  {seedStatus.error ? (
                    <>Không nạp được file <strong>{seedStatus.file}</strong>: {seedStatus.error}</>
                  ) : seedStatus.restored ? (
                    <>Lần khởi động này server đã tự nạp lại <strong>{seedStatus.entries} mục + {seedStatus.images} ảnh</strong> từ file <strong>{seedStatus.file}</strong> (lúc {new Date(seedStatus.at).toLocaleString("vi-VN")}). Chỉnh sửa sau thời điểm tạo file này sẽ mất nếu server khởi động lại — nhớ tải và upload file sao lưu mới.</>
                  ) : seedStatus.found ? (
                    <>Có file <strong>{seedStatus.file}</strong> trong GitHub nhưng lần khởi động này chưa dùng, vì server đã có sẵn dữ liệu (để không ghi đè lên chỉnh sửa của bạn).</>
                  ) : (
                    <>Chưa thấy file sao lưu trong GitHub. Hãy upload file sao lưu (tên bắt đầu bằng "sao-luu-du-lieu-chatbot-" hoặc đặt tên <strong>seed-backup.json</strong>) vào thư mục gốc của repo để server tự nạp lại mỗi lần khởi động.</>
                  )}
                </div>
              )}
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <button type="button" onClick={downloadBackup} disabled={backingUp} style={{ ...primaryButtonStyle, width: "auto", flex: "1 1 200px", marginTop: 0 }}>
                  {backingUp ? "Đang chuẩn bị file (kèm ảnh)..." : "Tải file sao lưu"}
                </button>
                <input ref={backupInputRef} type="file" accept=".json" onChange={restoreBackup} style={{ display: "none" }} />
                <button type="button" onClick={() => backupInputRef.current && backupInputRef.current.click()} disabled={restoringBackup} style={{ ...outlineButton, height: "auto", padding: "10px 16px", flex: "1 1 200px" }}>
                  {restoringBackup ? "Đang khôi phục..." : "Khôi phục từ file sao lưu"}
                </button>
              </div>
              {backupResult && (
                <div style={{ marginTop: 10, fontSize: 12.5, fontWeight: 600, color: backupResult.ok ? "#3D7A4E" : "#B3261E" }}>
                  {backupResult.ok ? "" : ""}{backupResult.message}
                </div>
              )}
            </div>
            <div style={card}>
              <div style={sectionTitle}>Câu hỏi đã gửi chuyên gia ({escalations.length})</div>
              {escalations.length === 0 ? (
                <div style={{ fontSize: 13, color: "#718096", fontStyle: "italic" }}>Chưa có câu hỏi nào.</div>
              ) : (
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {escalations.map((t) => (
                    <div key={t.id} style={{ background: "#eef4fb", borderRadius: 10, padding: "10px 12px" }}>
                      <div style={{ fontSize: 13.5, fontWeight: 600 }}>{t.question}</div>
                      <div style={{ fontSize: 11, color: "#718096", marginTop: 2 }}>{new Date(t.timestamp).toLocaleString("vi-VN")} · Kênh: {t.sentVia}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div style={card}>
              <div style={sectionTitle}>Mã quản trị</div>
              <div style={{ fontSize: 12.5, color: "#5b6b7e", marginBottom: 6 }}>
                Cần để sửa tài liệu / cài đặt (nếu server có bật ADMIN_TOKEN). Mỗi trình duyệt nhập 1 lần.
              </div>
              <input style={inputStyle} type="password" placeholder="Nhập mã quản trị nếu có" value={adminToken} onChange={(e) => saveAdminToken(e.target.value)} />
            </div>
            </div>
          )}
        </main>
      </div>

      {(addOpen || editingId) && (
        <div className="modal open" id="questionModal">
          <section className="dialog wide">
            <header className="dialog-head"><h2 id="questionDialogTitle">{editingId ? "Sửa câu hỏi" : "Thêm câu hỏi"}</h2><button type="button" className="close" aria-label="Đóng" onClick={() => (editingId ? cancelEdit() : closeAdd())}>×</button></header>
            <div className="dialog-body">{renderQuestionFormFields(!!editingId)}</div>
            <footer className="dialog-foot">
              <button type="button" className="btn secondary" onClick={() => (editingId ? cancelEdit() : closeAdd())}>Hủy</button>
              <button type="button" id="saveQuestion" className="btn" disabled={uploadingImage} onClick={editingId ? saveEditEntry : addEntry}>{uploadingImage ? "Đang tải ảnh..." : "Lưu"}</button>
            </footer>
          </section>
        </div>
      )}

      {detailEntry && (
        <div className="modal open" id="detailModal">
          <section className="dialog wide">
            <header className="dialog-head"><h2>Chi tiết câu hỏi</h2><button type="button" className="close" aria-label="Đóng" onClick={() => setDetailId(null)}>×</button></header>
            <div className="dialog-body">
              <div className="form-grid">
                <div className="field wide"><span>Câu hỏi chuẩn</span><div style={{ fontSize: 16, fontWeight: 700 }}>{detailEntry.title}</div><div><span className="tag">{getCategoryLabel(detailEntry.category)}</span> {detailEntry.visible === false && <span className="status-badge ignored">Đang ẩn</span>} {detailEntry.visible !== false && detailEntry.suggested === true && <span className="status-badge ai">Câu hỏi gợi ý</span>}</div></div>
                {Array.isArray(detailEntry.aliases) && detailEntry.aliases.length > 0 && (
                  <div className="field wide"><span>Cách hỏi khác ({detailEntry.aliases.length})</span><div className="chips">{detailEntry.aliases.map((a, i) => <span key={i}>{a}</span>)}</div></div>
                )}
                <div className="field wide"><span>Câu trả lời</span><div className="answer-box">{renderFormattedBlock(detailEntry.content, "detail-" + detailEntry.id, setLightboxSrc)}</div></div>
                {detailEntry.videoUrl && <div className="field wide"><span>Link video</span><a href={detailEntry.videoUrl} target="_blank" rel="noreferrer" style={{ color: "#076ab7", fontWeight: 600 }}>{detailEntry.videoUrl} ↗</a></div>}
                {getGalleryImages(detailEntry).length > 0 && (
                  <div className="field wide"><span>Ảnh đính kèm ({getGalleryImages(detailEntry).length})</span><div className="thumb-grid">{getGalleryImages(detailEntry).map((url, i) => <SafeImage key={i} src={url} alt={detailEntry.title} onClick={() => setLightboxSrc(url)} style={{ maxWidth: 220, maxHeight: 150, borderRadius: 6, border: "1px solid #dce4ed", cursor: "zoom-in" }} />)}</div></div>
                )}
              </div>
            </div>
            <footer className="dialog-foot">
              <button type="button" className="btn secondary" onClick={() => setDetailId(null)}>Đóng</button>
              {canEditKb && <button type="button" className="btn" data-detail-edit={detailEntry.id} onClick={() => { const e0 = detailEntry; setDetailId(null); startEdit(e0); }}>Sửa</button>}
            </footer>
          </section>
        </div>
      )}

      {importOpen && (
        <div className="modal open" id="importModal">
          <section className="dialog">
            <header className="dialog-head"><h2>Nhập dữ liệu</h2><button type="button" className="close" aria-label="Đóng" onClick={() => setImportOpen(false)}>×</button></header>
            <div className="dialog-body">
              <div className="seg">
                <button type="button" className={importMode === "excel" ? "active" : ""} onClick={() => { setImportMode("excel"); setImportResult(null); }}>⇧ File Excel</button>
                <button type="button" className={importMode === "paste" ? "active" : ""} onClick={() => { setImportMode("paste"); setImportResult(null); }}>Dán từ Excel</button>
              </div>
              {importMode === "excel" ? (
                <>
                  <p className="hint" style={{ marginTop: 0, marginBottom: 12 }}>File Excel có các cột: <strong>Câu hỏi</strong> | <strong>Danh mục</strong> | <strong>Câu trả lời</strong> | <strong>Link video</strong> | <strong>Link ảnh</strong> | <strong>Cách hỏi khác</strong> (nhiều giá trị cách nhau bằng dấu |). Chỉ <strong>thêm mới</strong> vào danh sách hiện có.</p>
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                    <button type="button" className="btn secondary" onClick={downloadTemplate}>Tải file mẫu</button>
                    <input ref={fileInputRef} type="file" accept=".xlsx,.xls" hidden onChange={handleExcelFile} />
                    <button type="button" className="btn" onClick={() => fileInputRef.current && fileInputRef.current.click()}>Chọn file Excel</button>
                  </div>
                  {importResult && importResult.source === "excel" && (
                    <div className={"note-line " + (importResult.error ? "err" : "ok")}>
                      {importResult.error ? "Không đọc được dữ liệu hợp lệ từ file Excel." : `Đã nhập thành công ${importResult.added} mục từ file Excel.${importResult.skipped ? ` Bỏ qua ${importResult.skipped} dòng (trùng câu hỏi đã có trong Sheet hoặc thiếu nội dung).` : ""}`}
                    </div>
                  )}
                </>
              ) : (
                <>
                  <p className="hint" style={{ marginTop: 0, marginBottom: 12 }}>Dán từ Excel: mỗi dòng 1 cặp, cách nhau bởi Tab — <strong>Câu hỏi</strong> [Tab] <strong>Mã danh mục</strong> [Tab] <strong>Câu trả lời</strong> [Tab] <strong>Link video</strong> [Tab] <strong>Link ảnh</strong>. Cột sau tuỳ chọn.</p>
                  <div className="form-grid">
                    <label className="field wide"><span>Danh mục mặc định</span><select value={bulkCategory} onChange={(e) => setBulkCategory(e.target.value)}>{allCategories.map((c) => <option key={c.id} value={c.id}>{c.label}</option>)}</select></label>
                    <label className="field wide"><span>Dán dữ liệu vào đây</span><textarea style={{ minHeight: 150, fontFamily: "monospace", fontSize: 12.5 }} value={bulkText} onChange={(e) => { setBulkText(e.target.value); setImportResult(null); }} /></label>
                  </div>
                  <div style={{ marginTop: 12 }}><button type="button" className="btn" onClick={handleBulkImport}>Nhập vào tài liệu</button></div>
                  {importResult && importResult.source === "paste" && (
                    <div className={"note-line " + (importResult.error ? "err" : "ok")}>
                      {importResult.error ? "Không nhận diện được cặp Câu hỏi - Câu trả lời nào." : `Đã nhập thành công ${importResult.added} mục.${importResult.skipped ? ` Bỏ qua ${importResult.skipped} dòng (trùng câu hỏi đã có trong Sheet hoặc thiếu nội dung).` : ""}`}
                    </div>
                  )}
                </>
              )}
              {adminError && <div className="inline-alert" style={{ marginTop: 12 }}>{adminError}</div>}
            </div>
            <footer className="dialog-foot"><button type="button" className="btn secondary" onClick={() => setImportOpen(false)}>Đóng</button></footer>
          </section>
        </div>
      )}

      {categoryOpen && (
        <div className="modal open" id="categoryModal">
          <section className="dialog" style={{ maxWidth: 500 }}>
            <header className="dialog-head"><h2>Thêm danh mục</h2><button type="button" className="close" aria-label="Đóng" onClick={() => setCategoryOpen(false)}>×</button></header>
            <div className="dialog-body">
              <div className="form-grid">
                <label className="field wide"><span>Tên danh mục *</span><input id="categoryName" placeholder="Ví dụ: KPI & xếp loại" value={categoryName} onChange={(e) => setCategoryName(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") addCustomCategory(); }} /></label>
                {adminError && <div className="field wide"><div className="inline-alert">{adminError}</div></div>}
              </div>
            </div>
            <footer className="dialog-foot">
              <button type="button" className="btn secondary" onClick={() => setCategoryOpen(false)}>Hủy</button>
              <button type="button" id="saveCategory" className="btn" onClick={addCustomCategory}>Lưu</button>
            </footer>
          </section>
        </div>
      )}

      {aliasPicker && (
        <div className="modal open" id="aliasPickerModal">
          <section className="dialog alias-picker-dialog">
            <header className="dialog-head"><h2>Chọn câu hỏi để thêm cách hỏi khác</h2><button type="button" className="close" aria-label="Đóng" onClick={() => setAliasPicker(null)}>×</button></header>
            <div className="dialog-body alias-picker-body">
              <div className="unanswered-note" style={{ margin: 0, borderRadius: 0 }}>Câu hỏi sẽ thêm: <strong>“{aliasPicker.rec.question}”</strong></div>
              <div className="alias-picker-layout">
                <aside className="alias-picker-side">
                  <div className="tree-head"><b>Danh mục câu hỏi</b></div>
                  <div className="tree">
                    <div className={"tree-row all" + (apCat === "ALL" ? " selected" : "")} onClick={() => { setApCat("ALL"); setApPage(1); }}><span>Tất cả danh mục</span><span className="count">{kbEntries.length}</span></div>
                    {allCategories.map((c) => (
                      <div key={c.id} className={"tree-row" + (apCat === c.id ? " selected" : "")} data-alias-category={c.id} onClick={() => { setApCat(c.id); setApPage(1); }}><span>{c.label}</span><span className="count">{catCount(c.id)}</span></div>
                    ))}
                  </div>
                </aside>
                <section className="alias-picker-main">
                  <div className="toolbar"><input id="aliasQuestionSearch" className="search" placeholder="Tìm câu hỏi, cách hỏi khác..." value={apSearch} onChange={(e) => { setApSearch(e.target.value); setApPage(1); }} /></div>
                  <div className="table-wrap">
                    <table className="table">
                      <thead><tr><th>STT</th><th>Câu hỏi chuẩn</th><th>Danh mục</th><th>Cách hỏi khác</th><th>Thao tác</th></tr></thead>
                      <tbody id="aliasQuestionRows">
                        {apRows.length === 0 && <tr><td colSpan="5" className="empty">Không có câu hỏi phù hợp</td></tr>}
                        {apRows.map((e, i) => (
                          <tr key={e.id}>
                            <td>{(apCur - 1) * apSize + i + 1}</td>
                            <td><span className="question">{e.title}</span></td>
                            <td><span className="tag">{getCategoryLabel(e.category)}</span></td>
                            <td>{Array.isArray(e.aliases) ? e.aliases.length : 0}</td>
                            <td><button type="button" className="add-alias-choice" data-choose-alias-question={e.id} onClick={() => chooseAliasTarget(e)}>Thêm</button></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                  <div className="footerbar">
                    <span>Mỗi trang <select className="page-size" value={apSize} onChange={(e) => { setApSize(Number(e.target.value)); setApPage(1); }}><option value="10">10</option><option value="20">20</option><option value="50">50</option></select> trong tổng số <b>{apFiltered.length}</b></span>
                    <span className="pager">{renderPager(apCur, apPages, setApPage)}</span>
                  </div>
                </section>
              </div>
              <div className="alias-picker-note">{sheetReadOnly ? "Chế độ chỉ đọc (Google Sheet): app sẽ sao chép câu hỏi để bạn dán vào cột F của dòng đã chọn." : "Sau khi chọn, hộp thoại sửa câu hỏi sẽ mở với cách hỏi mới đã được thêm sẵn — bấm Lưu để áp dụng."}</div>
            </div>
            <footer className="dialog-foot"><button type="button" className="btn secondary" onClick={() => setAliasPicker(null)}>Hủy</button></footer>
          </section>
        </div>
      )}

      {lightboxSrc && (
        <div
          onClick={() => setLightboxSrc(null)}
          style={{
            position: "fixed", top: 0, left: 0, right: 0, bottom: 0,
            background: "rgba(20, 20, 20, 0.88)", zIndex: 1000,
            display: "flex", alignItems: "center", justifyContent: "center",
            padding: 24, cursor: "zoom-out",
          }}
        >
          <button
            onClick={() => setLightboxSrc(null)}
            style={{
              position: "absolute", top: 18, right: 24, background: "rgba(255,255,255,0.12)", color: "#FFFFFF",
              border: "none", borderRadius: "50%", width: 40, height: 40, fontSize: 20, cursor: "pointer", lineHeight: "40px",
            }}
            aria-label="Đóng"
          >
            ✕
          </button>
          <img
            src={lightboxSrc}
            alt="Ảnh phóng to"
            onClick={(e) => e.stopPropagation()}
            style={{ maxWidth: "90vw", maxHeight: "90vh", borderRadius: 10, boxShadow: "0 10px 40px rgba(0,0,0,0.5)", cursor: "default" }}
          />
        </div>
      )}
      <div id="toast" className={"toast" + (toastMsg ? " show" : "")} role="status">{toastMsg}</div>
    </div>
  );
}

function TabButton({ active, onClick, label }) {
  return <button onClick={onClick} style={{ padding: "8px 14px", borderRadius: 8, border: "none", cursor: "pointer", fontSize: 13, fontWeight: 600, background: active ? "#eef4fb" : "transparent", color: active ? "#076ab7" : "#CBD8DD" }}>{label}</button>;
}
// Ảnh minh hoạ có "tự bảo vệ": nếu load lỗi (VD file đã mất khỏi server sau khi Render deploy lại),
// hiện rõ khung cảnh báo thay vì âm thầm biến mất — để người dùng biết ngay cần tải lại ảnh.
function SafeImage({ src, alt, onClick, style }) {
  const [broken, setBroken] = useState(false);
  if (broken) {
    return (
      <div
        title="Ảnh đã mất trên server, cần tải lại"
        style={{ ...style, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", background: "#FFF3E0", color: "#076ab7", fontSize: 11, textAlign: "center", padding: 6, border: "1px dashed #E0A458", cursor: "default" }}
      >
        <span style={{ fontSize: 16 }}></span>
        <span>Ảnh lỗi — cần tải lại</span>
      </div>
    );
  }
  return <img src={src} alt={alt} onClick={onClick} style={style} onError={() => setBroken(true)} />;
}
function ModeButton({ active, onClick, label }) {
  return <button onClick={onClick} style={{ flex: 1, padding: "8px 10px", borderRadius: 7, border: "none", cursor: "pointer", fontSize: 12.5, fontWeight: 700, background: active ? "#FFFFFF" : "transparent", color: active ? "#076ab7" : "#718096" }}>{label}</button>;
}
function escalateBtn(escalated) {
  return { border: "1px solid #dce4ed", background: escalated ? "#EAF5EC" : "#FFFFFF", color: escalated ? "#3D7A4E" : "#076ab7", borderRadius: 999, padding: "5px 12px", fontSize: 12, fontWeight: 700, cursor: escalated ? "default" : "pointer" };
}

const card = { background: "#FFFFFF", border: "1px solid #dce4ed", borderRadius: 6, padding: 20 };
const sectionTitle = { fontSize: 15, fontWeight: 700, marginBottom: 4 };
const miniLabel = { fontSize: 10.5, fontWeight: 700, color: "#718096", textTransform: "uppercase", letterSpacing: "0.03em" };
const pill = { display: "inline-block", fontSize: 11, color: "#076ab7", background: "#eaf4ff", borderRadius: 999, padding: "2px 8px", margin: "2px 0 8px" };
const labelStyle = { display: "block", fontSize: 12, fontWeight: 600, color: "#5b6b7e", marginBottom: 5, marginTop: 12 };
const inputStyle = { width: "100%", border: "1px solid #cbd7e4", borderRadius: 5, padding: "9px 10px", fontSize: 14, fontFamily: "inherit", marginBottom: 4, background: "#FFFFFF", outline: "none" };
const primaryButtonStyle = { width: "100%", marginTop: 16, background: "#076ab7", color: "#FFFFFF", border: "none", borderRadius: 4, padding: 10, fontSize: 14, fontWeight: 600, cursor: "pointer" };
const darkButton = { whiteSpace: "nowrap", background: "#076ab7", color: "#FFFFFF", border: "1px solid #076ab7", borderRadius: 4, padding: "0 14px", height: 38, fontSize: 13, fontWeight: 600, cursor: "pointer" };
const outlineButton = { whiteSpace: "nowrap", background: "#FFFFFF", color: "#076ab7", border: "1px solid #1677c8", borderRadius: 4, padding: "0 14px", height: 38, fontSize: 13, fontWeight: 600, cursor: "pointer" };
const formatToolbarBtn = { background: "#FFFFFF", color: "#076ab7", border: "1px solid #dce4ed", borderRadius: 6, width: 32, height: 28, fontSize: 13, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", padding: 0 };
const bubbleUser = { maxWidth: "80%", background: "#076ab7", color: "#eef4fb", padding: "10px 14px", borderRadius: 14, borderBottomRightRadius: 4, fontSize: 14, lineHeight: 1.55, whiteSpace: "pre-wrap" };
const bubbleAssistant = { maxWidth: "80%", background: "#eef4fb", color: "#263447", padding: "10px 14px", borderRadius: 14, borderBottomLeftRadius: 4, fontSize: 14, lineHeight: 1.55, whiteSpace: "pre-wrap" };

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
  // Chuyển JSX/ES6 sang JS thuần bằng Babel, ép dùng "classic runtime"
  // (React.createElement) để tránh Babel tự chèn "import" — thứ không
  // chạy được trong thẻ <script> thường (không phải type="module").
  var sourceCode = document.getElementById("app-source").textContent;
  var compiled = Babel.transform(sourceCode, {
    presets: [["react", { runtime: "classic" }]],
  }).code;
  var appScript = document.createElement("script");
  appScript.textContent = compiled;
  document.body.appendChild(appScript);
</script>
</body>
</html>
