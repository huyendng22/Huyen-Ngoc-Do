          <input placeholder="Nhập câu hỏi chuẩn" value={f.title} onChange={(e) => setF((prev) => ({ ...prev, title: e.target.value }))} />
        </label>
        <div className="field wide">
          <div className="alias-head">
            <span>Cách hỏi khác</span>
            <span style={{ display: "inline-flex", gap: 6 }}>
              <button type="button" className="btn secondary alias-add" disabled={suggestingAliases} onClick={() => suggestAliases(f.title, f.content, setF)}>{suggestingAliases ? "AI đang nghĩ..." : "AI gợi ý"}</button>
              <button type="button" className="btn secondary alias-add" onClick={() => setAliasRows([...aliasRows, ""])}>＋ Thêm cách hỏi</button>
            </span>
          </div>
          <div className="alias-list">
            {aliasRows.map((v, i) => (
              <div className="alias-row" key={i}>
                <input value={v} placeholder="Nhập một cách hỏi khác" onChange={(e) => { const r = [...aliasRows]; r[i] = e.target.value; setAliasRows(r); }} />
                <button type="button" className="alias-remove" aria-label="Xóa cách hỏi" onClick={() => { const r = aliasRows.filter((_, k) => k !== i); setAliasRows(r.length ? r : [""]); }}>×</button>
              </div>
            ))}
          </div>
        </div>
        <div className="field wide">
          <span>Câu trả lời *</span>
          <div className="rich-wrap">
            <div className="rich-toolbar" role="toolbar" aria-label="Định dạng câu trả lời">
              <button type="button" style={{ width: "auto", padding: "0 8px" }} title="Tiêu đề phần (đánh dấu dòng hiện tại là 1 mục lớn, bấm lại để bỏ)" onClick={() => toggleHeading(taRef, f.content, setContent)}>Tiêu đề</button>
              <span className="rich-divider" />
              <button type="button" title="In đậm (Ctrl+B)" onClick={() => wrapSelection(taRef, f.content, setContent, "**")}><b>B</b></button>
              <button type="button" title="In nghiêng (Ctrl+I)" onClick={() => wrapSelection(taRef, f.content, setContent, "*")}><i>I</i></button>
              <button type="button" title="Gạch chân (Ctrl+U)" onClick={() => wrapSelection(taRef, f.content, setContent, "__")}><u>U</u></button>
              <span className="rich-divider" />
              <button type="button" title="Danh sách gạch đầu dòng" onClick={() => prefixLines(taRef, f.content, setContent, "dash")}>–</button>
              <button type="button" title="Danh sách chấm tròn" onClick={() => prefixLines(taRef, f.content, setContent, "dot")}>•</button>
              <button type="button" title="Danh sách đánh số" onClick={() => prefixLines(taRef, f.content, setContent, "ol")}>1.</button>
              <span className="rich-divider" />
              <input
                ref={quickRef}
                type="file"
                accept="image/*"
                style={{ display: "none" }}
                onChange={async (e) => {
                  const file = e.target.files && e.target.files[0];
                  e.target.value = "";
                  if (!file) return;
                  const url = await uploadImageFile(file);
                  if (url) insertImageIntoContent(taRef, f.content, setContent, url);
                }}
              />
              <button type="button" title={noUpload ? "Đang ghi vào Google Sheet: không tải ảnh từ máy lên được" : "Chèn ảnh (chọn file, tự tải lên và chèn ngay vào vị trí con trỏ)"} disabled={uploadingImage || noUpload} onClick={() => quickRef.current && quickRef.current.click()}>{uploadingImage ? "" : ""}</button>
            </div>
            <textarea
              ref={taRef}
              className="rich-editor-ta"
              placeholder="Nhập nội dung trả lời (có thể dán ảnh bằng Ctrl+V hoặc kéo-thả file ảnh vào đây)"
              value={f.content}
              onChange={(e) => handleContentChange(e, setContent)}
              onKeyDown={(e) => handleContentKeyDown(e, taRef, f.content, setContent)}
              onPaste={(e) => handleContentPaste(e, taRef, f.content, setContent)}
              onDrop={(e) => handleContentDrop(e, taRef, f.content, setContent)}
            />
          </div>
          <p className="hint">Định dạng: **đậm**, *nghiêng*, __gạch chân__; "- " / "• " / "1. " đầu dòng tạo danh sách; gõ "-&gt;" tự thành →. Link ảnh nằm riêng 1 dòng sẽ hiện thành ảnh đúng vị trí đó.</p>
          {f.content.trim() && (
            <>
              <div className="preview-label">Xem trước (đúng như khi chatbot trả lời):</div>
              <div className="preview-box">{renderFormattedBlock(f.content, isEdit ? "preview-edit" : "preview-add", setLightboxSrc)}</div>
            </>
          )}
        </div>
        <label className="field wide">
          <span>Link video</span>
          <input type="url" placeholder="https://..." value={f.videoUrl} onChange={(e) => setF((prev) => ({ ...prev, videoUrl: e.target.value }))} />
        </label>
        <div className="field wide">
          <div className="attachment-title">Tài liệu đính kèm (ảnh minh hoạ)</div>
          {f.images.length > 0 && (
            <div className="thumb-grid">
              {f.images.map((url, idx) => (
                <div className="thumb" key={idx}>
                  <div className="box">
                    <img src={url} alt={`Ảnh ${idx + 1}`} onClick={() => setLightboxSrc(url)} onError={(ev) => { ev.currentTarget.style.opacity = "0.35"; ev.currentTarget.title = "Ảnh không tải được"; }} />
                    <button type="button" className="x" aria-label="Bỏ ảnh" onClick={() => removeImageAt(setF, idx)}>✕</button>
                  </div>
                  <button type="button" className="ins" title="Chèn ảnh này vào đúng vị trí con trỏ trong Câu trả lời" onClick={() => insertImageIntoContent(taRef, f.content, setContent, url)}>＋ Chèn vào câu trả lời</button>
                </div>
              ))}
            </div>
          )}
          <input ref={imgRef} type="file" accept="image/*" hidden onChange={(e) => handleImageUpload(e, (url) => setF((prev) => ({ ...prev, images: [...prev.images, url] })))} />
          <button type="button" className="attachment-upload" disabled={uploadingImage || noUpload} title={noUpload ? "Đang ghi vào Google Sheet: hãy dán link ảnh https://…" : undefined} onClick={() => imgRef.current && imgRef.current.click()}>
            <IconUploadCloud />{uploadingImage ? "Đang tải..." : "Tải lên"}
          </button>
          <div className="link-row">
            <input placeholder="Hoặc dán link ảnh rồi bấm '+ Thêm'" value={draft} onChange={(e) => setDraft(e.target.value)} />
            <button type="button" className="btn secondary" onClick={() => { addImageUrl(setF, draft); setDraft(""); }}>+ Thêm</button>
          </div>
          <p className="attachment-help">{noUpload ? "Đang ghi dữ liệu vào Google Sheet nên không tải ảnh từ máy lên được (ổ đĩa Render là tạm thời). Hãy dán link ảnh https://… hoặc đưa file ảnh vào thư mục public/uploads trên GitHub rồi ghi /uploads/ten-anh.png." : "Ảnh tải lên được lưu trên server. Trên gói Free của Render ảnh có thể mất khi server khởi động lại — nên dùng link ảnh hoặc đưa file vào public/uploads trên GitHub."}</p>
          {uploadError && <div className="note-line err">{uploadError}</div>}
        </div>
        {adminError && <div className="field wide"><div className="inline-alert">{adminError}</div></div>}
      </div>
    );
  }

  // ===== Dẫn xuất cho giao diện mới =====
  const customNames = [...new Set([...(settings.customCategories || []), ...kbEntries.map((e) => e.category).filter((c) => c && !CATEGORIES.some((b) => b.id === c))])];
  const allCategories = [...CATEGORIES.map((c) => ({ id: c.id, label: c.label })), ...customNames.map((n) => ({ id: n, label: n }))];
  const catCount = (id) => kbEntries.filter((e) => (e.category || "KHAC") === id).length;
  const treeKey = catTreeSearch.trim().toLowerCase();
  const treeRows = allCategories.filter((c) => !treeKey || c.label.toLowerCase().includes(treeKey));
  const libPages = Math.max(1, Math.ceil(filteredEntries.length / libSize));
  const libCur = Math.min(libPage, libPages);
  const libRows = filteredEntries.slice((libCur - 1) * libSize, libCur * libSize);
  const canEditKb = !sheetReadOnly;
  const suggestedEntries = kbEntries.filter((e) => e.visible !== false && e.suggested === true).slice(0, 8);
  // Câu hỏi mở đầu: ưu tiên danh sách đã thiết lập; chưa thiết lập lần nào thì dùng các câu có cờ "gợi ý" (cột H trong Google Sheet)
  const fallbackOpening = suggestedEntries.map((e) => ({ label: "", question: e.title }));
  const openingPills = (Array.isArray(settings.openingQuestions) ? settings.openingQuestions : fallbackOpening).filter((q) => q && String(q.question || "").trim()).slice(0, OQ_MAX);
  const oqList = Array.isArray(settingsForm.openingQuestions) ? settingsForm.openingQuestions : fallbackOpening.slice(0, OQ_MAX);
  const detailEntry = detailId ? kbEntries.find((e) => e.id === detailId) : null;
  const unPages = Math.max(1, Math.ceil(filteredUnanswered.length / unSize));
  const unCur = Math.min(unPage, unPages);
  const unRows = filteredUnanswered.slice((unCur - 1) * unSize, unCur * unSize);
  const allUnSelected = filteredUnanswered.length > 0 && filteredUnanswered.every((u) => selectedUn.has(u.id));
  const greetParts = splitGreeting(settings.greeting || DEFAULT_GREETING);
  const apKey = apSearch.trim().toLowerCase();
  const apFiltered = kbEntries.filter((e) => (apCat === "ALL" || e.category === apCat) && (!apKey || (e.title + " " + (e.aliases || []).join(" ")).toLowerCase().includes(apKey)));
  const apPages = Math.max(1, Math.ceil(apFiltered.length / apSize));
  const apCur = Math.min(apPage, apPages);
  const apRows = apFiltered.slice((apCur - 1) * apSize, apCur * apSize);

  return (
    <div>
      <header className="top">
        <div className="brand">HR<b>Office</b></div>
        <div className="navtop"><span>♧ Quản lý nhân sự</span><span>▥ Đánh giá hiệu suất</span><span>▣ Đánh giá năng lực</span><span>◴ Khảo sát nội bộ</span></div>
        <div className="spacer" />
        <span>🔔</span>
        <div className="profile"><span className="avatar">SA</span><div>Super Admin<br /><small>Quản trị hệ thống</small></div></div>
      </header>
      <div className="shell">
        <main className="main">
          <div className="crumb">AI hỏi đáp / <b>Quản lý Chatbot</b></div>
          <div className="titlebar"><div><h1>Quản lý Chatbot</h1></div></div>
          <div className="tabs" role="tablist">
            {[["kb", "Thư viện câu hỏi"], ["unanswered", "Câu hỏi chưa tìm thấy"], ["conversation", "Cấu hình hội thoại"], ["chat", "Chat thử nghiệm"], ["settings", "Cài đặt hệ thống"]].map(([id, label]) => (
              <button key={id} type="button" className={"tab" + (tab === id ? " active" : "")} data-tab={id} role="tab" onClick={() => { setTab(id); if (id === "unanswered") loadUnanswered(); }}>
                {label}{id === "unanswered" && openUnansweredCount > 0 ? ` (${openUnansweredCount})` : ""}
              </button>
            ))}
          </div>

          {tab === "kb" && (
            <>
              <div className="stack">
                {sheetMode && renderSheetPanel()}
                {renderMissingImagesWarning()}
                {adminError && <div className="inline-alert">{adminError}</div>}
              </div>
              <div className="workspace">
                <aside className="card">
                  <div className="tree-head">
                    <div className="tree-title">
                      <b>Danh mục câu hỏi</b>
                      {canEditKb && <button type="button" id="addCategory" className="add-category-icon" aria-label="Thêm danh mục" title="Thêm danh mục" onClick={() => { setCategoryName(""); setCategoryOpen(true); }}><IconAddCategory /></button>}
                    </div>
                    <input className="search" placeholder="Tìm danh mục..." value={catTreeSearch} onChange={(e) => setCatTreeSearch(e.target.value)} />
                  </div>
                  <div className="tree">
                    <div className={"tree-row all" + (filterCategory === "ALL" ? " selected" : "")} data-tree="ALL" onClick={() => { setFilterCategory("ALL"); setLibPage(1); }}><span>Tất cả danh mục</span><span className="count">{kbEntries.length}</span></div>
                    {treeRows.map((c) => (
                      <div key={c.id} className={"tree-row" + (filterCategory === c.id ? " selected" : "")} data-tree={c.id} onClick={() => { setFilterCategory(c.id); setLibPage(1); }}>
                        <span>{c.label}</span><span className="count">{catCount(c.id)}</span>
                      </div>
                    ))}
                    {treeRows.length === 0 && <div className="empty">Không có danh mục phù hợp</div>}
                  </div>
                </aside>
                <section className="card list-card">
                  <div className="toolbar">
                    <input className="search" placeholder="Tìm câu hỏi, cách hỏi khác..." value={searchQuery} onChange={(e) => { setSearchQuery(e.target.value); setLibPage(1); }} />
                    <button type="button" id="refresh" className="btn secondary icon" title="Làm mới" onClick={() => { setSearchQuery(""); setFilterCategory("ALL"); setCatTreeSearch(""); setLibPage(1); loadKb(); toast("Đã làm mới danh sách"); }}>↻</button>
                    <div className="space" />
                    {canEditKb && <button type="button" id="import" className="btn secondary" onClick={() => { setImportMode("excel"); setImportResult(null); setAdminError(""); setImportOpen(true); }}>⇧ Import Excel</button>}
                    {canEditKb && <button type="button" id="addQuestion" className="btn" onClick={openAdd}>＋ Thêm mới</button>}
                  </div>
                  <div className="table-wrap">
                    <table className="table">
                      <thead><tr><th>STT</th><th>Câu hỏi chuẩn</th><th>Danh mục</th><th>Cách hỏi khác</th><th>Hiển thị</th><th>Thao tác</th></tr></thead>
                      <tbody id="questionRows">
                        {loadingKb && <tr><td colSpan="6" className="empty">Đang tải...</td></tr>}
                        {!loadingKb && libRows.length === 0 && <tr><td colSpan="6" className="empty">Không có câu hỏi phù hợp</td></tr>}
                        {libRows.map((e, i) => {
                          const visible = e.visible !== false;
                          return (
                            <tr key={e.id}>
                              <td>{(libCur - 1) * libSize + i + 1}</td>
                              <td>
                                <span className="question link" role="button" tabIndex={0} onClick={() => setDetailId(e.id)}>{e.title}</span>
                                <span className="subtext">{plainPreview(e.content, 62)}</span>
                              </td>
                              <td><span className="tag">{getCategoryLabel(e.category)}</span></td>
                              <td>{Array.isArray(e.aliases) ? e.aliases.length : 0}</td>
                              <td>
                                <label className={"switch" + (sheetReadOnly ? " disabled" : "")} title={sheetReadOnly ? "Chỉ đọc: đổi trong cột G của Google Sheet" : visible ? "Đang hiển thị" : "Đang ẩn"}>
                                  <input type="checkbox" data-visible={e.id} checked={visible} disabled={sheetReadOnly || flagBusy === e.id + "visible"} onChange={(ev) => toggleFlag(e, "visible", ev.target.checked)} />
                                  <span className="slider" />
                                </label>
                              </td>
                              <td>
                                {canEditKb ? (
                                  <>
                                    <button type="button" className="action-icon" title="Sửa" aria-label="Sửa" data-edit-question={e.id} onClick={() => startEdit(e)}><IconEdit /></button>
                                    <button type="button" className="action-icon" title="Xóa" aria-label="Xóa" data-delete-question={e.id} onClick={() => { if (window.confirm("Xóa câu hỏi này?")) removeEntry(e.id); }}><IconDelete /></button>
                                  </>
                                ) : (
                                  <button type="button" className="btn secondary" style={{ height: 30, padding: "0 10px", fontSize: 12 }} data-view-question={e.id} onClick={() => setDetailId(e.id)}>Xem</button>
                                )}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                  <div className="footerbar">
                    <span>Mỗi trang <select id="libraryPageSize" className="page-size" value={libSize} onChange={(e) => { setLibSize(Number(e.target.value)); setLibPage(1); }}><option value="10">10</option><option value="20">20</option><option value="50">50</option></select> trong tổng số <b id="recordTotal">{filteredEntries.length}</b></span>
                    <span id="libraryPager" className="pager">{renderPager(libCur, libPages, setLibPage)}</span>
                  </div>
                </section>
              </div>
            </>
          )}

          {tab === "unanswered" && (
            <section className="card unanswered-card">
              <div className="unanswered-head">
                <div>
                  <h2>Phản hồi không tìm thấy</h2>
                  <p>Chatbot tự ghi lại mỗi câu hỏi mà tài liệu không có, người dùng thấy chưa đúng ý. Các cách hỏi giống nhau được gộp lại và đếm số lần.</p>
                  {unansweredMeta && (
                    <div className="unanswered-note" style={{ background: unansweredMeta.webhookConfigured ? "#eaf5ec" : "#fff6ec" }}>
                      {unansweredMeta.webhookConfigured
                        ? "Mỗi câu hỏi mới cũng được gửi sang nơi lưu bên ngoài (webhook), nên không mất khi server khởi động lại."
                        : "Chưa cấu hình nơi lưu bền vững (biến UNANSWERED_WEBHOOK_URL). Trên gói Free của Render, danh sách này sẽ mất khi server ngủ hoặc khởi động lại — hãy cấu hình webhook (xem README)."}
                      {" "}Server khởi động lúc {unansweredMeta.startedAt ? new Date(unansweredMeta.startedAt).toLocaleString("vi-VN") : "—"}.
                    </div>
                  )}
                </div>
                <div className="unanswered-head-actions">
                  <label className="select-all-tick" title="Chọn tất cả trong danh sách">
                    <input id="selectAllUnanswered" type="checkbox" checked={allUnSelected} onChange={(e) => setSelectedUn(e.target.checked ? new Set(filteredUnanswered.map((u) => u.id)) : new Set())} /> Chọn tất cả
                  </label>
                  <button type="button" id="deleteSelectedUnanswered" className="btn secondary delete-outline delete-icon-only delete-selected" title="Xóa mục đã chọn" aria-label="Xóa mục đã chọn" disabled={selectedUn.size === 0} onClick={() => deleteUnansweredMany([...selectedUn])}><IconTrash /></button>
                </div>
              </div>
              <div className="status-tabs" role="tablist">
                {[["all", "Tất cả"], ["new", "Chưa xử lý"], ["resolved", "Đã xử lý"], ["ignored", "Bỏ qua"]]
                  .concat(unansweredCounts.attention > 0 ? [["attention", "Cần chú ý"]] : [], unansweredCounts.ai_ok > 0 ? [["ai_ok", "AI trả lời được"]] : [])
                  .map(([id, label]) => (
                    <button key={id} type="button" className={"status-tab" + ((unansweredFilter === id || (unansweredFilter === "open" && id === "new")) ? " active" : "")} data-unanswered-status={id} onClick={() => { setUnansweredFilter(id); setUnPage(1); }}>
                      {label} <span>({unansweredCounts[id]})</span>
                    </button>
                  ))}
              </div>
              {unansweredNote && <div className={"note-line " + (unansweredNote.ok ? "ok" : "err")} style={{ marginTop: 0, marginBottom: 12 }}>{unansweredNote.ok ? "" : ""}{unansweredNote.message}</div>}
              {unansweredError && <div className="inline-alert" style={{ marginBottom: 12 }}>{unansweredError}</div>}
              <div id="unansweredList" className="unanswered-list">
                {!unansweredError && unRows.length === 0 && <div className="empty">{(unansweredFilter === "new" || unansweredFilter === "open") ? "Hiện chưa có câu hỏi nào cần xử lý." : "Không có câu hỏi ở trạng thái này"}</div>}
                {unRows.map((u) => {
                  const others = (u.samples || []).filter((x) => x !== u.question);
                  const badge = u.status === "resolved" ? "handled" : u.status === "ignored" ? "ignored" : needsAttention(u) ? "" : reasonCount(u, "ai_answered") > 0 ? "ai" : "";
                  return (
                    <article className="unanswered-item" key={u.id}>
                      <div className="item-check">
                        <input type="checkbox" aria-label={"Chọn câu hỏi " + u.question} data-select-unanswered={u.id} checked={selectedUn.has(u.id)} onChange={(e) => setSelectedUn((prev) => { const n = new Set(prev); if (e.target.checked) n.add(u.id); else n.delete(u.id); return n; })} />
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div className="unanswered-item-head">
                            <div>
                              <div className="unanswered-question">{u.question}</div>
                              <div className="unanswered-meta">Hỏi {u.count} lần · Gần nhất {new Date(u.lastAt).toLocaleString("vi-VN")}</div>
                            </div>
                            <span className={"status-badge " + badge}>{u.status === "resolved" ? "Đã xử lý" : u.status === "ignored" ? "Đã bỏ qua" : "Chưa xử lý"}</span>
                          </div>
                          <div style={{ marginTop: 10 }}>
                            {Object.keys(UNANSWERED_REASON_LABELS).filter((k) => reasonCount(u, k) > 0).map((k) => (
                              <span key={k} className={"reason-chip" + (k === "ai_unknown" || k === "escalated" ? " warn" : "")}>{UNANSWERED_REASON_LABELS[k]} ×{reasonCount(u, k)}</span>
                            ))}
                          </div>
                          {others.length > 0 && <div className="unanswered-note">Các cách hỏi khác: {others.join(" · ")}</div>}
                          {u.nearTitles && u.nearTitles.length > 0 && <div className="unanswered-note">Đã gợi ý nhưng chưa đúng ý: {u.nearTitles.join(" · ")}</div>}
                          {u.draftAnswer && (
                            <details className="draft-box">
                              <summary>Xem bản nháp do AI soạn (cần kiểm tra trước khi dùng)</summary>
                              <div>{u.draftAnswer}</div>
                            </details>
                          )}
                          {u.note && <div className="unanswered-note">{u.note}</div>}
                          <div className="unanswered-actions">
                            {u.status === "new" ? (
                              <>
                                {sheetReadOnly ? (
                                  <>
                                    <button type="button" className="btn" data-copy-row={u.id} onClick={() => copyRowForSheet(u, false)}>Sao chép để dán vào Sheet</button>
                                    {u.draftAnswer && <button type="button" className="btn secondary" onClick={() => copyRowForSheet(u, true)}>Sao chép kèm bản nháp AI</button>}
                                  </>
                                ) : (
                                  <>
                                    <button type="button" className="btn" data-create-question={u.id} onClick={() => startFromUnanswered(u, false)}>＋ Tạo câu hỏi mới</button>
                                    {u.draftAnswer && <button type="button" className="btn secondary" onClick={() => startFromUnanswered(u, true)}>＋ Tạo kèm bản nháp AI</button>}
                                  </>
                                )}

            <header className="dialog-head"><h2>Thêm danh mục</h2><button type="button" className="close" aria-label="Đóng" onClick={() => setCategoryOpen(false)}>×</button></header>
            <div className="dialog-body">
              <div className="form-grid">
                <label className="field wide"><span>Tên danh mục *</span><input id="categoryName" placeholder="Ví dụ: KPI & xếp loại" value={categoryName} onChange={(e) => setCategoryName(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") addCustomCategory(); }} /></label>
                {adminError && <div className="field wide"><div className="inline-alert">{adminError}</div></div>}
              </div>
            </div>
            <footer className="dialog-foot">
              <button type="button" className="btn secondary" onClick={() => setCategoryOpen(false)}>Hủy</button>
              <button type="button" id="saveCategory" className="btn" onClick={addCustomCategory}>Lưu</button>
            </footer>
          </section>
        </div>
      )}

      {aliasPicker && (
        <div className="modal open" id="aliasPickerModal">
          <section className="dialog alias-picker-dialog">
            <header className="dialog-head"><h2>{aliasPicker.mode === "opening" ? "Chọn câu hỏi làm câu hỏi mở đầu" : "Chọn câu hỏi để thêm cách hỏi khác"}</h2><button type="button" className="close" aria-label="Đóng" onClick={() => setAliasPicker(null)}>×</button></header>
            <div className="dialog-body alias-picker-body">
              {aliasPicker.rec && <div className="unanswered-note" style={{ margin: 0, borderRadius: 0 }}>Câu hỏi sẽ thêm: <strong>“{aliasPicker.rec.question}”</strong></div>}
              <div className="alias-picker-layout">
                <aside className="alias-picker-side">
                  <div className="tree-head"><b>Danh mục câu hỏi</b></div>
                  <div className="tree">
                    <div className={"tree-row all" + (apCat === "ALL" ? " selected" : "")} onClick={() => { setApCat("ALL"); setApPage(1); }}><span>Tất cả danh mục</span><span className="count">{kbEntries.length}</span></div>
                    {allCategories.map((c) => (
                      <div key={c.id} className={"tree-row" + (apCat === c.id ? " selected" : "")} data-alias-category={c.id} onClick={() => { setApCat(c.id); setApPage(1); }}><span>{c.label}</span><span className="count">{catCount(c.id)}</span></div>
                    ))}
                  </div>
                </aside>
                <section className="alias-picker-main">
                  <div className="toolbar"><input id="aliasQuestionSearch" className="search" placeholder="Tìm câu hỏi, cách hỏi khác..." value={apSearch} onChange={(e) => { setApSearch(e.target.value); setApPage(1); }} /></div>
                  <div className="table-wrap">
                    <table className="table">
                      <thead><tr><th>STT</th><th>Câu hỏi chuẩn</th><th>Danh mục</th><th>Cách hỏi khác</th><th>Thao tác</th></tr></thead>
                      <tbody id="aliasQuestionRows">
                        {apRows.length === 0 && <tr><td colSpan="5" className="empty">Không có câu hỏi phù hợp</td></tr>}
                        {apRows.map((e, i) => (
                          <tr key={e.id}>
                            <td>{(apCur - 1) * apSize + i + 1}</td>
                            <td><span className="question">{e.title}</span></td>
                            <td><span className="tag">{getCategoryLabel(e.category)}</span></td>
                            <td>{Array.isArray(e.aliases) ? e.aliases.length : 0}</td>
                            <td><button type="button" className="add-alias-choice" data-choose-alias-question={e.id} onClick={() => chooseAliasTarget(e)}>{aliasPicker.mode === "opening" ? "Chọn" : "Thêm"}</button></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                  <div className="footerbar">
                    <span>Mỗi trang <select className="page-size" value={apSize} onChange={(e) => { setApSize(Number(e.target.value)); setApPage(1); }}><option value="10">10</option><option value="20">20</option><option value="50">50</option></select> trong tổng số <b>{apFiltered.length}</b></span>
                    <span className="pager">{renderPager(apCur, apPages, setApPage)}</span>
                  </div>
                </section>
              </div>
              <div className="alias-picker-note">{aliasPicker.mode === "opening" ? "Câu được chọn sẽ thành một nút câu hỏi mở đầu trong khung chat (nhớ bấm Lưu cấu hình)." : sheetReadOnly ? "Chế độ chỉ đọc (Google Sheet): app sẽ sao chép câu hỏi để bạn dán vào cột F của dòng đã chọn." : "Sau khi chọn, hộp thoại sửa câu hỏi sẽ mở với cách hỏi mới đã được thêm sẵn — bấm Lưu để áp dụng."}</div>
            </div>
            <footer className="dialog-foot"><button type="button" className="btn secondary" onClick={() => setAliasPicker(null)}>Hủy</button></footer>
          </section>
        </div>
      )}

      {lightboxSrc && (
        <div
          onClick={() => setLightboxSrc(null)}
          style={{
            position: "fixed", top: 0, left: 0, right: 0, bottom: 0,
            background: "rgba(20, 20, 20, 0.88)", zIndex: 1000,
            display: "flex", alignItems: "center", justifyContent: "center",
            padding: 24, cursor: "zoom-out",
          }}
        >
          <button
            onClick={() => setLightboxSrc(null)}
            style={{
              position: "absolute", top: 18, right: 24, background: "rgba(255,255,255,0.12)", color: "#FFFFFF",
              border: "none", borderRadius: "50%", width: 40, height: 40, fontSize: 20, cursor: "pointer", lineHeight: "40px",
            }}
            aria-label="Đóng"
          >
            ✕
          </button>
          <img
            src={lightboxSrc}
            alt="Ảnh phóng to"
            onClick={(e) => e.stopPropagation()}
            style={{ maxWidth: "90vw", maxHeight: "90vh", borderRadius: 10, boxShadow: "0 10px 40px rgba(0,0,0,0.5)", cursor: "default" }}
          />
        </div>
      )}
      <div id="toast" className={"toast" + (toastMsg ? " show" : "")} role="status">{toastMsg}</div>
    </div>
  );
}

function TabButton({ active, onClick, label }) {
  return <button onClick={onClick} style={{ padding: "8px 14px", borderRadius: 8, border: "none", cursor: "pointer", fontSize: 13, fontWeight: 600, background: active ? "#eef4fb" : "transparent", color: active ? "#076ab7" : "#CBD8DD" }}>{label}</button>;
}
// Ảnh minh hoạ có "tự bảo vệ": nếu load lỗi (VD file đã mất khỏi server sau khi Render deploy lại),
// hiện rõ khung cảnh báo thay vì âm thầm biến mất — để người dùng biết ngay cần tải lại ảnh.
function SafeImage({ src, alt, onClick, style }) {
  const [broken, setBroken] = useState(false);
  if (broken) {
    return (
      <div
        title="Ảnh đã mất trên server, cần tải lại"
        style={{ ...style, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", background: "#FFF3E0", color: "#076ab7", fontSize: 11, textAlign: "center", padding: 6, border: "1px dashed #E0A458", cursor: "default" }}
      >
        <span style={{ fontSize: 16 }}></span>
        <span>Ảnh lỗi — cần tải lại</span>
      </div>
    );
  }
  return <img src={src} alt={alt} onClick={onClick} style={style} onError={() => setBroken(true)} />;
}
function ModeButton({ active, onClick, label }) {
  return <button onClick={onClick} style={{ flex: 1, padding: "8px 10px", borderRadius: 7, border: "none", cursor: "pointer", fontSize: 12.5, fontWeight: 700, background: active ? "#FFFFFF" : "transparent", color: active ? "#076ab7" : "#718096" }}>{label}</button>;
}
function escalateBtn(escalated) {
  return { border: "1px solid #dce4ed", background: escalated ? "#EAF5EC" : "#FFFFFF", color: escalated ? "#3D7A4E" : "#076ab7", borderRadius: 999, padding: "5px 12px", fontSize: 12, fontWeight: 700, cursor: escalated ? "default" : "pointer" };
}

const card = { background: "#FFFFFF", border: "1px solid #dce4ed", borderRadius: 6, padding: 20 };
const sectionTitle = { fontSize: 15, fontWeight: 700, marginBottom: 4 };
const miniLabel = { fontSize: 10.5, fontWeight: 700, color: "#718096", textTransform: "uppercase", letterSpacing: "0.03em" };
const pill = { display: "inline-block", fontSize: 11, color: "#076ab7", background: "#eaf4ff", borderRadius: 999, padding: "2px 8px", margin: "2px 0 8px" };
const labelStyle = { display: "block", fontSize: 12, fontWeight: 600, color: "#5b6b7e", marginBottom: 5, marginTop: 12 };
const inputStyle = { width: "100%", border: "1px solid #cbd7e4", borderRadius: 5, padding: "9px 10px", fontSize: 14, fontFamily: "inherit", marginBottom: 4, background: "#FFFFFF", outline: "none" };
const primaryButtonStyle = { width: "100%", marginTop: 16, background: "#076ab7", color: "#FFFFFF", border: "none", borderRadius: 4, padding: 10, fontSize: 14, fontWeight: 600, cursor: "pointer" };
const darkButton = { whiteSpace: "nowrap", background: "#076ab7", color: "#FFFFFF", border: "1px solid #076ab7", borderRadius: 4, padding: "0 14px", height: 38, fontSize: 13, fontWeight: 600, cursor: "pointer" };
const outlineButton = { whiteSpace: "nowrap", background: "#FFFFFF", color: "#076ab7", border: "1px solid #1677c8", borderRadius: 4, padding: "0 14px", height: 38, fontSize: 13, fontWeight: 600, cursor: "pointer" };
const formatToolbarBtn = { background: "#FFFFFF", color: "#076ab7", border: "1px solid #dce4ed", borderRadius: 6, width: 32, height: 28, fontSize: 13, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", padding: 0 };
const bubbleUser = { maxWidth: "80%", background: "#076ab7", color: "#eef4fb", padding: "10px 14px", borderRadius: 14, borderBottomRightRadius: 4, fontSize: 14, lineHeight: 1.55, whiteSpace: "pre-wrap" };
const bubbleAssistant = { maxWidth: "80%", background: "#eef4fb", color: "#263447", padding: "10px 14px", borderRadius: 14, borderBottomLeftRadius: 4, fontSize: 14, lineHeight: 1.55, whiteSpace: "pre-wrap" };

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
  // Chuyển JSX/ES6 sang JS thuần bằng Babel, ép dùng "classic runtime"
  // (React.createElement) để tránh Babel tự chèn "import" — thứ không
  // chạy được trong thẻ <script> thường (không phải type="module").
  var sourceCode = document.getElementById("app-source").textContent;
  var compiled = Babel.transform(sourceCode, {
    presets: [["react", { runtime: "classic" }]],
  }).code;
  var appScript = document.createElement("script");
  appScript.textContent = compiled;
  document.body.appendChild(appScript);
</script>
</body>
</html>
