/* ===== Bổ sung cho trang quản trị (ngoài file mẫu) ===== */
.navitem.sub{cursor:pointer}.navitem.sub:hover{background:#eaf4ff;color:var(--blue)}.navitem.sub.active{color:var(--blue);font-weight:700;background:#eaf4ff}
.tabs{overflow-x:auto;scrollbar-width:thin}.tab{white-space:nowrap}
.stack{display:grid;gap:14px;margin-bottom:16px}
.inline-alert{padding:10px 14px;border-radius:5px;background:#fdecea;color:#b3261e;font-size:13px;font-weight:600;line-height:1.5}
.inline-ok{padding:10px 14px;border-radius:5px;background:#eaf5ec;color:#2d6a43;font-size:13px;font-weight:600;line-height:1.5}
.btn:disabled{opacity:.55;cursor:not-allowed}
.question.link{cursor:pointer}.question.link:hover{color:var(--blue);text-decoration:underline}
.tree-row.all{font-weight:700}
.dialog.wide{width:min(780px,100%)}
.rich-editor-ta{display:block;width:100%;min-height:150px;padding:10px;border:0;outline:none;background:#fff;font:inherit;line-height:1.55;resize:vertical;color:var(--ink)}
.rich-toolbar button:disabled{opacity:.4;cursor:not-allowed}
.hint{color:#7a899a;font-size:12px;font-weight:400;line-height:1.5;margin:6px 0 0}
.preview-box{margin-top:8px;border:1px dashed #cbd7e4;border-radius:5px;padding:10px 12px;background:#fbfdff;font-size:13px;line-height:1.55;font-weight:400}
.preview-label{font-size:11.5px;color:#7a899a;font-weight:400;margin-top:8px}
.thumb-grid{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.thumb{display:flex;flex-direction:column;align-items:center;gap:4px}
.thumb .box{position:relative;display:inline-block}
.thumb img{width:90px;height:90px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
.thumb .x{position:absolute;top:2px;right:2px;background:#055594cc;color:#fff;border:0;border-radius:5px;padding:0 5px;font-size:12px;line-height:18px}
.thumb .ins{font-size:11px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:2px 6px;color:var(--blue);white-space:nowrap}
.attachment-upload{border:0;background:transparent;padding:0}.attachment-upload:disabled{opacity:.45;cursor:not-allowed}
.link-row{display:flex;gap:8px;margin-top:8px}.link-row input{flex:1}
.chip{background:#fff;color:var(--blue);border:1px solid #b9d8f2;border-radius:16px;padding:6px 12px;font-size:12.5px;text-align:left}
.chip:hover{background:#eaf4ff}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{background:#eef4fb;border-radius:12px;padding:3px 9px;font-size:12.5px;font-weight:400}
.answer-box{border:1px solid var(--line);border-radius:5px;padding:12px;background:#fbfdff;font-weight:400;line-height:1.55}
.reason-chip{display:inline-block;margin:0 6px 6px 0;padding:3px 8px;border-radius:12px;font-size:12px;background:#fff0db;color:#ad6912;font-weight:600}
.reason-chip.warn{background:#fdecea;color:#b3261e}
.draft-box{margin-top:10px}.draft-box summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--blue)}
.draft-box div{margin-top:6px;white-space:pre-wrap;font-size:12.5px;line-height:1.55;background:#f7f9fb;border:1px solid var(--line);border-radius:5px;padding:8px 10px;color:#4a5b6e}
.settings-stack{display:grid;gap:18px;max-width:860px}
.seg{display:inline-flex;gap:4px;background:#eef4fb;border-radius:6px;padding:3px;margin-bottom:14px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:5px;font-weight:600;color:#5b6b7e}.seg button.active{background:#fff;color:var(--blue);box-shadow:0 1px 2px #0002}
.chat-wrap{max-width:760px}
.note-line{font-size:13px;font-weight:600;margin-top:10px}.note-line.ok{color:#2d6a43}.note-line.err{color:#b3261e}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
/* cột Thao tác: 2 biểu tượng nằm ngang, không xuống dòng */
.table th:last-child,.table td:last-child{white-space:nowrap}
.table td .action-icon{display:inline-block}
.table{min-width:780px}
.unanswered-note b,.unanswered-note strong{font-weight:700}
/* hộp thoại chọn câu hỏi: cho phép cuộn để thấy cả phân trang khi danh sách dài */
.alias-picker-body{overflow-y:auto}
/* điện thoại: cột lưới được phép co lại (nếu không bảng rộng sẽ làm tràn cả trang) */
@media(max-width:740px){.workspace,.settings-layout{grid-template-columns:minmax(0,1fr)}.shell{display:block}.main{min-width:0;max-width:100vw}.table-wrap{max-width:100%}}

/* ===== Chat thử nghiệm: khung chat theo mẫu (index_1.html) ===== */
.chat-hint{max-width:440px;margin:0 auto 12px;color:#718096;font-size:12.5px;line-height:1.55;text-align:center}
.chat-panel{width:min(440px,100%);margin:0 auto;height:min(640px,calc(100vh - 350px));min-height:460px;background:#fff;border:1px solid #e0e6ee;border-radius:6px;box-shadow:0 4px 24px #173d631c;display:flex;flex-direction:column;overflow:hidden}
.chat-panel .phead{height:54px;padding:0 16px;border-bottom:1px solid #e4e9ef;display:flex;align-items:center;justify-content:space-between;color:#506174;flex:0 0 auto}
.chat-panel .pbody{padding:29px 20px 15px;flex:1;overflow:auto;text-align:center}
.chat-panel .pbody h2{font-size:24px;color:#397ce6;line-height:1.4;margin:0 0 10px}
.chat-panel .pbody>p{color:#858f9b;line-height:1.55;margin:0 0 20px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}
.quick button{padding:9px 12px;background:#fff;border:1px solid #e0e6ed;border-radius:18px;color:#566372;font-size:12px;font-weight:700;line-height:1.4;text-align:left}.quick button span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.quick button:hover{border-color:#3489e7;color:#1676d3}
.messages{text-align:left;margin:16px 0}
.msg{font-size:13px;padding:10px 12px;border-radius:10px 10px 2px 10px;background:#eaf3ff;margin:8px 0 8px auto;width:max-content;max-width:88%;line-height:1.5;word-break:break-word}
.msg.bot{margin-left:0;margin-right:auto;border-radius:10px 10px 10px 2px;background:#f0f2f5}
.msg-caption{font-size:10.5px;font-weight:700;color:#3d7a4e;text-transform:uppercase;letter-spacing:.03em;margin:10px 0 2px}.msg-caption.ai{color:#0869b6}
.msg-link{background:transparent;border:0;color:#718096;font-size:11.5px;text-decoration:underline;padding:0;margin:2px 0 6px}
.msg-error{font-size:11.5px;color:#b3261e;margin:2px 0 6px}
.answer-options{display:grid;gap:8px;margin:10px 0 14px}
.answer-options button{width:100%;padding:10px 12px;border:1px solid #cbddec;border-radius:8px;background:#fff;color:#216dae;text-align:left;font-size:13px;line-height:1.4}
.answer-options button:hover:not(:disabled){border-color:#0b7fe6;background:#f2f8ff}
.answer-options button.selected{border-color:#0b7fe6;background:#eaf4ff;color:#075f9e}
.answer-options button:disabled{opacity:.7;cursor:not-allowed}
.answer-options .expert{margin-top:3px;border-color:#f1c565;background:#fffaf0;color:#9a6200;text-align:center;font-weight:700}
.chat-panel .composer{height:68px;padding:13px 14px;border-top:1px solid #e5e9ee;display:flex;gap:8px;flex:0 0 auto}
.chat-panel .composer input{border:0;outline:0;flex:1;color:#536273;min-width:0;background:transparent;font-size:14px}
.chat-panel .send{border:0;border-radius:50%;width:39px;height:39px;background:#3d84e7;color:#fff;font-size:18px;flex:0 0 auto}.chat-panel .send:disabled{opacity:.55;cursor:not-allowed}
@media(max-width:740px){.chat-panel{height:calc(100vh - 230px)}.quick{grid-template-columns:1fr}}

/* tab Câu hỏi chưa tìm thấy: 'Chọn tất cả' và thùng rác luôn nằm cùng 1 hàng */
.unanswered-head-actions{flex-wrap:nowrap;flex:0 0 auto}.unanswered-head>div:first-child{flex:1;min-width:0}
@media(max-width:740px){.unanswered-head-actions{flex-wrap:wrap}}

/* Thiết lập câu hỏi mở đầu */
.oq-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) 38px;gap:8px;margin-bottom:8px;align-items:center}
@media(max-width:740px){.oq-row{grid-template-columns:minmax(0,1fr) 34px}.oq-row .oq-question{grid-column:1 / 2;grid-row:2}.oq-row .alias-remove{grid-row:1 / 3;grid-column:2}}
.oq-row .alias-remove{width:38px;min-width:0;padding:0;justify-self:end}

/* ===== Chạy toàn màn hình: mọi tab dùng hết chiều ngang (không còn giới hạn 780-980px) ===== */
.unanswered-card,.conversation-card{max-width:none;width:100%}
.unanswered-head p{max-width:900px}
.conversation-form{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 32px}
.conversation-form .field{min-width:0}
.conversation-form #openingSetup,.conversation-form .inline-alert{grid-column:1 / -1}
.expert-contact{max-width:none}.expert-contact input{max-width:460px}
.settings-stack{max-width:none;width:100%;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));align-items:start;gap:18px}
.chat-wrap{max-width:none}
@media(max-width:1100px){.conversation-form{grid-template-columns:minmax(0,1fr)}}
@media(max-width:740px){.settings-stack{grid-template-columns:minmax(0,1fr)}}

.demo-frame{--blue:#0869b6;--blue2:#087cdb;--bg:#f3f6fc;--text:#273445;--muted:#697789;--line:#d9e1eb;--red:#ed5961;position:relative;width:100%;height:clamp(520px,calc(100vh - 170px),1200px);overflow:hidden;border:1px solid #cfd9e5;border-radius:8px;background:#f4f6fa;color:#273445;font:14px Arial,sans-serif;box-shadow:0 4px 18px #173d6314}
.demo-frame *{box-sizing:border-box}
.demo-frame button,.demo-frame input,.demo-frame select{font:inherit}
.demo-frame .demo-shot{display:block;width:100%;height:100%;object-fit:cover;object-position:left top;user-select:none;-webkit-user-drag:none}
.demo-frame .d-chat-fab{position:absolute;z-index:20;right:26px;bottom:26px;width:65px;height:65px;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;display:grid;place-items:center;touch-action:none;overflow:visible;cursor:pointer}
.demo-frame .d-chat-fab img{width:65px;height:65px;object-fit:contain;pointer-events:none;filter:drop-shadow(0 3px 4px #164a7d3d)}
.demo-frame .d-chat-fab picture{display:contents}
.demo-frame .d-tip{position:absolute;right:73px;white-space:nowrap;background:#263442;color:#fff;border-radius:5px;padding:8px 10px;font-size:12px;opacity:0;transition:.2s;pointer-events:none}
.demo-frame .d-chat-fab:hover .d-tip{opacity:1}
.demo-frame .d-chat-fab.dragging{cursor:grabbing}
.demo-frame .chat-panel.popup{position:absolute;z-index:19;right:20px;bottom:100px;width:min(400px,calc(100% - 40px));height:min(580px,calc(100% - 124px));min-height:0;margin:0;border-radius:12px;box-shadow:0 10px 36px #173d6338;opacity:0;visibility:hidden;transform:translateY(14px) scale(.98);transform-origin:bottom right;transition:opacity .2s,transform .2s,visibility 0s .2s}
.demo-frame .chat-panel.popup.open{opacity:1;visibility:visible;transform:none;transition:opacity .2s,transform .2s}
.chat-panel .phead .pclose{border:0;background:none;font-size:26px;line-height:1;color:#8290a0;padding:0 2px}.chat-panel .phead .pclose:hover{color:#506174}
@media(max-width:740px){.demo-frame{height:600px}.demo-frame .chat-panel.popup{right:10px;width:calc(100% - 20px)}}

.demo-bar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 0 10px;color:#718096;font-size:12.5px;line-height:1.5}
.demo-bar .btn{flex:0 0 auto;height:34px;padding:0 14px}
.demo-frame.full{position:fixed;inset:0;z-index:1000;width:100vw;height:100vh;border:0;border-radius:0;box-shadow:none}
.demo-exit{position:absolute;left:16px;bottom:16px;z-index:30;height:34px;padding:0 14px;border:1px solid #1677c8;border-radius:4px;background:#fff;color:#076ab7;font-weight:700;box-shadow:0 2px 8px #173d6326}

</style>
</head>

<script type="text/plain" id="app-source">
const { useState, useEffect, useRef, useMemo } = React;

const CATEGORIES = [
  { id: "HD", label: "Hướng dẫn thao tác" },
  { id: "LOI", label: "Lỗi thường gặp" },
  { id: "CS", label: "Chính sách / Quy trình" },
  { id: "335", label: "335" },
  { id: "KHAC", label: "Khác" },
];
function getCategoryLabel(id) {
  const found = CATEGORIES.find((c) => c.id === id);
  return found ? found.label : id;
}
const EMPTY_FORM = { title: "", category: CATEGORIES[0].id, content: "", videoUrl: "", images: [], aliasesText: "" };

// Đọc TOÀN BỘ ảnh của 1 mục, gộp cả kiểu dữ liệu cũ (imageUrl/imageUrl2 - tối đa 2 ảnh, các bản
// trước đây) lẫn kiểu mới (images - mảng không giới hạn số lượng), không trùng lặp.
function getEntryImages(entry) {
  if (!entry) return [];
  const legacy = [entry.imageUrl, entry.imageUrl2].filter(Boolean);
  const modern = Array.isArray(entry.images) ? entry.images.filter(Boolean) : [];
  const seen = new Set();
  const result = [];
  [...legacy, ...modern].forEach((u) => {
    if (!seen.has(u)) {
      seen.add(u);
      result.push(u);
    }
  });
  return result;
}

// Dùng khi HIỂN THỊ câu trả lời: chỉ lấy những ảnh CHƯA được chèn thẳng vào nội dung (content),
// để tránh hiện trùng 2 lần (1 lần chèn giữa văn bản + 1 lần lặp lại ở khung "Hình ảnh minh hoạ" cuối).
// Khi QUẢN LÝ (form thêm/sửa) vẫn dùng getEntryImages đầy đủ để không mất ảnh nào khỏi tầm kiểm soát.
function getGalleryImages(entry) {
  const all = getEntryImages(entry);
  const content = String((entry && entry.content) || "");
  return all.filter((u) => !content.includes(u));
}

// ===== Định dạng văn bản đơn giản: **đậm**, *nghiêng*, __gạch chân__, gạch đầu dòng (- hoặc •), số thứ tự (1. 2. ...) =====
// Không dùng thư viện ngoài, chỉ ghép thành React element trực tiếp (an toàn, không chèn HTML thô).
function parseInlineFormatting(str, keyPrefix, onImageClick) {
  const nodes = [];
  // "->" luôn được hiện thành mũi tên "→" (phòng trường hợp dữ liệu không đi qua textarea có
  // tự động thay, VD nhập từ Excel, AI tự trả lời...).
  let remaining = String(str || "").replace(/->/g, "→");
  const regex = /(\*\*(.+?)\*\*)|(__(.+?)__)|(\*(.+?)\*)|(https?:\/\/[^\s]+)/;
  let key = 0;
  while (remaining) {
    const m = regex.exec(remaining);
    if (!m) {
      nodes.push(remaining);
      break;
    }
    if (m.index > 0) nodes.push(remaining.slice(0, m.index));
    if (m[2] !== undefined) nodes.push(<strong key={`${keyPrefix}-b${key++}`}>{m[2]}</strong>);
    else if (m[4] !== undefined) nodes.push(<u key={`${keyPrefix}-u${key++}`}>{m[4]}</u>);
    else if (m[6] !== undefined) nodes.push(<em key={`${keyPrefix}-i${key++}`}>{m[6]}</em>);
    else if (m[7] !== undefined) {
      const url = m[7];
      if (isImageUrl(url)) {
        nodes.push(
          <SafeImage
            key={`${keyPrefix}-img${key++}`}
            src={url}
            alt="Hình minh hoạ"
            onClick={onImageClick ? () => onImageClick(url) : undefined}
            style={{ maxWidth: "100%", maxHeight: 220, borderRadius: 8, display: "block", margin: "6px 0", cursor: onImageClick ? "zoom-in" : "default" }}
          />
        );
      } else {
        nodes.push(
          <a key={`${keyPrefix}-a${key++}`} href={url} target="_blank" rel="noreferrer" style={{ color: "inherit", textDecoration: "underline", wordBreak: "break-all" }}>
            {url}
          </a>
        );
      }
    }
    remaining = remaining.slice(m.index + m[0].length);
  }
  return nodes;
}

function isImageUrl(url) {
  return /\.(png|jpe?g|gif|webp)(\?.*)?$/i.test(url);
}

// Nhận 1 đoạn text thuần (có thể nhiều dòng), trả về mảng React node đã dựng sẵn bullet/số thứ tự/đậm/nghiêng/gạch chân.
// Phân biệt rõ 3 kiểu danh sách: "- " = gạch đầu dòng, "• " = chấm tròn, "1. "/"1) " = số thứ tự.
// Nếu 1 dòng CHỈ CHỨA đúng 1 link (không có chữ nào khác) -> hiện thẳng thành ảnh/link ngay tại
// đúng vị trí dòng đó, để trả lời quy trình nhiều bước có thể chèn ảnh minh hoạ xen kẽ từng bước.
function renderFormattedBlock(text, keyPrefix, onImageClick) {
  const lines = String(text || "").split("\n");
  const blocks = [];
  let currentList = null; // { type: "dash" | "dot" | "ol", items: [] }

  function flushList() {
    if (currentList) {
      blocks.push(currentList);
      currentList = null;
    }
  }

  lines.forEach((line) => {
    const headingMatch = line.match(/^##\s+(.*)$/);
    const bareUrlMatch = line.trim().match(/^(https?:\/\/\S+)$/);
    const dashMatch = line.match(/^\s*-\s+(.*)$/);
    const dotMatch = line.match(/^\s*[•*]\s+(.*)$/);
    const numberedMatch = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (headingMatch) {
      flushList();
      blocks.push({ type: "heading", text: headingMatch[1] });
    } else if (bareUrlMatch) {
      const url = bareUrlMatch[1];
      if (isImageUrl(url)) {
        // Nhiều dòng ảnh liền kề nhau (không bị chữ/danh sách/dòng trống xen giữa) -> gộp vào
        // cùng 1 "hàng ảnh" để hiển thị dạng album nhỏ cạnh nhau, thay vì xếp chồng dọc từng ảnh to.
        // QUAN TRỌNG: phải "chốt" (flush) danh sách đang dang dở TRƯỚC khi so sánh với block cuối
        // cùng — nếu không, 1 danh sách chưa kịp đưa vào blocks sẽ khiến ảnh "nhìn xuyên qua" nó
        // và gộp nhầm với hàng ảnh trước đó dù có chữ xen giữa.
        const hadPendingList = !!currentList;
        flushList();
        const lastBlock = blocks[blocks.length - 1];
        if (!hadPendingList && lastBlock && lastBlock.type === "imageRow") {
          lastBlock.urls.push(url);
        } else {
          blocks.push({ type: "imageRow", urls: [url] });
        }
      } else {
        flushList();
        blocks.push({ type: "url", url });
      }
    } else if (dashMatch) {
      if (!currentList || currentList.type !== "dash") { flushList(); currentList = { type: "dash", items: [] }; }
      currentList.items.push(dashMatch[1]);
    } else if (dotMatch) {
      if (!currentList || currentList.type !== "dot") { flushList(); currentList = { type: "dot", items: [] }; }
      currentList.items.push(dotMatch[1]);
    } else if (numberedMatch) {
      if (!currentList || currentList.type !== "ol") { flushList(); currentList = { type: "ol", items: [] }; }
      currentList.items.push(numberedMatch[1]);
    } else {
      flushList();
      blocks.push({ type: "line", text: line });
    }
  });
  flushList();

  let numberedRunningCount = 0; // đánh số liên tục xuyên suốt dù danh sách bị chen giữa bởi ảnh/chữ khác
  return blocks.map((b, i) => {
    const k = `${keyPrefix}-blk${i}`;
    if (b.type === "heading") {
      return (
        <div key={k} style={{ fontSize: 15, fontWeight: 700, margin: "14px 0 6px", paddingBottom: 5, borderBottom: "1px solid #dce4ed" }}>
          {parseInlineFormatting(b.text, k, onImageClick)}
        </div>
      );
    }
    if (b.type === "imageRow") {
      const single = b.urls.length === 1;
      return (
        <div key={k} style={{ display: "flex", flexWrap: "wrap", gap: 8, margin: "8px 0" }}>
          {b.urls.map((url, ui) => (
            <SafeImage
              key={`${k}-${ui}`}
              src={url}
              alt="Hình minh hoạ"
              onClick={onImageClick ? () => onImageClick(url) : undefined}
              style={
                single
                  ? { maxWidth: "100%", maxHeight: 260, borderRadius: 8, cursor: onImageClick ? "zoom-in" : "default" }
                  : { width: 180, height: 180, objectFit: "cover", borderRadius: 8, cursor: onImageClick ? "zoom-in" : "default", flex: "0 0 auto" }
              }
            />
          ))}
        </div>
      );
    }
    if (b.type === "url") {
      return (
        <div key={k} style={{ margin: "4px 0" }}>
          <a href={b.url} target="_blank" rel="noreferrer" style={{ color: "inherit", textDecoration: "underline", wordBreak: "break-all" }}>{b.url}</a>
        </div>
      );
    }
    if (b.type === "dash") {
      return (
        <ul key={k} style={{ margin: "4px 0", paddingLeft: 22, listStyleType: "none" }}>
          {b.items.map((it, j) => <li key={`${k}-${j}`} style={{ marginBottom: 2 }}>– {parseInlineFormatting(it, `${k}-${j}`, onImageClick)}</li>)}
        </ul>
      );
    }
    if (b.type === "dot") {
      return (
        <ul key={k} style={{ margin: "4px 0", paddingLeft: 22, listStyleType: "disc" }}>
          {b.items.map((it, j) => <li key={`${k}-${j}`} style={{ marginBottom: 2 }}>{parseInlineFormatting(it, `${k}-${j}`, onImageClick)}</li>)}
        </ul>
      );
    }
    if (b.type === "ol") {
      const startAt = numberedRunningCount + 1;
      numberedRunningCount += b.items.length;
      return (
        <ol key={k} start={startAt} style={{ margin: "4px 0", paddingLeft: 22 }}>
          {b.items.map((it, j) => <li key={`${k}-${j}`} style={{ marginBottom: 2 }}>{parseInlineFormatting(it, `${k}-${j}`, onImageClick)}</li>)}
        </ol>
      );
    }
    if (b.text.trim() === "") return <div key={k} style={{ height: 8 }} />;
    return <div key={k}>{parseInlineFormatting(b.text, k, onImageClick)}</div>;
  });
}
function resolveCategoryId(raw, defaultId) {

  return text;

// ===== Tìm kiếm cục bộ theo từ khoá (không dùng AI) =====
// So khớp ký tự thô (kiểu Fuse.js) không hợp với tiếng Việt vì câu hỏi diễn
// đạt lại khác chút là bị lệch điểm rất nhiều. Cách này bỏ dấu, bỏ từ đệm rồi
// so khớp theo từ (có trọng số TF-IDF + cụm từ), ổn định hơn nhiều cho câu hỏi tiếng Việt viết tự do.
const VN_STOPWORDS = new Set([
  "la","cua","va","cac","nhung","co","duoc","the","nao","cho","de","khi","toi","ban","minh",
  "lam","sao","gi","nhu","nay","do","mot","voi","ve","tai","hay","hoac","da","se","phai","can",
  "muon","xin","vay","oi","nhe","trong","o","ra","vao","den","neu","thi","ma","hon",
  "nhat","nen","bi","bang","theo",
  // Lưu ý: KHÔNG bỏ "tu" — vì bỏ dấu thì cả "từ" (giới từ, ít nghĩa) và "tự" (tự thân, RẤT
  // nhiều nghĩa — "tự đánh giá", "tự động"...) đều trùng thành "tu". Bỏ chung sẽ mất tín hiệu
  // quan trọng của "tự"; để TF-IDF tự động hạ trọng số "tu" khi nó xuất hiện ở hầu hết các mục.
]);
function normalizeVN(str) {
  return String(str || "")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/đ/g, "d")
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}
function tokenizeVN(str) {
  return normalizeVN(str).split(" ").filter((w) => w && w.length > 1 && !VN_STOPWORDS.has(w));
}
function bigramsOfTokens(tokens) {
  const out = [];
  for (let i = 0; i < tokens.length - 1; i++) out.push(tokens[i] + "_" + tokens[i + 1]);
  return out;
}
// Xây "chỉ mục" 1 lần cho toàn bộ KB: tần suất xuất hiện của từng từ (để tính TF-IDF —
// từ càng hiếm/đặc trưng thì càng có trọng số cao, từ càng phổ biến (VD "nhiệm vụ" xuất
// hiện ở gần như mọi mục) thì càng ít có giá trị phân biệt, trọng số càng thấp.
function buildKbIndex(entries) {
  const df = new Map();
  const indexed = entries.map((e) => {
    const titleTokens = tokenizeVN(e.title);
    // "aliases" = các cách hỏi khác cho cùng 1 câu trả lời (VD: "quên mật khẩu" là alias của
    // "Làm sao để đặt lại mật khẩu?"). Coi ngang hàng với tiêu đề khi tìm kiếm — cùng trọng số.
    const aliasList = Array.isArray(e.aliases) ? e.aliases : [];
    const aliasTokenLists = aliasList.map((a) => tokenizeVN(a));
    const allTitleTokens = [...titleTokens, ...aliasTokenLists.flat()];
    const contentTokens = tokenizeVN(e.content);
    const all = new Set([...allTitleTokens, ...contentTokens]);
    all.forEach((t) => df.set(t, (df.get(t) || 0) + 1));
    const allBigrams = [...bigramsOfTokens(titleTokens), ...aliasTokenLists.flatMap((toks) => bigramsOfTokens(toks))];
    return {
      entry: e,
      titleTokenSet: new Set(allTitleTokens),
      contentTokenSet: new Set(contentTokens),
      titleBigramSet: new Set(allBigrams),
    };
  });
  return { df, indexed, N: entries.length };
}
function idfOf(token, df, N) {
  const d = df.get(token) || 0;
  return Math.log((N + 1) / (d + 1)) + 1; // luôn dương; từ càng hiếm càng cao
}
function scoreKbEntryTfidf(queryTokens, queryBigrams, idxEntry, df, N) {
  if (queryTokens.length === 0) return 0;
  let weightedScore = 0;
  let maxPossible = 0;
  queryTokens.forEach((t) => {
    const w = idfOf(t, df, N);
    maxPossible += w;
    if (idxEntry.titleTokenSet.has(t)) weightedScore += w * 1.0;
    else if (idxEntry.contentTokenSet.has(t)) weightedScore += w * 0.35;
  });
  const baseRatio = maxPossible > 0 ? weightedScore / maxPossible : 0;

  let bigramHits = 0;
  queryBigrams.forEach((bg) => { if (idxEntry.titleBigramSet.has(bg)) bigramHits += 1; });
  const bigramRatio = queryBigrams.length > 0 ? bigramHits / queryBigrams.length : 0;

  return baseRatio * 0.7 + bigramRatio * 0.3;
}

function pageWindow(cur, pages) {
  if (pages <= 9) return Array.from({ length: pages }, (_, i) => i + 1);
  const set = new Set([1, 2, pages - 1, pages, cur - 1, cur, cur + 1]);
  const arr = [...set].filter((n) => n >= 1 && n <= pages).sort((a, b) => a - b);
  const out = [];
  arr.forEach((n, i) => { if (i && n - arr[i - 1] > 1) out.push("…"); out.push(n); });
  return out;
}
function renderPager(cur, pages, onChange) {
  return (
    <>
      <button type="button" aria-label="Trang trước" disabled={cur <= 1} onClick={() => onChange(cur - 1)}>‹</button>
      {pageWindow(cur, pages).map((n, i) => n === "…"
        ? <span key={"e" + i} style={{ padding: "0 4px", color: "#8c9aab" }}>…</span>
        : <button key={n} type="button" className={n === cur ? "active" : ""} onClick={() => onChange(n)}>{n}</button>)}
      <button type="button" aria-label="Trang sau" disabled={cur >= pages} onClick={() => onChange(cur + 1)}>›</button>
    </>
  );
}

function plainPreview(text, max) {
  const t = String(text || "").split("\n")
    .filter((l) => !/^\s*((https?:\/\/|\/?uploads\/)\S+)\s*$/i.test(l))
    .map((l) => l.replace(/^\s*##\s+/, "").replace(/^\s*(?:[-•*]|\d+[.)])\s+/, "").replace(/\*\*|__/g, "").replace(/(^|\s)\*(\S[^*]*?)\*(?=\s|$)/g, "$1$2"))
    .join(" ").replace(/\s+/g, " ").trim();
  return t.length > max ? t.slice(0, max) + "…" : t;
}
async function copyTextToClipboard(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

// Lời chào -> tiêu đề lớn + dòng phụ (như khung chat mẫu). VD "Xin chào! Tôi có thể giúp gì cho bạn? Đặt câu hỏi cho tôi." -> 2 phần
function splitGreeting(text) {
  const t = String(text || "").trim();
  if (!t) return { title: "Xin chào! Tôi có thể giúp gì cho bạn?", sub: "" };
  const nl = t.indexOf("\n");
  if (nl > 0) return { title: t.slice(0, nl).trim(), sub: t.slice(nl + 1).trim() };
  let cut = t.indexOf("?");
  if (cut < 0 || cut > 140) { const m = t.match(/[.!]\s/); cut = m ? m.index : -1; }
  if (cut < 0) return { title: t, sub: "" };
  return { title: t.slice(0, cut + 1).trim(), sub: t.slice(cut + 1).trim() };
}

      setSheetNote(d.ok ? { ok: true, message: `Đã đồng bộ ${d.entries} mục từ Google Sheet.` } : { ok: false, message: d.error || "Không đồng bộ được." });
    } catch (e) {
      setSheetNote({ ok: false, message: "Lỗi kết nối." });
    } finally {
      setSheetBusy(false);
    }
  }

  // Sao chép 1 dòng (cột A-F, ngăn cách bằng Tab) để dán thẳng vào Google Sheet: ô có xuống dòng/nháy kép được đặt trong nháy kép.
  async function copyRowForSheet(u, withDraft) {
    const others = (u.samples || []).filter((x) => x !== u.question);
    const field = (v) => { const t = String(v == null ? "" : v); return /["\t\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
    const row = [u.question, "", withDraft && u.draftAnswer ? u.draftAnswer : "", "", "", others.join(" | ")].map(field).join("\t");
    let ok = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(row); ok = true; }
    } catch (e) {}
    if (!ok) {
      try {
        const ta = document.createElement("textarea");
        ta.value = row; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select(); ok = document.execCommand("copy"); document.body.removeChild(ta);
      } catch (e) {}
    }
    setUnansweredNote(ok
      ? { ok: true, message: `Đã sao chép${withDraft && u.draftAnswer ? " (kèm bản nháp AI — cần kiểm tra kỹ)" : ""}. Mở Google Sheet, bấm vào ô A của một dòng trống rồi dán (Ctrl+V): câu hỏi và các cách hỏi khác sẽ tự vào đúng cột. Điền thêm Danh mục và Câu trả lời.` }
      : { ok: false, message: "Không sao chép tự động được. Hãy tự chép câu hỏi này: " + u.question });
  }

  async function loadUnanswered(silent) {

  function exportUnansweredExcel() {
    const list = filteredUnanswered;
    if (list.length === 0) {
      setUnansweredNote({ ok: false, message: "Không có câu hỏi nào trong danh sách đang lọc để xuất." });
      return;
    }
    const statusLabel = (st) => (st === "resolved" ? "Đã xử lý" : st === "ignored" ? "Bỏ qua" : "Chưa xử lý");
    const headers = [
      "Câu hỏi", "Danh mục", "Câu trả lời", "Link Video", "Link ảnh (nhiều ảnh cách nhau bởi |)", "Cách hỏi khác (nhiều cách cách nhau bởi |)",
      "Số lần hỏi", "Hỏi gần nhất", "Tình trạng", "Bản nháp của AI (chỉ để tham khảo — kiểm tra rồi chép sang cột Câu trả lời)",
    ];
    const rows = list.map((u) => [
      u.question, "", "", "", "", (u.samples || []).filter((x) => x !== u.question).join(" | "),
      u.count, new Date(u.lastAt).toLocaleString("vi-VN"), statusLabel(u.status), u.draftAnswer || "",
    ]);
    const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
    ws["!cols"] = [{ wch: 50 }, { wch: 12 }, { wch: 70 }, { wch: 25 }, { wch: 25 }, { wch: 45 }, { wch: 10 }, { wch: 20 }, { wch: 12 }, { wch: 70 }];
    const wsNote = XLSX.utils.aoa_to_sheet([
      ["Cách dùng file này"],
      ["- Điền cột C (Câu trả lời) cho những câu bạn muốn đưa vào tài liệu. Có thể điền thêm Danh mục (HD/LOI/CS/335/KHAC), Link Video, Link ảnh."],
      ["- Dòng để trống cột C sẽ được BỎ QUA khi nhập (không thêm gì cả)."],
      ["- Các cột từ G trở đi (số lần hỏi, bản nháp AI...) chỉ để tham khảo, app không đọc khi nhập."],
      ["- Bản nháp AI có thể sai — hãy kiểm tra kỹ trước khi chép sang cột C."],
      ["- Điền xong: tab Quản lý tài liệu → Nhập hàng loạt → Nhập file Excel. Sau đó vào tab Câu hỏi chưa trả lời bấm \"Tự đóng câu đã có đáp án\"."],
    ]);
    wsNote["!cols"] = [{ wch: 120 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Dữ liệu");
    XLSX.utils.book_append_sheet(wb, wsNote, "Hướng dẫn");
    const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
    XLSX.writeFile(wb, `cau-hoi-chua-tra-loi-${stamp}.xlsx`);
    setUnansweredNote({ ok: true, message: `Đã xuất ${list.length} câu hỏi. Điền cột C rồi nhập lại bằng "Nhập file Excel".` });
  }

  function splitMultiValue(raw) {
    return String(raw || "").split(/[\n|]/).map((s) => s.trim()).filter(Boolean);
  }

  function parseBulkImport(text, defaultCategoryId) {
    const entries = [];
    const rawLines = text.split(/\r?\n/);
    const looksTabular = rawLines.some((l) => l.includes("\t"));
    if (looksTabular) {
      rawLines.forEach((line) => {
        if (!line.trim()) return;
        const cols = line.split("\t").map((c) => normalizeLineBreaks(c).trim());
        if (/^(câu hỏi|question)$/i.test(cols[0])) return;
        if (cols.length >= 3 && cols[0] && cols[2]) {
          entries.push({ title: cols[0], category: resolveCategoryId(cols[1], defaultCategoryId), content: cols[2], videoUrl: cols[3] || "", images: splitMultiValue(cols[4]), aliases: splitMultiValue(cols[5]) });
        } else if (cols.length === 2 && cols[0] && cols[1]) {
          entries.push({ title: cols[0], category: defaultCategoryId, content: cols[1], videoUrl: "", images: [], aliases: [] });
        }
      });
      return entries;
    }
    const blocks = normalizeLineBreaks(text).split(/\n\s*\n/);
    blocks.forEach((block) => {
      const qMatch = block.match(/câu hỏi\s*:\s*([\s\S]*?)(?:\n(?:danh mục|câu trả lời|video|hình ảnh|cách hỏi khác)\s*:|$)/i);
      const cMatch = block.match(/danh mục\s*:\s*([\s\S]*?)(?:\n(?:câu trả lời|video|hình ảnh|cách hỏi khác)\s*:|$)/i);
      const aMatch = block.match(/câu trả lời\s*:\s*([\s\S]*?)(?:\n(?:video|hình ảnh|cách hỏi khác)\s*:|$)/i);
      const vMatch = block.match(/video\s*:\s*([\s\S]*?)(?:\n(?:hình ảnh|cách hỏi khác)\s*:|$)/i);
      const iMatch = block.match(/hình ảnh\s*:\s*([\s\S]*?)(?:\ncách hỏi khác\s*:|$)/i);
      const aliasMatch = block.match(/cách hỏi khác\s*:\s*([\s\S]*)/i);
      const question = qMatch ? qMatch[1].trim() : "";
      const answer = aMatch ? aMatch[1].trim() : "";
      const category = cMatch ? resolveCategoryId(cMatch[1], defaultCategoryId) : defaultCategoryId;
      const videoUrl = vMatch ? vMatch[1].trim() : "";
      const images = iMatch ? splitMultiValue(iMatch[1]) : [];
      const aliases = aliasMatch ? splitMultiValue(aliasMatch[1]) : [];
      if (question && answer) entries.push({ title: question, category, content: answer, videoUrl, images, aliases });
    });
    return entries;
  }

  async function importEntries(parsed, source) {
    if (parsed.length === 0) { setImportResult({ added: 0, error: true, source }); return; }
    setAdminError("");
    const r = await fetch("/api/kb/import", { method: "POST", headers: authHeaders(adminToken), body: JSON.stringify({ entries: parsed }) });
    if (r.status === 401) { setAdminError("Sai mã quản trị — vào cuối tab này để nhập lại."); return; }
    const data = await r.json().catch(() => ({}));
    if (data.kb && Array.isArray(data.kb.entries)) setKbEntries(data.kb.entries);
    if (data.ok) {
      setImportResult({ added: data.added, skipped: data.skipped || 0, error: false, source });
    } else {
      if (data.error) setAdminError(data.error);
      setImportResult({ added: 0, error: true, source });
    }
  }

  async function handleExcelFile(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    try {
      const arrayBuffer = await file.arrayBuffer();
      const workbook = XLSX.read(arrayBuffer, { type: "array" });
      const sheetName = workbook.SheetNames.includes("Dữ liệu") ? "Dữ liệu" : workbook.SheetNames[0];
      const sheet = workbook.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
      const parsed = [];
      rows.forEach((row, idx) => {
        if (idx === 0) return;
        const question = normalizeLineBreaks(row[0]).trim();
        const rawCategory = normalizeLineBreaks(row[1]).trim();
        const answer = normalizeLineBreaks(row[2]).trim();
        const videoUrl = normalizeLineBreaks(row[3]).trim();
        const images = splitMultiValue(normalizeLineBreaks(row[4]));
        const aliases = splitMultiValue(normalizeLineBreaks(row[5]));
        if (!question || !answer) return;
        if (question === EXAMPLE_QUESTION) return;
        parsed.push({ title: question, category: resolveCategoryId(rawCategory, CATEGORIES[CATEGORIES.length - 1].id), content: answer, videoUrl, images, aliases });
      });
      await importEntries(parsed, "excel");
    } catch (err) {
      setImportResult({ added: 0, error: true, source: "excel" });
    } finally {
      event.target.value = "";
    }
  }

  function downloadTemplate() {
    const headers = ["Câu hỏi", "Danh mục", "Câu trả lời", "Link Video", "Link ảnh (nhiều ảnh cách nhau bởi |)", "Cách hỏi khác (nhiều cách cách nhau bởi |)"];

  async function uploadImageFile(file) {
    setUploadError("");
    if (sheetWrite) {
      setUploadError("Đang ghi dữ liệu vào Google Sheet nên không tải ảnh lên từ máy được (ổ đĩa Render là tạm thời, ảnh sẽ mất). Hãy dán link ảnh https://… vào ô bên trên, hoặc đưa file ảnh vào thư mục public/uploads trên GitHub rồi ghi /uploads/ten-anh.png.");
      return null;
    }
    setUploadingImage(true);
    try {
      const fd = new FormData();
      fd.append("image", file);
      const r = await fetch("/api/upload-image", {
        method: "POST",
        headers: adminToken ? { "x-admin-token": adminToken } : {},
        body: fd,
      });
      const data = await r.json().catch(() => ({}));
      if (r.status === 401) {
        setUploadError("Sai mã quản trị — nhập mã ở tab Cài đặt trước khi tải ảnh.");
        return null;
      }
      if (!r.ok || !data.ok) {
        setUploadError(data.error || "Tải ảnh lên thất bại.");
        return null;
      }
      return data.url;
    } catch (e) {
      setUploadError("Lỗi kết nối khi tải ảnh lên.");
      return null;
    } finally {
      setUploadingImage(false);
    }
  }

  async function handleImageUpload(event, onSuccess) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    const url = await uploadImageFile(file);
    if (url) onSuccess(url);
    event.target.value = "";
  }

  function addImageUrl(setTarget, url) {
    const trimmed = (url || "").trim();
    if (!trimmed) return;
    setTarget((prev) => ({ ...prev, images: [...(prev.images || []), trimmed] }));
  }

  function removeImageAt(setTarget, index) {
    setTarget((prev) => ({ ...prev, images: prev.images.filter((_, i) => i !== index) }));
  }

  // Chèn link ảnh (dạng 1 dòng riêng) vào đúng vị trí con trỏ trong ô Câu trả lời — để trả lời quy
  // trình nhiều bước có thể xen kẽ ảnh minh hoạ ngay tại đúng bước, thay vì dồn hết ảnh xuống cuối.
  function insertImageIntoContent(ref, contentValue, setContentValue, url) {
    const ta = ref.current;
    if (!ta) {
      const sep = contentValue && !contentValue.endsWith("\n") ? "\n" : "";
      setContentValue(contentValue + sep + url + "\n");
      return;
    }
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    const before = contentValue.slice(0, start);
    const after = contentValue.slice(end);
    const needsNlBefore = before.length > 0 && !before.endsWith("\n");
    const needsNlAfter = after.length > 0 && !after.startsWith("\n");
    const insertion = (needsNlBefore ? "\n" : "") + url + "\n" + (needsNlAfter ? "" : "");
    const newValue = before + insertion + after;
    setContentValue(newValue);
    const newPos = before.length + insertion.length;
    requestAnimationFrame(() => {
      ta.focus();
      ta.setSelectionRange(newPos, newPos);
    });
  }

  async function handleContentPaste(e, ref, contentValue, setContentValue) {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    let imageFile = null;
    for (let i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.startsWith("image/")) {
        imageFile = items[i].getAsFile();
        break;
      }
    }
    if (!imageFile) return;
    e.preventDefault();
    const url = await uploadImageFile(imageFile);
    if (url) insertImageIntoContent(ref, contentValue, setContentValue, url);
  }

  async function handleContentDrop(e, ref, contentValue, setContentValue) {
    const files = e.dataTransfer && e.dataTransfer.files;
    if (!files || files.length === 0) return;
    const imageFile = Array.from(files).find((f) => f.type && f.type.startsWith("image/"));
    if (!imageFile) return;
    e.preventDefault();
    const url = await uploadImageFile(imageFile);
    if (url) insertImageIntoContent(ref, contentValue, setContentValue, url);
  }

  // Bọc vùng đang bôi đen trong textarea bằng ký hiệu định dạng (đậm/nghiêng/gạch chân).
  // Nếu chưa bôi đen gì, chèn chữ mẫu để người dùng biết chỗ cần sửa.
  // Tự động thay "->" vừa gõ xong (ngay trước con trỏ) thành mũi tên "→".
  // Chỉ xét phần TRƯỚC con trỏ để không phá phần đang gõ dở phía sau (khi con trỏ ở giữa văn bản).
  function applyArrowAutoReplace(rawValue, cursorPos) {
    const before = rawValue.slice(0, cursorPos);
    const after = rawValue.slice(cursorPos);
    if (!before.includes("->")) return { value: rawValue, cursorPos, changed: false };
    const newBefore = before.replace(/->/g, "→");
    return { value: newBefore + after, cursorPos: newBefore.length, changed: newBefore.length !== before.length };
  }

  function handleContentChange(e, setValue) {
    const ta = e.target;
    const result = applyArrowAutoReplace(ta.value, ta.selectionStart);
    setValue(result.value);
    if (result.changed) {
      requestAnimationFrame(() => ta.setSelectionRange(result.cursorPos, result.cursorPos));
    }
  }

  // Khi đang gõ trong 1 dòng bullet/số thứ tự và nhấn Enter: tự động nối tiếp cùng kiểu ở dòng mới.
  // Nếu dòng bullet hiện tại đang RỖNG (chỉ có mỗi ký hiệu, chưa gõ chữ) và nhấn Enter -> xoá ký hiệu,
  // thoát khỏi danh sách, chuyển sang dòng trống bình thường (giống Word/Google Docs/Notion).
  function handleContentKeyDown(e, ref, value, setValue) {
    // Phím tắt định dạng: Ctrl+B / Ctrl+I / Ctrl+U (Mac dùng Cmd = metaKey).
    const ctrlOrCmd = e.ctrlKey || e.metaKey;
    if (ctrlOrCmd && !e.altKey) {
      const key = e.key.toLowerCase();
      if (key === "b") { e.preventDefault(); wrapSelection(ref, value, setValue, "**"); return; }
      if (key === "i") { e.preventDefault(); wrapSelection(ref, value, setValue, "*"); return; }
      if (key === "u") { e.preventDefault(); wrapSelection(ref, value, setValue, "__"); return; }
    }

    if (e.key !== "Enter" || e.shiftKey) return;
    const ta = e.target;
    if (ta.selectionStart !== ta.selectionEnd) return; // đang bôi đen thì để hành vi mặc định
    const pos = ta.selectionStart;
    const before = value.slice(0, pos);
    const after = value.slice(pos);
    const lineStart = before.lastIndexOf("\n") + 1;
    const currentLine = before.slice(lineStart);

    const dashMatch = currentLine.match(/^(\s*)-\s+(.*)$/);
    // "*" dễ gõ hơn "•" trên bàn phím thường -> cho phép cả 2 cùng kích hoạt bullet chấm tròn,
    // giữ lại đúng ký tự người dùng đã gõ (nhóm 2) khi tự nối sang dòng tiếp theo.
    const dotMatch = currentLine.match(/^(\s*)([•*])\s+(.*)$/);
    const numMatch = currentLine.match(/^(\s*)(\d+)([.)])\s+(.*)$/);

    let exitList = false;
    let insertion = null;

    if (dashMatch) {
      if (dashMatch[2].trim() === "") exitList = true;
      else insertion = `\n${dashMatch[1]}- `;
    } else if (dotMatch) {
      if (dotMatch[3].trim() === "") exitList = true;
      else insertion = `\n${dotMatch[1]}${dotMatch[2]} `;
    } else if (numMatch) {
      if (numMatch[4].trim() === "") exitList = true;
      else insertion = `\n${numMatch[1]}${parseInt(numMatch[2], 10) + 1}${numMatch[3]} `;
    }

    if (exitList) {
      e.preventDefault();
      const newValue = value.slice(0, lineStart) + after;
      setValue(newValue);
      requestAnimationFrame(() => ta.setSelectionRange(lineStart, lineStart));
      return;
    }
    if (insertion !== null) {
      e.preventDefault();
      const newValue = before + insertion + after;
      const newPos = before.length + insertion.length;
      setValue(newValue);
      requestAnimationFrame(() => ta.setSelectionRange(newPos, newPos));
    }
  }

  function wrapSelection(ref, value, setValue, marker) {
    const ta = ref.current;
    if (!ta) return;
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    const selected = value.slice(start, end) || "chữ";
    const newValue = value.slice(0, start) + marker + selected + marker + value.slice(end);
    setValue(newValue);
    requestAnimationFrame(() => {
      ta.focus();
      ta.setSelectionRange(start + marker.length, start + marker.length + selected.length);
    });
  }

  // Thêm gạch đầu dòng (-) hoặc số thứ tự (1. 2. ...) vào đầu mỗi dòng đang bôi đen.
  function prefixLines(ref, value, setValue, kind) {
    const ta = ref.current;
    if (!ta) return;
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    const selText = value.slice(start, end) || "Mục 1\nMục 2";
    const lines = selText.split("\n");
    const marker = kind === "ol" ? null : kind === "dot" ? "• " : "- ";
    const prefixed = lines.map((l, i) => (kind === "ol" ? `${i + 1}. ${l}` : `${marker}${l}`)).join("\n");
    const newValue = value.slice(0, start) + prefixed + value.slice(end);
    setValue(newValue);
    requestAnimationFrame(() => {
      ta.focus();
      ta.setSelectionRange(start, start + prefixed.length);
    });
  }

  // Bật/tắt "Tiêu đề phần" cho DÒNG hiện tại (nơi đặt con trỏ, hoặc dòng đầu tiên nếu có bôi đen
  // nhiều dòng). Bấm lần nữa trên dòng đã là tiêu đề sẽ bỏ tiêu đề, về lại chữ thường.
  function toggleHeading(ref, value, setValue) {
    const ta = ref.current;
    if (!ta) return;
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    const lineStart = value.lastIndexOf("\n", Math.max(start - 1, 0)) + 1;
    let lineEnd = value.indexOf("\n", end);
    if (lineEnd === -1) lineEnd = value.length;
    const currentLine = value.slice(lineStart, lineEnd);
    const existing = currentLine.match(/^##\s+(.*)$/);
    const newLine = existing ? existing[1] : `## ${currentLine.trim() || "Tiêu đề phần"}`;
    const newValue = value.slice(0, lineStart) + newLine + value.slice(lineEnd);
    setValue(newValue);
    const newPos = lineStart + newLine.length;
    requestAnimationFrame(() => {
      ta.focus();
      ta.setSelectionRange(newPos, newPos);
    });
  }

  async function suggestAliases(titleText, contentText, setTarget) {
    if (!titleText.trim() || !contentText.trim()) {
      setUploadError("Cần điền Câu hỏi và Câu trả lời trước khi nhờ AI gợi ý.");
      return;
    }
    setUploadError("");
    setSuggestingAliases(true);
    try {
      const r = await fetch("/api/suggest-aliases", {
        method: "POST",
        headers: authHeaders(adminToken),
        body: JSON.stringify({ title: titleText, content: contentText }),
      });
      const data = await r.json().catch(() => ({}));
      if (r.status === 401) {
        setUploadError("Sai mã quản trị — nhập mã ở tab Cài đặt trước khi dùng AI gợi ý.");
      } else if (!r.ok || !data.ok) {
        setUploadError(data.error || "AI không tạo được gợi ý, thử lại sau.");
      } else {
        setTarget((prev) => {
          const existing = prev.aliasesText.split("\n").map((s) => s.trim()).filter(Boolean);
          (data.aliases || []).forEach((a) => {
            if (!existing.includes(a)) existing.push(a);
          });
          return { ...prev, aliasesText: existing.join("\n") };
        });
      }
    } catch (e) {
      setUploadError("Lỗi kết nối khi gọi AI gợi ý.");
    } finally {
      setSuggestingAliases(false);
    }
  }

  // ============ SAO LƯU / KHÔI PHỤC (đề phòng mất dữ liệu khi Render khởi động lại container) ============
  function blobToDataUrl(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  async function downloadBackup() {
    setBackingUp(true);
    setBackupResult(null);
    try {
      // Thu thập ảnh đã tải lên qua nút "Tải ảnh lên" (đường dẫn dạng /uploads/...) để nhúng thẳng
      // vào file sao lưu — ảnh dán link ngoài (http/https từ nơi khác) không cần nhúng vì vẫn còn nguyên ở nơi đó.
      const localImagePaths = new Set();
      kbEntries.forEach((e) => {
        getEntryImages(e).forEach((u) => {
          if (u && u.startsWith("/uploads/")) localImagePaths.add(u);
        });
      });

      const uploadedImages = {};
      let failedImages = 0;
      for (const p of localImagePaths) {
        try {
          const r = await fetch(p);
          if (r.ok) uploadedImages[p] = await blobToDataUrl(await r.blob());
          else failedImages++;
        } catch (e) {
          failedImages++; // ảnh đã mất khỏi server (VD sau khi Render deploy lại) — không có gì để nhúng
        }
      }

      const payload = {
        backupType: "chatbot-ho-tro-website",
        backupVersion: 2, // v2: có nhúng ảnh (uploadedImages) — v1 (cũ) chỉ có kb + settings
        exportedAt: new Date().toISOString(),
        kb: { entries: kbEntries },
        settings,
        uploadedImages,
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
      a.href = url;
      a.download = `sao-luu-du-lieu-chatbot-${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      const n = Object.keys(uploadedImages).length;
      let message = `Đã tải file sao lưu${n > 0 ? ` (kèm ${n} ảnh đã tải lên)` : ""}. Hãy upload file này vào thư mục gốc của repo GitHub để server tự nạp lại mỗi lần khởi động.`;
      if (failedImages > 0) {
        message += ` Có ${failedImages} ảnh KHÔNG nhúng được (đã mất khỏi server, có thể do vừa deploy code) — file sao lưu này sẽ không khôi phục lại được (các) ảnh đó. Nếu có bản sao lưu cũ hơn còn ảnh, hãy giữ lại bản đó.`;
      }
      setBackupResult({ ok: failedImages === 0, message });
    } finally {
      setBackingUp(false);
    }
  }

  async function restoreBackup(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    setBackupResult(null);
    setRestoringBackup(true);
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      const entries = parsed?.kb?.entries;
      if (!Array.isArray(entries)) throw new Error("File sao lưu không đúng định dạng (thiếu kb.entries).");

      if (sheetMode) {
        // Tài liệu do Google Sheet quản lý -> không ghi đè; chỉ khôi phục cài đặt và ảnh từ file sao lưu.
      } else {
        const okKb = await saveKbEntries(entries);
        if (!okKb) { setBackupResult({ ok: false, message: lastSaveErrorRef.current || "Sai mã quản trị — không khôi phục được." }); return; }
      }

      if (parsed?.settings) {
        const r = await fetch("/api/settings", { method: "PUT", headers: authHeaders(adminToken), body: JSON.stringify(parsed.settings) });
        if (r.ok) {
          const data = await r.json();
          setSettings(data.settings);
          setSettingsForm(data.settings);
        }
      }

      // Ghi lại các file ảnh đã tải lên (chỉ có ở file sao lưu tạo từ bản mới, backupVersion >= 2)
      const uploadedImages = parsed?.uploadedImages || {};
      const paths = Object.keys(uploadedImages);
      let imageOk = 0;
      let imageFailed = 0;
      for (const p of paths) {
        try {
          const r = await fetch("/api/restore-image", { method: "POST", headers: authHeaders(adminToken), body: JSON.stringify({ path: p, dataUrl: uploadedImages[p] }) });
          if (r.ok) imageOk++; else imageFailed++;
        } catch (e) {
          imageFailed++;
        }
      }

      let message = sheetMode ? `Tài liệu đang lấy từ Google Sheet nên không bị ghi đè; đã khôi phục${parsed?.settings ? " cài đặt và" : ""} ảnh.` : `Đã khôi phục ${entries.length} mục tài liệu${parsed?.settings ? " + cài đặt" : ""}.`;
      if (paths.length > 0) {
        message += ` Đã ghi lại ${imageOk}/${paths.length} ảnh đã tải lên.`;
      } else {
        message += " Lưu ý: file sao lưu này không có ảnh nhúng kèm theo (có thể tạo từ bản cũ trước khi có tính năng này) — nếu tài liệu có ảnh bị vỡ, cần tải lại ảnh thủ công cho các mục đó.";
      }
      setBackupResult({ ok: imageFailed === 0, message });
    } catch (err) {
      setBackupResult({ ok: false, message: err.message || "Không đọc được file sao lưu." });
    } finally {
      setRestoringBackup(false);
      event.target.value = "";
    }
  }

  async function escalateQuestion(index) {
    const msg = messages[index];
    if (!msg) return;
    setMessages((prev) => prev.map((m, i) => (i === index ? { ...m, escalating: true } : m)));
    try {
      const r = await fetch("/api/escalate", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: msg.question || "" }) });
      const data = await r.json();
      setMessages((prev) => prev.map((m, i) => (i === index ? { ...m, escalating: false, escalated: !!data.ok, escalateError: data.ok ? "" : (data.error || "Chưa gửi được.") } : m)));
      loadEscalations();
      loadUnanswered(true);
    } catch (e) {
      setMessages((prev) => prev.map((m, i) => (i === index ? { ...m, escalating: false, escalateError: "Lỗi kết nối." } : m)));
    }
  }

  function matchKb(query) {
    const queryTokens = tokenizeVN(query);
    if (!kbEntries || kbEntries.length === 0 || queryTokens.length === 0) return { type: "none" };
    const queryBigrams = bigramsOfTokens(queryTokens);
    const scored = kbIndex.indexed
      .map((idxEntry) => ({ entry: idxEntry.entry, score: scoreKbEntryTfidf(queryTokens, queryBigrams, idxEntry, kbIndex.df, kbIndex.N) }))
      .sort((a, b) => b.score - a.score);

    const best = scored[0];
    if (!best || best.score < KB_MATCH_THRESHOLD) return { type: "none" };

    // Gom mọi mục có điểm sát với mục cao nhất (trong phạm vi margin) -> coi là "đồng hạng",
    // máy đang phân vân giữa các mục này. Thay vì đoán liều 1 mục, cho người dùng tự chọn.
    const topTier = scored.filter((s) => best.score - s.score < KB_MATCH_MIN_MARGIN);
    if (topTier.length > 1) {
      return { type: "ambiguous", candidates: topTier.slice(0, 4).map((s) => s.entry) };
    }
    return { type: "confident", entry: best.entry };
  }

  function sendMessage(override) {
    const question = (typeof override === "string" ? override : input).trim();
    if (!question || loading) return;
    setMessages((prev) => [...prev, { role: "user", text: question }]);
    setInput("");

    const result = matchKb(question);

    if (result.type === "confident") {
      const matched = result.entry;
      setMessages((prev) => [
        ...prev,
        {
          role: "assistant",
          source: "kb",
          text: matched.content,
          matchedTitle: matched.title,
          videoUrl: matched.videoUrl || "",
          images: getGalleryImages(matched),
          question,
        },
      ]);
      return;
    }

    if (result.type === "ambiguous") {
      setMessages((prev) => [
        ...prev,
        { role: "assistant", source: "ambiguous", text: "Mình tìm thấy vài mục có thể phù hợp, ý bạn là mục nào?", candidates: result.candidates, question },
      ]);
      return;
    }

    logNoMatch(question);
    setMessages((prev) => [
      ...prev,
      { role: "assistant", source: "nomatch", text: settings.noResultMessage || "Không tìm thấy nội dung phù hợp trong tài liệu đã nạp.", question },
    ]);
  }

  function selectAmbiguousCandidate(index, entry) {
    setMessages((prev) =>
      prev.map((m, i) =>
        i === index
          ? {
              role: "assistant",
              source: "kb",
              text: entry.content,
              matchedTitle: entry.title,
              videoUrl: entry.videoUrl || "",
              images: getGalleryImages(entry),
              question: m.question,
            }
          : m
      )
    );
  }

  async function askAI(index) {
    const msg = messages[index];
    if (!msg || !msg.question) return;
    setMessages((prev) => prev.map((m, i) => (i === index ? { ...m, asking: true } : m)));
    setLoading(true);
    try {
      const priorMessages = messages
        .slice(0, index)
        .filter((m) => !(m.role === "assistant" && (m.source === "nomatch" || m.source === "error" || m.source === "ambiguous")));
      const history = [...priorMessages.map((m) => ({ role: m.role, text: m.text })), { role: "user", text: msg.question }];
      // Cho server biết câu hỏi này đến từ tình huống nào (để ghi nhận đúng lý do chưa trả lời được).
      const origin = msg.source === "error" ? (msg.matchedTitle ? "kb" : Array.isArray(msg.candidates) ? "ambiguous" : "nomatch") : msg.source;
      const context = ["nomatch", "ambiguous", "kb"].includes(origin) ? origin : "nomatch";
      const shownTitles = origin === "kb" ? [msg.matchedTitle].filter(Boolean) : origin === "ambiguous" ? (msg.candidates || []).map((c) => c.title) : [];
      const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ history, context, shownTitles }) });
      const data = await r.json();
      if (data.ok) {
        setMessages((prev) =>
          prev.map((m, i) =>
            i === index
              ? { role: "assistant", source: "ai", text: data.text, needsEscalation: data.needsEscalation, question: msg.question, escalated: false, asking: false }
              : m
          )
        );
      } else {
        setMessages((prev) => prev.map((m, i) => (i === index ? { ...m, source: "error", asking: false, text: "Đã có lỗi: " + (data.error || "không rõ nguyên nhân.") } : m)));
      }
    } catch (e) {
      setMessages((prev) => prev.map((m, i) => (i === index ? { ...m, source: "error", asking: false, text: "Đã có lỗi khi kết nối tới hệ thống trả lời. Vui lòng thử lại." } : m)));
    } finally {
      setLoading(false);
      loadUnanswered(true); // server vừa ghi nhận kết quả (AI trả lời được / không biết)
    }
  }

            {((s.skipped && s.skipped.length > 0) || (s.warnings && s.warnings.length > 0)) && (
              <details style={{ marginTop: 8 }}>
                <summary style={{ cursor: "pointer", fontSize: 12, fontWeight: 600, color: "#8A6D00" }}>Xem dòng bị bỏ qua / cảnh báo trong Sheet</summary>
                <ul style={{ fontSize: 12, color: "#5b6b7e", lineHeight: 1.6, margin: "6px 0", paddingLeft: 20 }}>
                  {(s.skipped || []).slice(0, 30).map((x, i) => <li key={"k" + i}>Dòng {x.row}: {x.reason}{x.question ? ` — "${x.question}"` : ""} (không đưa vào chatbot)</li>)}
                  {(s.warnings || []).slice(0, 30).map((w, i) => <li key={"w" + i}>{w}</li>)}

  const reasonCount = (u, k) => (u.reasons && u.reasons[k]) || 0;
  const needsAttention = (u) => reasonCount(u, "ai_unknown") + reasonCount(u, "escalated") > 0;
  const unansweredScore = (u) => (u.count || 0) + 2 * (reasonCount(u, "ai_unknown") + reasonCount(u, "escalated"));
  const unansweredCounts = {
    all: unanswered.length,
    new: unanswered.filter((u) => u.status === "new").length,
    resolved: unanswered.filter((u) => u.status === "resolved").length,
    ignored: unanswered.filter((u) => u.status === "ignored").length,
    attention: unanswered.filter((u) => u.status === "new" && needsAttention(u)).length,
    ai_ok: unanswered.filter((u) => u.status === "new" && reasonCount(u, "ai_answered") > 0 && !needsAttention(u)).length,
  };
  unansweredCounts.open = unansweredCounts.new;
  unansweredCounts.closed = unansweredCounts.resolved + unansweredCounts.ignored;
  const openUnansweredCount = unansweredCounts.new;
  const filteredUnanswered = unanswered
    .filter((u) => {
      if (unansweredFilter === "new" || unansweredFilter === "open") return u.status === "new";
      if (unansweredFilter === "resolved") return u.status === "resolved";
      if (unansweredFilter === "ignored") return u.status === "ignored";
      if (unansweredFilter === "attention") return u.status === "new" && needsAttention(u);
      if (unansweredFilter === "ai_ok") return u.status === "new" && reasonCount(u, "ai_answered") > 0 && !needsAttention(u);
      return true;
    })
    .sort((a, b) => unansweredScore(b) - unansweredScore(a) || String(b.lastAt).localeCompare(String(a.lastAt)));

  const filteredEntries = kbEntries.filter((e) => {
    const matchesCategory = filterCategory === "ALL" || e.category === filterCategory;
    const q = searchQuery.trim().toLowerCase();
    const matchesQuery =
      !q ||
      e.title.toLowerCase().includes(q) ||
      e.content.toLowerCase().includes(q) ||
      (Array.isArray(e.aliases) && e.aliases.some((a) => a.toLowerCase().includes(q)));
    return matchesCategory && matchesQuery;
  });

  // ===== Hàm cho giao diện mới =====
  // Câu hỏi mở đầu (nút bấm dưới lời chào khi mở chat): lưu trong cài đặt hội thoại
  function setOqList(list) { setSettingsForm((p) => ({ ...p, openingQuestions: list })); setSettingsSaved(false); }
  function addOpeningQuestion() { if (oqList.length < OQ_MAX) setOqList([...oqList, { label: "", question: "" }]); }
  function updateOpeningQuestion(i, patch) { setOqList(oqList.map((q, k) => (k === i ? { ...q, ...patch } : q))); }
  function removeOpeningQuestion(i) { setOqList(oqList.filter((_, k) => k !== i)); }

  // Mascot nổi trong màn hình demo: bấm = mở/đóng chat, kéo = đổi vị trí (giới hạn trong khung)
  function fabPointerDown(e) {
    const frame = demoRef.current;
    if (!frame) return;
    const fr = frame.getBoundingClientRect();
    const r = e.currentTarget.getBoundingClientRect();
    fabDrag.current = { active: true, moved: false, sx: e.clientX, sy: e.clientY, sr: fr.right - r.right, sb: fr.bottom - r.bottom };
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function fabPointerMove(e) {
    const d = fabDrag.current;
    if (!d.active || !demoRef.current) return;
    const dx = e.clientX - d.sx, dy = e.clientY - d.sy;
    if (Math.abs(dx) + Math.abs(dy) > 5) { d.moved = true; setFabDragging(true); }
    if (!d.moved) return;
    const fr = demoRef.current.getBoundingClientRect();
    setFabPos({ right: Math.max(10, Math.min(fr.width - 65 - 10, d.sr - dx)), bottom: Math.max(10, Math.min(fr.height - 65 - 10, d.sb - dy)) });
  }
  function fabPointerUp(e) {
    const d = fabDrag.current;
    if (!d.active) return;
    d.active = false;
    setFabDragging(false);
    try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (err) {}
    if (!d.moved) setChatOpen((v) => !v);
  }
  function fabPointerCancel() { fabDrag.current.active = false; setFabDragging(false); }

  function toast(text) {
    setToastMsg(text);
    clearTimeout(toastTimerRef.current);
    toastTimerRef.current = setTimeout(() => setToastMsg(null), 2400);
  }

  function openAdd() {

    setAddOpen(true);
  }

  // Công tắc "Hiển thị" / "Câu hỏi gợi ý" ở từng dòng của bảng
  async function toggleFlag(entry, flag, value) {
    if (sheetReadOnly) return;
    setAdminError("");
    const patch = { [flag]: value };
    if (flag === "visible" && !value) patch.suggested = false; // câu hỏi bị ẩn thì không thể là câu hỏi gợi ý
    setFlagBusy(entry.id + flag);
    let ok;
    if (sheetWrite) ok = await sheetEntryCall("PUT", entry.id, { ...entry, ...patch });
    else ok = await saveKbEntries(kbEntries.map((e) => (e.id === entry.id ? { ...e, ...patch } : e)));
    setFlagBusy("");
    if (ok) {
      toast(flag === "visible" ? (value ? "Đã bật hiển thị câu hỏi" : "Đã tắt hiển thị câu hỏi") : (value ? "Đã thêm vào câu hỏi gợi ý" : "Đã bỏ khỏi câu hỏi gợi ý"));
    }
  }

  async function addCustomCategory() {
    const name = categoryName.replace(/[\r\n|]+/g, " ").replace(/\s+/g, " ").trim();
    if (!name) { toast("Nhập tên danh mục"); return; }
    if (allCategories.some((c) => c.label.toLowerCase() === name.toLowerCase() || c.id.toLowerCase() === name.toLowerCase())) { toast("Danh mục này đã tồn tại"); return; }
    setAdminError("");
    const next = [...(settings.customCategories || []), name];
    const r = await fetch("/api/settings", { method: "PUT", headers: authHeaders(adminToken), body: JSON.stringify({ customCategories: next }) });
    if (r.status === 401) { setAdminError("Sai mã quản trị — vào tab Cài đặt hệ thống để nhập lại."); return; }
    const d = await r.json().catch(() => null);
    if (d && d.settings) {
      setSettings((p) => ({ ...p, ...d.settings }));
      setSettingsForm((p) => ({ ...p, customCategories: d.settings.customCategories }));
    }
    setCategoryOpen(false);
    setFilterCategory(name);
    setLibPage(1);
    toast("Đã tạo danh mục");
  }

  // "Thêm vào cách hỏi khác": chọn câu hỏi có sẵn để gắn câu hỏi chưa trả lời vào làm 1 cách hỏi khác
  async function chooseAliasTarget(entry) {
    if (aliasPicker && aliasPicker.mode === "opening") {
      setAliasPicker(null);
      if (oqList.some((q) => String(q.question || "").trim().toLowerCase() === entry.title.trim().toLowerCase())) { toast("Câu hỏi này đã có trong danh sách mở đầu"); return; }
      if (oqList.length >= OQ_MAX) { toast("Tối đa " + OQ_MAX + " câu hỏi mở đầu"); return; }
      setOqList([...oqList, { label: "", question: entry.title }]);
      toast("Đã thêm câu hỏi mở đầu. Nhớ bấm Lưu cấu hình");
      return;
    }
    const rec = aliasPicker && aliasPicker.rec;
    if (!rec) return;
    setAliasPicker(null);
    if (sheetReadOnly) {
      const ok = await copyTextToClipboard(rec.question);
      setUnansweredNote({
        ok,
        message: ok
          ? `Đã sao chép "${rec.question}". Mở Google Sheet, tìm dòng "${entry.title}" và dán vào ô "Cách hỏi khác" (cột F), các cách hỏi cách nhau bằng dấu |.`
          : `Không sao chép tự động được. Hãy tự thêm "${rec.question}" vào cột F (Cách hỏi khác) của dòng "${entry.title}" trong Google Sheet.`,
      });
      return;
    }
    setFromUnanswered({ id: rec.id, question: rec.question, withDraft: false, asAlias: true, target: entry.title });
    startEdit(entry, rec.question);
  }

  async function deleteUnansweredMany(ids) {
    if (!ids.length) return;
    if (!window.confirm(`Xóa ${ids.length} mục đã chọn?`)) return;
    try {
      for (const id of ids) {
        const r = await fetch(`/api/unanswered/${id}`, { method: "DELETE", headers: authHeaders(adminToken) });
        if (r.status === 401) { setUnansweredError(NEED_TOKEN_MSG); return; }
      }
    } catch (e) {
      setUnansweredError("Lỗi kết nối.");
      return;
    }
    setSelectedUn(new Set());
    await loadUnanswered();
    setUnansweredNote({ ok: true, message: `Đã xóa ${ids.length} câu hỏi.` });
  }

  // Phần thân của hộp thoại Thêm / Sửa câu hỏi (dùng chung cho cả 2 chế độ)
  function renderQuestionFormFields(isEdit) {

                : <>{fromUnanswered.withDraft && <strong>Câu trả lời bên dưới là bản nháp do AI soạn — hãy kiểm tra kỹ trước khi lưu. </strong>}Sau khi bấm <strong>Lưu</strong>, câu hỏi này sẽ tự được đánh dấu "Đã xử lý".</>}{" "}
              <button type="button" onClick={() => setFromUnanswered(null)} style={{ background: "transparent", border: "none", color: "#076ab7", fontWeight: 700, cursor: "pointer", padding: 0 }}>✕ Bỏ liên kết</button>
            </div>
          </div>

        <label className="field wide">
